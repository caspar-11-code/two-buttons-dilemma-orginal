      document.getElementById('btn-questions').textContent = txt.btnQuestions;

      // Essays button — visible always, but visually locked until 16/16 + first vote
      const btnEssays = document.getElementById('btn-essays-intro');
      const isEssaysUnlocked = essaysUnlocked();
      btnEssays.textContent = isEssaysUnlocked
        ? txt.essaysButton
        : `${txt.essaysButton.replace(' ↗', '')} (${unlockedBlue.length + unlockedRed.length}/16)`;
      btnEssays.classList.toggle('btn-personality-active', isEssaysUnlocked);
      btnEssays.classList.toggle('btn-personality-locked', !isEssaysUnlocked);

      document.getElementById('footer-text').textContent = txt.footerText;
      document.getElementById('footer-privacy').textContent = txt.footerPrivacy;

      // SEO: update document title + meta tags per language
      const pageTitle = currentLang === 'en'
        ? 'Two Buttons — A test of who you become when no one is watching'
        : 'Dwa przyciski — test tego, kim się stajesz, kiedy nikt nie patrzy';
      const pageDesc = currentLang === 'en'
        ? 'An interactive moral dilemma game based on game theory and behavioral research. Choose red or blue. 16 questions that challenge whoever you think you are.'
        : 'Interaktywna gra dylematu moralnego oparta na teorii gier i badaniach behawioralnych. Wybierz czerwony albo niebieski. 16 pytań, które kwestionują to, kim myślisz że jesteś.';
      document.title = pageTitle;
      const setMeta = (sel, content) => {
        const el = document.querySelector(sel);
        if (el) el.setAttribute('content', content);
      };
      setMeta('meta[name="description"]', pageDesc);
      setMeta('meta[property="og:title"]', pageTitle);
      setMeta('meta[property="og:description"]', pageDesc);
      setMeta('meta[property="og:locale"]', currentLang === 'en' ? 'en_US' : 'pl_PL');
      setMeta('meta[name="twitter:title"]', pageTitle);
      setMeta('meta[name="twitter:description"]', pageDesc);
    }

    function updateStats() {
      const txt = t();
      document.getElementById('stats-label').textContent = txt.statsLabel;
      document.getElementById('stat-label-total').textContent = txt.statTotal;
      document.getElementById('stat-label-red').textContent = txt.statRed;
      document.getElementById('stat-label-blue').textContent = txt.statBlue;
      document.getElementById('stat-label-questions').textContent = txt.statQuestions;
      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-red').textContent = stats.red;
      document.getElementById('stat-blue').textContent = stats.blue;
      const totalUnlocked = unlockedBlue.length + unlockedRed.length;
      document.getElementById('stat-questions').textContent = totalUnlocked + '/16';

      const btnQ = document.getElementById('btn-questions');
      btnQ.classList.toggle('hidden', totalUnlocked === 0);

      const pattern = document.getElementById('pattern');
      if (stats.total < 3) {
        pattern.classList.add('hidden');
      } else {
        const bluePct = Math.round(stats.blue / stats.total * 100);
        let text;
        if (bluePct >= 70) text = txt.patternHigh(bluePct);
        else if (bluePct >= 40) text = txt.patternMid(bluePct);
        else if (bluePct >= 15) text = txt.patternLow(bluePct);
        else text = txt.patternVeryLow(bluePct);
        pattern.textContent = text;
        pattern.classList.remove('hidden');
      }
    }

    function simulateBluePercent() {
      const r = Math.random();
      // 7% — prawie wszyscy czerwony (uruchamia resultRedAllRed)
      if (r < 0.07) return Math.random() * 0.9;
      // 25% — niebieski wyraźnie wygrywa (resultBlueWon / resultRedBlueWon)
      if (r < 0.32) return 52 + Math.random() * 30;
      // 18% — blisko progu po stronie niebieskiej (drama 50/50)
      if (r < 0.50) return 43 + Math.random() * 12;
      // 30% — typowa kooperacja laboratoryjna (~lab baseline)
      if (r < 0.80) return 28 + Math.random() * 17;
      // 20% — niska kooperacja
      return 6 + Math.random() * 20;
    }

    function getResult(choice, bluePct) {
      const txt = t();
      const blueWon = bluePct > 50;
      const everyoneRed = bluePct < 1;
      if (choice === 'red') {
        if (blueWon) return txt.resultRedBlueWon;
        if (everyoneRed) return txt.resultRedAllRed;
        return txt.resultRedBlueDied;
      }
      return blueWon ? txt.resultBlueWon : txt.resultBlueDied;
    }

    function unlockNextQuestion(choice) {
      const txt = t();
      const arr = choice === 'blue' ? txt.questionsBlue : txt.questionsRed;
      const unlocked = choice === 'blue' ? unlockedBlue : unlockedRed;
      if (unlocked.length >= arr.length) return null;
      const idx = unlocked.length;
      unlocked.push(idx);
      return { text: arr[idx], number: idx + 1, side: choice, total: arr.length };
    }

    function getPattern(choice, bluePct, msg) {
      const txt = t();
      const p = bluePct.toFixed(1);
      return {
        title: msg.title,
        sub: typeof msg.sub === 'function' ? msg.sub(p) : msg.sub,
        detail: msg.detail(p),
        mood: msg.mood
      };
    }

    function hideAll() {
      ['screen-intro', 'screen-result', 'screen-reality', 'screen-questions', 'screen-personality', 'screen-essays', 'screen-essay-detail'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }

    function choose(choice) {
      // Sound: click immediately for haptic feel
      playClick(choice);

      // Easter egg tracking
      easterTrackChoice(choice);
      easterTrackTiming(choice);

      // Record first-ever vote for this device (no-op if already voted or no API)
      const wasFirstVote = !firstChoice;
      if (wasFirstVote) {
        // Optimistic UI update for immediate feedback
        // We DO NOT set firstChoice here — recordFirstVote does that ONLY after server confirms
        // (this way, if POST fails, the user can retry next time)
        globalStats[choice] = (globalStats[choice] || 0) + 1;
        globalStats.total = (globalStats.total || 0) + 1;
        renderLiveBanner();
        flashLiveStat(choice);
        recordFirstVote(choice);
      }

      const bluePct = simulateBluePercent();
      const rawMsg = getResult(choice, bluePct);
      const msg = getPattern(choice, bluePct, rawMsg);
      stats.total++;
      if (choice === 'red') stats.red++; else stats.blue++;
      const newQ = unlockNextQuestion(choice);
      const txt = t();
      const blueWidth = Math.round(bluePct);
      const redWidth = 100 - blueWidth;

      const noNewQ = !newQ ? `<p style="font-size: 13px; opacity: 0.6; font-style: italic; margin-top: 16px;">${currentLang === 'en' ? 'All ' + (choice === 'blue' ? 'blue' : 'red') + '-questioning unlocked. Try the other side.' : 'Wszystkie pytania ' + (choice === 'blue' ? 'kwestionujące niebieski' : 'kwestionujące czerwony') + ' odkryte. Spróbuj drugiego przycisku.'}</p>` : '';

      const newQHtml = newQ ? `
        <div class="new-question ${choice}">
          <div class="new-question-label">${txt.newQuestion} · ${choice === 'blue' ? txt.blue : txt.red} #${newQ.number}/${newQ.total}</div>
          <div class="new-question-text">${newQ.text}</div>
        </div>
      ` : '';

      // Provocative threshold question — appears after 3+ rounds, alternates red/blue framing
      const showThreshold = stats.total >= 3 && stats.total % 2 === 1;
      const thresholdHtml = showThreshold ? `
        <div class="threshold-question">
          <div class="threshold-question-label">${txt.thresholdQuestionLabel}</div>
          <div class="threshold-question-text">${choice === 'red' ? txt.thresholdQuestionRed : txt.thresholdQuestionBlue}</div>
        </div>
      ` : '';

      // Real-world live results section (only if we have any data)
      const liveResultsHtml = (apiAvailable && globalStats.total > 0) ? `
        <div class="result-live-section">
          <div class="result-section-label">
            ${wasFirstVote ? '<span class="first-vote-badge">' + txt.firstVoteBadge + '</span>' : ''}
            ${txt.liveResultsHeader}
          </div>
          ${wasFirstVote ? `<p style="font-size: 13px; line-height: 1.55; margin-top: 8px; opacity: 0.85;">${txt.firstVoteCounted(choice === 'red' ? txt.red.toLowerCase() : txt.blue.toLowerCase())}</p>` : ''}
          <div class="live-stats-grid">
            <div class="live-stat">
              <div class="live-stat-label">${txt.liveTotalLabel}</div>
              <div class="live-stat-value">${fmtNum(globalStats.total)}</div>
            </div>
            <div class="live-stat">
              <div class="live-stat-label">${txt.liveRedLabel}</div>
              <div class="live-stat-value red">${fmtNum(globalStats.red)}</div>
              <div class="live-stat-pct">${pct(globalStats.red, globalStats.total)}</div>
            </div>
            <div class="live-stat">
              <div class="live-stat-label">${txt.liveBlueLabel}</div>
              <div class="live-stat-value blue">${fmtNum(globalStats.blue)}</div>
              <div class="live-stat-pct">${pct(globalStats.blue, globalStats.total)}</div>
            </div>
          </div>
        </div>
      ` : '';

      const html = `
        <div class="result ${msg.mood}">
          <div class="result-title">${msg.title}</div>
          <div class="result-sub">${msg.sub}</div>
          <div class="histogram">
            <div class="histogram-bar">
              <div class="histogram-blue" style="width: ${blueWidth}%"></div>
              <div class="histogram-red" style="width: ${redWidth}%"></div>
            </div>
            <div class="histogram-threshold"></div>
            <div class="histogram-label">${currentLang === 'en' ? 'threshold 50% · blue: ' : 'próg 50% · niebieski: '}${bluePct.toFixed(1)}%</div>
          </div>
          <div class="result-detail">${msg.detail}</div>
          <div class="result-section">
            <div class="result-section-label">${txt.comparison}</div>
            <div class="result-section-text">${choice === 'blue' ? txt.comparisonBlue : txt.comparisonRed}</div>
          </div>
          ${liveResultsHtml}
          ${newQHtml}
          ${thresholdHtml}
          ${noNewQ}
          <div class="result-actions">
            <button class="btn btn-play-again" onclick="playAgain()">${txt.playAgain}</button>
            <button class="btn" onclick="showQuestions()">${txt.seeQuestions} (${unlockedBlue.length + unlockedRed.length}/16) ↗</button>
            <button class="btn" onclick="showReality()">${txt.seeReality}</button>
            <button class="btn ${stats.total >= 5 ? 'btn-personality-active' : 'btn-personality-locked'}" onclick="showPersonality()">${txt.personalityButtonShort} ${stats.total >= 5 ? '↗' : `(${stats.total}/5)`}</button>
            ${essaysUnlocked() ? `<button class="btn btn-personality-active" onclick="showEssays()">${txt.essaysButton}</button>` : ''}
          </div>
        </div>
      `;

      hideAll();
      const r = document.getElementById('screen-result');
      r.innerHTML = html;
      r.classList.remove('hidden');
      document.getElementById('stats').classList.remove('hidden');
      updateStats();

      // Mood sound — slight delay so it follows the reveal animation
      setTimeout(() => {
        if (msg.mood === 'death') playDeath();
        else if (msg.mood === 'triumph') playTriumph();
        else if (msg.mood === 'heavy' || msg.mood === 'shame') playHeavy();
      }, 350);
    }

    function playAgain() {
      hideAll();
      document.getElementById('screen-intro').classList.remove('hidden');
    }

    function showReality() {
      const txt = t();
      let verdictHtml = '';
      if (stats.total >= 3) {
        const bluePct = Math.round(stats.blue / stats.total * 100);
        let verdict;
        if (bluePct >= 70) verdict = txt.verdictHigh(bluePct);
        else if (bluePct >= 40) verdict = txt.verdictMid(bluePct);
        else if (bluePct >= 15) verdict = txt.verdictLow(bluePct);
        else verdict = txt.verdictVeryLow(bluePct);
        verdictHtml = `<div class="verdict"><div class="verdict-label">${txt.yourPattern}</div><div class="verdict-text">${verdict}</div></div>`;
      }

      const cardsHtml = txt.researchData.map(d => `
        <div class="data-card">
          <div class="data-card-label">${d.label}</div>
          <div class="data-card-headline">${d.headline}</div>
          <div class="data-card-detail">${d.detail}</div>
        </div>
      `).join('');

      const html = `
        <h2 class="panel-title">${txt.researchTitle}</h2>
        <p class="panel-sub">${txt.researchSub}</p>
        ${verdictHtml}
        ${cardsHtml}
        <div class="summary">
          <div class="summary-label">${txt.mainPattern}</div>
          <div class="summary-headline">${txt.mainPatternHeadline}</div>
          <div class="summary-detail">${txt.mainPatternDetail}</div>
        </div>
        <div class="closing-quote">${txt.closingQuote}</div>
        <div style="text-align: center;">
          <button class="btn" onclick="playAgain()">${txt.backToGame}</button>
        </div>
      `;
      hideAll();
      const r = document.getElementById('screen-reality');
      r.innerHTML = html;
      r.classList.remove('hidden');
    }

    function showQuestions() {
      const txt = t();
      const totalUnlocked = unlockedBlue.length + unlockedRed.length;

      let metaInsight = '';
      if (totalUnlocked === 16) {
        metaInsight = `
          <div class="summary">
            <div class="summary-label">${txt.allUnlocked}</div>
            <div class="summary-headline">${txt.allUnlockedHeadline}</div>
            <div class="summary-detail">${txt.allUnlockedDetail}</div>
          </div>
        `;
      } else if (totalUnlocked >= 8) {
        metaInsight = `<div class="verdict"><div class="verdict-text">${txt.halfwayInsight(totalUnlocked)}</div></div>`;
      }

      let blueCards = '';
      for (let i = 0; i < txt.questionsBlue.length; i++) {
        const isUnlocked = unlockedBlue.includes(i);
        if (isUnlocked) {
          blueCards += `
            <div class="question-card unlocked-blue">
              <div class="question-card-label">${txt.blue} #${i + 1}</div>
              <div class="question-card-text">${txt.questionsBlue[i]}</div>
            </div>
          `;
        } else {
          blueCards += `
            <div class="question-card locked">
              <div class="question-card-label">${txt.blue} #${i + 1}</div>
              <div class="question-card-text">${txt.playLockedBlue}</div>
            </div>
          `;
        }
      }

      let redCards = '';
      for (let i = 0; i < txt.questionsRed.length; i++) {
        const isUnlocked = unlockedRed.includes(i);
        if (isUnlocked) {
          redCards += `
            <div class="question-card unlocked-red">
              <div class="question-card-label">${txt.red} #${i + 1}</div>
              <div class="question-card-text">${txt.questionsRed[i]}</div>
            </div>
          `;
        } else {
          redCards += `
            <div class="question-card locked">
              <div class="question-card-label">${txt.red} #${i + 1}</div>
              <div class="question-card-text">${txt.playLockedRed}</div>
            </div>
          `;
        }
      }

      const html = `
        <h2 class="panel-title">${txt.questionsTitle}</h2>
        <p class="panel-sub">${txt.questionsSub}</p>
        <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 24px;">${txt.questionsCount}: <span style="color: var(--accent);">${totalUnlocked}/16</span></p>
        ${metaInsight}
        <div class="questions-section">
          <div class="questions-section-title">${txt.bluePlays} (${unlockedBlue.length}/8)</div>
          ${blueCards}
        </div>
        <div class="questions-section">
          <div class="questions-section-title">${txt.redPlays} (${unlockedRed.length}/8)</div>
          ${redCards}
        </div>
        <div style="text-align: center; margin-top: 32px;">
          <button class="btn" onclick="playAgain()">${txt.backToGame}</button>
        </div>
      `;
      hideAll();
      const r = document.getElementById('screen-questions');
      r.innerHTML = html;
      r.classList.remove('hidden');
    }

    // ───────────────────────────────────────────────
    // ESSAYS — unlocked after 16/16 questions + first vote
    // ───────────────────────────────────────────────

    let essaysSkipped = false; // Set to true when user chooses to skip the 16 questions

    function essaysUnlocked() {
      const totalUnlocked = unlockedBlue.length + unlockedRed.length;
      // Either: completed all 16 questions + voted, OR: voted + chose to skip
      return !!firstChoice && (totalUnlocked >= 16 || essaysSkipped);
    }

    function skipToEssays() {
      if (!firstChoice) return; // Vote is still required
      essaysSkipped = true;
      showEssays();
    }

    function showEssays() {
      const txt = t();
      const screen = document.getElementById('screen-essays');

      let html = `
        <div class="essays-intro">
          <h2>${txt.essaysListTitle}</h2>
          <p>${txt.essaysListSub}</p>
        </div>
      `;

      if (!essaysUnlocked()) {
        const totalUnlocked = unlockedBlue.length + unlockedRed.length;
        const hasVoted = !!firstChoice;
        // Skip option only available after voting
        const skipBlock = hasVoted ? `
          <div class="essays-skip">
            <div class="essays-skip-label">${txt.essaysSkipLabel}</div>
            <p class="essays-skip-explain">${txt.essaysSkipExplain}</p>
            <button class="essays-skip-btn" onclick="skipToEssays()">${txt.essaysSkipBtn}</button>
          </div>
        ` : `
          <div class="essays-skip essays-skip-disabled">
            <p class="essays-skip-explain">${txt.essaysSkipNeedVote}</p>
          </div>
        `;
        html += `
          <div class="essays-locked">
            <div class="essays-locked-icon">§</div>
            <div class="essays-locked-text">${txt.essaysListLocked}</div>
            <div class="essays-locked-progress">${txt.essaysListLockedProgress(totalUnlocked, hasVoted)}</div>
            <div style="margin-top: 28px;">
              <button class="btn" onclick="playAgain()">${txt.personalityBack}</button>
            </div>
            ${skipBlock}
          </div>
        `;
      } else {
        html += `<div class="essays-list">`;
        txt.essays.forEach((essay) => {
          html += `
            <div class="essay-card" onclick="showEssay('${essay.id}')">
              <div class="essay-card-number">${essay.number}</div>
              <div class="essay-card-content">
                <div class="essay-card-eyebrow">${essay.eyebrow}</div>
                <div class="essay-card-title">${essay.title}</div>
                <div class="essay-card-meta">
                  <span class="essay-card-time">${essay.readTime} ${txt.essaysReadTime}</span>
                  <span class="essay-card-action">${txt.essaysRead}</span>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
        html += `
          <div style="text-align: center; margin-top: 36px;">
            <button class="btn" onclick="playAgain()">${txt.personalityBack}</button>
          </div>
        `;
      }

      hideAll();
      screen.innerHTML = html;
      screen.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showEssay(essayId) {
      const txt = t();
      const screen = document.getElementById('screen-essay-detail');
      const idx = txt.essays.findIndex(e => e.id === essayId);
      if (idx === -1) return;
      const essay = txt.essays[idx];
      const nextEssay = txt.essays[idx + 1];

      const sourcesHtml = essay.sources && essay.sources.length ? `
        <div class="essay-sources">
          <div class="essay-sources-label">${txt.essaysSourcesLabel}</div>
          <ul>
            ${essay.sources.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a></li>`).join('')}
          </ul>
        </div>
      ` : '';

      const nextHtml = nextEssay
        ? `<button class="btn" onclick="showEssay('${nextEssay.id}')">${txt.essaysNext}</button>`
        : '';

      const html = `
        <div class="essay-detail">
          <div class="essay-detail-eyebrow">${essay.eyebrow}</div>
          <h1>${essay.title}</h1>
          <div class="essay-detail-meta">${essay.readTime} ${txt.essaysReadTime}</div>
          <div class="essay-body">${essay.content}</div>
          ${sourcesHtml}
          <div class="essay-detail-actions">
            <button class="btn" onclick="showEssays()">${txt.essaysBack}</button>
            ${nextHtml}
          </div>
        </div>
      `;

      hideAll();
      screen.innerHTML = html;
      screen.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ───────────────────────────────────────────────
    // ANIMATED FAVICON — alternating red/blue dot
    // ───────────────────────────────────────────────
    (function setupFaviconAnimation() {
      const favicon = document.getElementById('dynamic-favicon');
      if (!favicon) return;

      const makeFaviconSvg = (color) =>
        `data:image/svg+xml,${encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="${color}"/></svg>`
        )}`;

      const RED = '#C8302C';
      const BLUE = '#2563b8';
      let isRed = true;

      // Pause animation when tab not visible to save CPU
      let intervalId = null;
      const tick = () => {
        isRed = !isRed;
        favicon.href = makeFaviconSvg(isRed ? RED : BLUE);
      };

      const start = () => {
        if (intervalId) return;
        intervalId = setInterval(tick, 1000);
      };
      const stop = () => {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      };

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stop(); else start();
      });

      start();
    })();

    // Detect browser language and initialize global stats tracking
    (function() {
      // Set up voter identity (idempotent)
      voterId = getOrCreateVoterId();
      try {
        const stored = localStorage.getItem(FIRST_CHOICE_KEY);
        // Only accept exact 'red' or 'blue' — anything else is treated as no vote
        firstChoice = (stored === 'red' || stored === 'blue') ? stored : null;
      } catch(e) {
        firstChoice = null;
      }

      // Detect language from URL ?lang= parameter, then browser
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      const browserLang = (navigator.language || 'en').toLowerCase();

      if (urlLang === 'pl' || (!urlLang && browserLang.startsWith('pl'))) {
        setLang('pl');
      } else {
        renderIntro();
        renderLiveBanner();
      }

      // Fetch real global stats (async, non-blocking)
      fetchGlobalStats();

      // Initialize sound from saved preference
      initSound();

      // Start animated voter histogram (lazy — runs at ~60fps but yields when tab hidden)
      startHistogramAnimation();

      // Check for 3:33 night-time easter egg
      easterCheckNightTime();

      // If user already voted, show subtle indicator on intro
      if (firstChoice) {
        showLiveStatus(t().liveAlreadyVoted, 'success');
      }

      // Show privacy banner once on first visit
      if (shouldShowPrivacyBanner()) {
        // Tiny delay so the banner doesn't flash before page loads
        setTimeout(showPrivacyBanner, 600);
      }
    })();
  </script>
</body>
</html>

  <style>
    :root {
      --bg: #0d0d0e;
      --surface: #18181b;
      --surface-2: #212125;
      --text: #ece7dc;
      --text-mute: #b8b3a9;
      --text-faint: #847f78;
      --border: rgba(236, 231, 220, 0.12);
      --border-strong: rgba(236, 231, 220, 0.28);
      --red: #d83a36;
      --red-deep: #7a1815;
      --red-text: #f8d6d4;
      --blue: #3a7ad4;
      --blue-deep: #143a72;
      --blue-text: #cce0f7;
      --accent: #e0c8a4;
      --warning: #e0b070;
      --success: #8ec8aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Newsreader', Georgia, serif;
      font-size: 17px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(212, 184, 150, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(37, 99, 184, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.9 0 0 0 0 0.85 0 0 0 0 0.75 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      position: relative;
      z-index: 2;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 64px;
      padding-bottom: 16px;
      border-bottom: 0.5px solid var(--border);
    }

    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-mute);
      text-transform: uppercase;
    }

    .lang-toggle {
      display: flex;
      gap: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .lang-toggle button {
      background: transparent;
      border: 0.5px solid var(--border);
      color: var(--text-mute);
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
    }

    .lang-toggle button:first-child { border-radius: 4px 0 0 4px; }
    .lang-toggle button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
    .lang-toggle button:hover { color: var(--text); }
    .lang-toggle button.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .hero { margin-bottom: 56px; }

    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: clamp(56px, 10vw, 96px);
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-sub {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--text-mute);
      max-width: 480px;
      line-height: 1.4;
    }

    .live-banner {
      background: linear-gradient(135deg, rgba(212, 184, 150, 0.06) 0%, rgba(126, 184, 154, 0.04) 100%);
      border: 0.5px solid rgba(212, 184, 150, 0.25);
      border-radius: 8px;
      padding: 22px 24px;
      margin-bottom: 24px;
      position: relative;
    }

    .live-banner-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .live-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7eb89a;
      box-shadow: 0 0 0 0 rgba(126, 184, 154, 0.6);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(126, 184, 154, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(126, 184, 154, 0); }
      100% { box-shadow: 0 0 0 0 rgba(126, 184, 154, 0); }
    }

    .live-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 500;
    }

    .live-explain {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 16px;
      opacity: 0.92;
    }

    .live-explain em {
      font-style: italic;
      color: var(--accent);
      font-weight: 500;
    }

    .live-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .live-stat {
      background: rgba(255,255,255,0.025);
      border-radius: 6px;
      padding: 12px 10px;
      text-align: center;
      border: 0.5px solid rgba(255,255,255,0.04);
      transition: background 0.4s, border-color 0.4s;
    }

    .live-stat.flash {
      background: rgba(212, 184, 150, 0.12);
      border-color: rgba(212, 184, 150, 0.4);
    }

    .live-stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .live-stat-value {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 1;
      transition: color 0.3s;
    }

    .live-stat-value.red { color: var(--red); }
    .live-stat-value.blue { color: var(--blue); }

    .live-stat-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-mute);
      margin-top: 4px;
    }

    .live-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-mute);
      text-align: center;
      margin-top: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      text-transform: uppercase;
    }

    .live-status.visible { opacity: 0.85; }
    .live-status.success { color: var(--success); }
    .live-status.warning { color: var(--warning); }

    .cache-disclaimer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-align: center;
      margin-top: 10px;
      text-transform: uppercase;
      opacity: 0.55;
    }

    /* ─── Progress Bar (Humanity passes the test) ─── */
    .progress-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 0.5px solid rgba(255,255,255,0.06);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-label-left {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-mute);
      text-transform: uppercase;
    }

    .progress-label-right {
      font-family: 'Instrument Serif', serif;
      font-size: 18px;
      color: var(--blue);
      font-weight: 500;
    }

    .progress-track {
      position: relative;
      height: 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      overflow: hidden;
      border: 0.5px solid rgba(255,255,255,0.08);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue) 0%, #4a8fd1 100%);
      border-radius: 6px;
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(37, 99, 184, 0.4);
    }

    .progress-fill.humanity-passing {
      background: linear-gradient(90deg, var(--success) 0%, #5a9a82 100%);
      box-shadow: 0 0 16px rgba(126, 184, 154, 0.6);
      animation: gentle-glow 2.5s ease-in-out infinite;
    }

    @keyframes gentle-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(126, 184, 154, 0.4); }
      50% { box-shadow: 0 0 24px rgba(126, 184, 154, 0.7); }
    }

    .progress-threshold-marker {
      position: absolute;
      left: 50%;
      top: -4px;
      bottom: -4px;
      width: 1px;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 0 6px rgba(255,255,255,0.4);
    }

    .progress-threshold-marker::before {
      content: '';
      position: absolute;
      left: -3px;
      top: -2px;
      width: 7px;
      height: 7px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
    }

    .progress-marker-label {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .progress-status {
      margin-top: 26px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--text-mute);
      text-align: center;
      line-height: 1.5;
    }

    .progress-status.passed {
      color: var(--success);
      font-style: normal;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(126, 184, 154, 0.4);
    }

    /* ─── Personality / Self-test CTA ─── */
    .self-test-cta {
      background: linear-gradient(135deg, rgba(212, 184, 150, 0.06) 0%, rgba(212, 184, 150, 0.02) 100%);
      border: 0.5px solid rgba(212, 184, 150, 0.18);
      border-radius: 8px;
      padding: 18px 22px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.25s;
    }

    .self-test-cta:hover {
      border-color: rgba(212, 184, 150, 0.4);
      transform: translateY(-1px);
    }

    .self-test-icon {
      font-family: 'Instrument Serif', serif;
      font-size: 28px;
      color: var(--accent);
      line-height: 1;
      flex-shrink: 0;
    }

    .self-test-content {
      flex: 1;
    }

    .self-test-title {
      font-family: 'Instrument Serif', serif;
      font-size: 18px;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .self-test-sub {
      font-size: 13px;
      color: var(--text-mute);
      line-height: 1.4;
    }

    .self-test-arrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--accent);
      opacity: 0.6;
    }

    /* ─── Personality Result Card ─── */
    .personality-card {
      background: linear-gradient(135deg, #1a1a1c 0%, #0f0f10 100%);
      border: 0.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 36px 32px;
      margin: 24px 0;
      position: relative;
      overflow: hidden;
    }

    .personality-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 60%;
      height: 200%;
      background: radial-gradient(circle, rgba(212, 184, 150, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .personality-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 12px;
      position: relative;
    }

    .personality-name {
      font-family: 'Instrument Serif', serif;
      font-size: 44px;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .personality-name em {
      font-style: italic;
      color: var(--accent);
    }

    .personality-tagline {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--text-mute);
      line-height: 1.4;
      margin-bottom: 24px;
      position: relative;
    }

    .personality-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
      position: relative;
    }

    .personality-stat {
      text-align: center;
      padding: 12px 8px;
      background: rgba(255,255,255,0.025);
      border-radius: 6px;
    }

    .personality-stat-value {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .personality-stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .personality-description {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      opacity: 0.88;
      margin-bottom: 24px;
      position: relative;
    }

    .personality-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
    }

    .btn-primary {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: #e5cba4;
      transform: translateY(-1px);
    }

    .personality-locked {
      text-align: center;
      padding: 30px 24px;
      background: var(--surface);
      border-radius: 8px;
      border: 0.5px dashed var(--border-strong);
    }

    .personality-locked-text {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--text-mute);
      margin-bottom: 8px;
    }

    .personality-locked-progress {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    /* ─── Geo Map ─── */
    .map-toggle {
      text-align: center;
      margin-top: 14px;
    }

    .map-container {
      margin-top: 16px;
      padding: 18px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      border: 0.5px solid var(--border);
    }

    .map-container-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-mute);
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }

    .map-svg {
      width: 100%;
      height: auto;
      max-height: 320px;
      display: block;
    }

    .map-svg .country {
      stroke: rgba(255,255,255,0.12);
      stroke-width: 0.4;
      transition: opacity 0.2s;
      cursor: pointer;
    }

    .map-svg .country:hover {
      opacity: 0.8;
      stroke: rgba(255,255,255,0.4);
      stroke-width: 0.8;
    }

    .map-legend {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-mute);
    }

    .map-legend-gradient {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .map-legend-bar {
      width: 80px;
      height: 8px;
      background: linear-gradient(90deg, var(--red) 0%, #777 50%, var(--blue) 100%);
      border-radius: 2px;
      border: 0.5px solid rgba(255,255,255,0.1);
    }

    .map-tooltip {
      position: absolute;
      pointer-events: none;
      background: #0a0a0a;
      border: 0.5px solid var(--border-strong);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .map-tooltip.visible { opacity: 1; }

    .map-tooltip-name {
      font-family: 'Instrument Serif', serif;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .map-tooltip-stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.05em;
      color: var(--text-mute);
    }

    .map-top-list {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 0.5px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .map-top-section h4 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--text-mute);
      font-weight: 500;

    .privacy-note {

    .result {
      border-radius: 12px;

    .result.death { background: #08080a; color: #6f6f72; }

    .result.shame { background: #0d1224; color: #aab4d4; }

    .result-title {

    .result-sub {

      text-transform: uppercase;

    .stats {
      margin-top: 48px;

      font-size: 14px;

    .panel-title {
      font-family: 'Instrument Serif', serif;
      font-size: 40px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .panel-sub {
      font-size: 15px;
      color: var(--text-mute);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .data-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 20px 22px;
      margin-bottom: 12px;
      border: 0.5px solid var(--border);
    }

    .data-card-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .data-card-headline {
      font-family: 'Instrument Serif', serif;
      font-size: 22px;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .data-card-detail {
      font-size: 14px;
      color: var(--text-mute);
      line-height: 1.6;
    }

    .verdict {
      margin: 28px 0;
      padding: 20px 22px;
      background: var(--surface);
      border-radius: 8px;
      border-left: 2px solid var(--accent);
    }

    .verdict-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .verdict-text {
      font-size: 15px;
      line-height: 1.65;
    }

    .summary {
      margin-top: 32px;
      padding: 24px 26px;
      background: var(--surface);
      border-radius: 8px;
      border-top: 2px solid var(--warning);
    }

    .summary-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--warning);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .summary-headline {
      font-family: 'Instrument Serif', serif;
      font-size: 22px;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .summary-detail {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-mute);
    }

    .closing-quote {
      text-align: center;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 19px;
      line-height: 1.5;
      color: var(--text-mute);
      margin: 36px auto;
      max-width: 540px;
    }

    .questions-section { margin-bottom: 32px; }

    .questions-section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-mute);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .question-card {
      background: var(--surface);
      border-radius: 6px;
      padding: 16px 18px;
      margin-bottom: 8px;
      border-left: 2px solid;
    }

    .question-card.unlocked-blue { border-left-color: var(--blue); }
    .question-card.unlocked-red { border-left-color: var(--red); }
    .question-card.locked { border-left-color: var(--border-strong); opacity: 0.4; }

    .question-card-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .question-card.unlocked-blue .question-card-label { color: var(--blue-text); }
    .question-card.unlocked-red .question-card-label { color: var(--red-text); }
    .question-card.locked .question-card-label { color: var(--text-faint); }

    .question-card-text {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      line-height: 1.4;
    }

    .question-card.locked .question-card-text {
      color: var(--text-faint);
      font-style: italic;
      font-size: 13px;
      font-family: 'Newsreader', serif;

    .footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 0.5px solid var(--border);
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .footer a { color: var(--text-mute); text-decoration: none; }
    .footer a:hover { color: var(--text); }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .page { padding: 24px 18px 60px; }
      .top-bar { margin-bottom: 40px; }
      h1 { font-size: 56px; }
      .hero-sub { font-size: 18px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .result { padding: 28px 22px; }
      .result-title { font-size: 40px; }
      .new-question-text { font-size: 18px; }
      .panel-title { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <div class="brand" id="brand">Two Buttons · kwh</div>
      <div class="lang-toggle">
        <button id="lang-en" class="active" onclick="setLang('en')">EN</button>
        <button id="lang-pl" onclick="setLang('pl')">PL</button>
      </div>
    </div>

    <div id="screen-intro" class="screen">
      <div class="hero">
        <div class="hero-eyebrow" id="hero-eyebrow"></div>

      </div>

      <div class="live-banner">
        <div class="live-banner-header">
          <span class="live-pulse"></span>

          </div>
          <div class="live-stat" id="live-stat-blue">
            <div class="live-stat-label" id="live-blue-label"></div>
            <div class="live-stat-value blue" id="live-blue-value">—</div>
            <div class="live-stat-pct" id="live-blue-pct"></div>
          </div>
        </div>

        <div class="progress-section" id="progress-section">
          <div class="progress-label">
            <span class="progress-label-left" id="progress-label-left"></span>
            <span class="progress-label-right" id="progress-label-right">—</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            <div class="progress-threshold-marker">
              <span class="progress-marker-label" id="progress-marker-label">50%</span>

          <button class="btn" id="btn-toggle-map" onclick="toggleMap()"></button>

        <div class="map-container hidden" id="map-container">

            <span id="map-legend-red"></span>

            </div>
            <span id="map-legend-blue"></span>
          </div>
          <div class="map-top-list" id="map-top-list"></div>
        </div>

        <p class="live-status" id="live-status"></p>
        <p class="cache-disclaimer" id="cache-disclaimer"></p>
      </div>

      <div class="self-test-cta" onclick="showPersonality()">
        <span class="self-test-icon">⌖</span>
        <div class="self-test-content">
          <div class="self-test-title" id="self-test-title"></div>
          <div class="self-test-sub" id="self-test-sub"></div>
        </div>
        <span class="self-test-arrow">→</span>
      </div>

      <div class="rules">
        <div class="rules-label" id="rules-label"></div>
        <p id="rule-1"></p>
        <p id="rule-2"></p>
        <p id="rule-3"></p>
      </div>

      <div class="buttons-grid">
        <button class="choice-btn choice-red" onclick="choose('red')" id="btn-red"></button>
        <button class="choice-btn choice-blue" onclick="choose('blue')" id="btn-blue"></button>
      </div>

      <p class="privacy-note" id="privacy-note"></p>
      <p class="hint" id="hint"></p>

      <div class="secondary-actions">
        <button class="btn" onclick="showReality()" id="btn-research"></button>
        <button class="btn hidden" id="btn-questions" onclick="showQuestions()"></button>
      </div>
    </div>

    <div id="screen-result" class="screen hidden"></div>
    <div id="screen-reality" class="screen hidden"></div>
    <div id="screen-questions" class="screen hidden"></div>
    <div id="screen-personality" class="screen hidden"></div>

    <div id="stats" class="stats hidden">
      <p class="stats-label" id="stats-label"></p>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-label" id="stat-label-total"></div>
          <div class="stat-card-value" id="stat-total">0</div>

    // Replace API_BASE with your deployed Cloudflare Worker URL.
    // Leave empty string '' to disable global stats (game still works).
    const API_BASE = 'https://two-buttons-stats.hkacper111.workers.dev';

    const FIRST_CHOICE_KEY = 'gamestheory_first_choice';

    function getOrCreateVoterId() {
      try {
        let id = localStorage.getItem(VOTER_ID_KEY);
        if (!id) {
          id = (crypto.randomUUID && crypto.randomUUID()) ||
            ('v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 12));
          localStorage.setItem(VOTER_ID_KEY, id);
        }
        return id;
      } catch (e) {
        return 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 12);
      }
    }

    async function fetchGlobalStats() {
      if (!API_BASE) { apiAvailable = false; renderLiveBanner(); return; }
      try {
        const res = await fetch(API_BASE + '/api/stats?t=' + Date.now(), {
          method: 'GET',
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Bad response');
        const data = await res.json();
        globalStats = {
          red: data.red || 0,
          blue: data.blue || 0,
          total: data.total || 0,
          countries: data.countries || {}
        };
        apiAvailable = true;
      } catch (e) {
        apiAvailable = false;
      }
      renderLiveBanner();
    }

    async function recordFirstVote(choice) {
      if (!API_BASE || firstChoice) return;
      try {
        const res = await fetch(API_BASE + '/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voter_id: voterId, choice: choice })
        });
        if (!res.ok) throw new Error('Bad response: ' + res.status);
        const data = await res.json();
        // ONLY persist firstChoice after server confirms
        firstChoice = data.choice || choice;
        try { localStorage.setItem(FIRST_CHOICE_KEY, firstChoice); } catch(e) {}
        if (data.stats) {
          globalStats = {
            red: data.stats.red || 0,
            blue: data.stats.blue || 0,
            total: data.stats.total || 0,
            countries: data.stats.countries || globalStats.countries || {}
          };
        }
        apiAvailable = true;
        flashLiveStat(firstChoice);
        renderLiveBanner();
        showLiveStatus(data.already_voted ? t().liveAlreadyVoted : t().liveYourVote, 'success');
      } catch (e) {
        // POST failed — do NOT persist firstChoice locally so user can retry next time
        console.warn('Vote recording failed:', e.message);
        apiAvailable = false;
        showLiveStatus(t().liveOffline, 'warning');
      }
    }

      const el = document.getElementById('live-status');

      el.textContent = text;

      setTimeout(() => { el.classList.remove('visible'); }, 4000);

    function renderProgressBar(bluePct) {
      const txt = t();
      const fill = document.getElementById('progress-fill');
      const labelRight = document.getElementById('progress-label-right');
      const status = document.getElementById('progress-status');

      const safeWidth = Math.max(0, Math.min(100, bluePct));
      fill.style.width = safeWidth + '%';
      labelRight.textContent = bluePct.toFixed(1) + '%';

      // Update color tone based on threshold
      if (bluePct > 50) {
        fill.classList.add('humanity-passing');
        labelRight.style.color = 'var(--success)';
        status.classList.add('passed');
        const over = (bluePct - 50).toFixed(1);
        status.innerHTML = `<div style="font-size: 17px; margin-bottom: 6px;">${txt.progressStatusPassed}</div><div style="font-size: 13px; opacity: 0.85; font-style: italic; font-weight: 400; letter-spacing: 0;">${txt.progressStatusPassedSub(over)}</div>`;
      } else if (bluePct >= 49 && bluePct <= 50) {
        fill.classList.remove('humanity-passing');
        labelRight.style.color = 'var(--warning)';
        status.classList.remove('passed');
        status.innerHTML = txt.progressStatusAt;
      } else {
        fill.classList.remove('humanity-passing');
        labelRight.style.color = 'var(--blue)';
        status.classList.remove('passed');
        const gap = (50 - bluePct).toFixed(1);
        status.innerHTML = txt.progressStatusBelow(gap);
      }
    }

    function colorForBluePct(bluePct) {
      // 0% → red, 50% → neutral grey, 100% → blue
      if (bluePct < 50) {
        const t = bluePct / 50;
        const r = Math.round(200 + (119 - 200) * t);
        const g = Math.round(48 + (119 - 48) * t);
        const b = Math.round(44 + (119 - 44) * t);
        return `rgb(${r},${g},${b})`;
      } else {
        const t = (bluePct - 50) / 50;
        const r = Math.round(119 + (37 - 119) * t);
        const g = Math.round(119 + (99 - 119) * t);
        const b = Math.round(119 + (184 - 119) * t);
        return `rgb(${r},${g},${b})`;
      }
    }

    function getArchetype() {
      const txt = t();
      const total = stats.total;
      if (total < 5) return null;
      const bluePct = (stats.blue / total) * 100;

      if (bluePct >= 90) return { key: 'martyr', ...txt.archetypes.martyr };
      if (bluePct >= 65) return { key: 'believer', ...txt.archetypes.believer };
      if (bluePct >= 45 && bluePct <= 55) return { key: 'hesitant', ...txt.archetypes.hesitant };
      if (bluePct >= 35) return { key: 'pragmatist', ...txt.archetypes.pragmatist };
      if (bluePct < 10) return { key: 'calculator', ...txt.archetypes.calculator };
      if (bluePct < 35) return { key: 'pragmatist', ...txt.archetypes.pragmatist };

      // Behavioral check: did they switch sides? If both >0, they "performed"
      if (stats.red > 0 && stats.blue > 0 && total >= 5) {
        const minorityRatio = Math.min(stats.red, stats.blue) / total;
        if (minorityRatio >= 0.2 && minorityRatio <= 0.4) {
          return { key: 'performer', ...txt.archetypes.performer };
        }
      }

      return { key: 'observer', ...txt.archetypes.observer };
    }

    function downloadPersonalityImage(archetypeKey) {
      const archetype = getArchetype();
      if (!archetype) return;

      const canvas = document.createElement('canvas');
      const w = 1200;
      const h = 630;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      // Background
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#1a1a1c');
      grad.addColorStop(1, '#0a0a0b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Subtle radial accent
      const radial = ctx.createRadialGradient(w * 0.85, h * 0.2, 0, w * 0.85, h * 0.2, w * 0.5);
      radial.addColorStop(0, 'rgba(212, 184, 150, 0.15)');
      radial.addColorStop(1, 'rgba(212, 184, 150, 0)');
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, w, h);

      // Border
      ctx.strokeStyle = 'rgba(212, 184, 150, 0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(40, 40, w - 80, h - 80);

      // Eyebrow
      ctx.fillStyle = '#95918a';
      ctx.font = '500 18px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      ctx.fillText('GAMESTHEORY.ORG  ·  YOUR MORAL PROFILE', 80, 100);

      // Name
      const cleanName = archetype.name.replace(/<\/?em>/g, '');
      ctx.fillStyle = '#ece7dc';
      ctx.font = 'italic 88px "Instrument Serif", "Times New Roman", serif';
      ctx.fillText(cleanName, 80, 220);

      // Tagline
      ctx.fillStyle = '#d4b896';
      ctx.font = 'italic 32px "Instrument Serif", "Times New Roman", serif';
      ctx.fillText('"' + archetype.tagline + '"', 80, 280);

      // Stats row
      const statY = 380;
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(80, statY - 40, w - 160, 100);

      ctx.font = '500 16px "JetBrains Mono", monospace';
      ctx.fillStyle = '#5d5a55';
      ctx.fillText('ROUNDS', 120, statY - 5);
      ctx.fillText('RED', 470, statY - 5);
      ctx.fillText('BLUE', 800, statY - 5);

      ctx.font = '60px "Instrument Serif", "Times New Roman", serif';
      ctx.fillStyle = '#ece7dc';
      ctx.fillText(stats.total.toString(), 120, statY + 45);
      ctx.fillStyle = '#C8302C';
      ctx.fillText(((stats.red / stats.total) * 100).toFixed(0) + '%', 470, statY + 45);
      ctx.fillStyle = '#2563b8';
      ctx.fillText(((stats.blue / stats.total) * 100).toFixed(0) + '%', 800, statY + 45);

      // Footer
      ctx.fillStyle = '#95918a';
      ctx.font = '500 18px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('A test of who you become when no one is watching', w / 2, h - 90);
      ctx.fillStyle = '#d4b896';
      ctx.font = '500 24px "JetBrains Mono", monospace';
      ctx.fillText('GAMESTHEORY.ORG', w / 2, h - 60);

      // Trigger download
      const filename = `gamestheory-${archetypeKey}.png`;
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    function simulateBluePercent() {
      const r = Math.random();
      // 7% — prawie wszyscy czerwony (uruchamia resultRedAllRed)
      if (r < 0.07) return Math.random() * 0.9;
      // 25% — niebieski wyraźnie wygrywa (resultBlueWon / resultRedBlueWon)
      if (r < 0.32) return 52 + Math.random() * 30;
      // 18% — blisko progu po stronie niebieskiej (drama 50/50)
      if (r < 0.50) return 43 + Math.random() * 12;
      // 30% — typowa kooperacja laboratoryjna (~lab baseline)
      if (r < 0.80) return 28 + Math.random() * 17;
      // 20% — niska kooperacja
      return 6 + Math.random() * 20;
    }

    function getResult(choice, bluePct) {
      const txt = t();
      const blueWon = bluePct > 50;
      const everyoneRed = bluePct < 1;
      if (choice === 'red') {
        if (blueWon) return txt.resultRedBlueWon;
        if (everyoneRed) return txt.resultRedAllRed;
        return txt.resultRedBlueDied;
      }
      return blueWon ? txt.resultBlueWon : txt.resultBlueDied;
    }

    function unlockNextQuestion(choice) {
      const txt = t();
      const arr = choice === 'blue' ? txt.questionsBlue : txt.questionsRed;
      const unlocked = choice === 'blue' ? unlockedBlue : unlockedRed;
      if (unlocked.length >= arr.length) return null;
      const idx = unlocked.length;
      unlocked.push(idx);
      return { text: arr[idx], number: idx + 1, side: choice, total: arr.length };
    }

    function getPattern(choice, bluePct, msg) {
      const txt = t();
      const p = bluePct.toFixed(1);
      return {
        title: msg.title,
        sub: typeof msg.sub === 'function' ? msg.sub(p) : msg.sub,
        detail: msg.detail(p),
        mood: msg.mood
      };
    }

    function hideAll() {
      ['screen-intro', 'screen-result', 'screen-reality', 'screen-questions', 'screen-personality'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }

    function choose(choice) {
      // Record first-ever vote for this device (no-op if already voted or no API)
      const wasFirstVote = !firstChoice;
      if (wasFirstVote) {
        // Optimistic UI update for immediate feedback
        // We DO NOT set firstChoice here — recordFirstVote does that ONLY after server confirms
        // (this way, if POST fails, the user can retry next time)
        globalStats[choice] = (globalStats[choice] || 0) + 1;
        globalStats.total = (globalStats.total || 0) + 1;
        renderLiveBanner();
        flashLiveStat(choice);
        recordFirstVote(choice);
      }

      const bluePct = simulateBluePercent();
      const rawMsg = getResult(choice, bluePct);
      const msg = getPattern(choice, bluePct, rawMsg);
      stats.total++;
      if (choice === 'red') stats.red++; else stats.blue++;
      const newQ = unlockNextQuestion(choice);
      const txt = t();
      const blueWidth = Math.round(bluePct);
      const redWidth = 100 - blueWidth;

      const noNewQ = !newQ ? `<p style="font-size: 13px; opacity: 0.6; font-style: italic; margin-top: 16px;">${currentLang === 'en' ? 'All ' + (choice === 'blue' ? 'blue' : 'red') + '-questioning unlocked. Try the other side.' : 'Wszystkie pytania ' + (choice === 'blue' ? 'kwestionujące niebieski' : 'kwestionujące czerwony') + ' odkryte. Spróbuj drugiego przycisku.'}</p>` : '';

      const newQHtml = newQ ? `
        <div class="new-question ${choice}">
          <div class="new-question-label">${txt.newQuestion} · ${choice === 'blue' ? txt.blue : txt.red} #${newQ.number}/${newQ.total}</div>
          <div class="new-question-text">${newQ.text}</div>
        </div>
      ` : '';

      // Real-world live results section (only if we have any data)
      const liveResultsHtml = (apiAvailable && globalStats.total > 0) ? `
        <div class="result-live-section">
          <div class="result-section-label">
            ${wasFirstVote ? '<span class="first-vote-badge">' + txt.firstVoteBadge + '</span>' : ''}

          </div>
          ${wasFirstVote ? `<p style="font-size: 13px; line-height: 1.55; margin-top: 8px; opacity: 0.85;">${txt.firstVoteCounted(choice === 'red' ? txt.red.toLowerCase() : txt.blue.toLowerCase())}</p>` : ''}
          <div class="live-stats-grid">

            </div>

              <div class="live-stat-value blue">${fmtNum(globalStats.blue)}</div>
              <div class="live-stat-pct">${pct(globalStats.blue, globalStats.total)}</div>
            </div>
          </div>
        </div>
      ` : '';

      const html = `
        <div class="result ${msg.mood}">
          <div class="result-title">${msg.title}</div>
          <div class="result-sub">${msg.sub}</div>
          <div class="histogram">
            <div class="histogram-bar">

              <div class="histogram-red" style="width: ${redWidth}%"></div>
            </div>
            <div class="histogram-threshold"></div>
            <div class="histogram-label">${currentLang === 'en' ? 'threshold 50% · blue: ' : 'próg 50% · niebieski: '}${bluePct.toFixed(1)}%</div>
          </div>

            <div class="result-section-label">${txt.comparison}</div>
            <div class="result-section-text">${choice === 'blue' ? txt.comparisonBlue : txt.comparisonRed}</div>
          </div>

          ${noNewQ}

            <button class="btn" onclick="playAgain()">${txt.playAgain}</button>
            <button class="btn" onclick="showQuestions()">${txt.seeQuestions} (${unlockedBlue.length + unlockedRed.length}/16) ↗</button>
            <button class="btn" onclick="showReality()">${txt.seeReality}</button>
          </div>

      r.innerHTML = html;

      voterId = getOrCreateVoterId();
      try { firstChoice = localStorage.getItem(FIRST_CHOICE_KEY); } catch(e) { firstChoice = null; }

      // Detect language from URL ?lang= parameter, then browser
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      const browserLang = (navigator.language || 'en').toLowerCase();

      if (urlLang === 'pl' || (!urlLang && browserLang.startsWith('pl'))) {
        setLang('pl');
      } else {
        renderIntro();
        renderLiveBanner();
      }

      // Fetch real global stats (async, non-blocking)
      fetchGlobalStats();

      // If user already voted, show subtle indicator on intro
      if (firstChoice) {
        showLiveStatus(t().liveAlreadyVoted, 'success');
      }
    })();
  </script>
</body>
</html>

      } catch (e) { /* localStorage full or unavailable */ }
    }

    // RFC 4122 v4 UUID validation regex (matches the strict format the Worker requires)
    const UUID_V4_REGEX = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

    function generateUuidV4() {
      // Prefer crypto.randomUUID (available in all modern browsers)
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      // Fallback: build a v4 UUID using crypto.getRandomValues
      if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 0x0f) | 0x40; // version 4
        bytes[8] = (bytes[8] & 0x3f) | 0x80; // variant 10
        const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
        return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
      }
      // Last-resort fallback (very unlikely path on modern browsers): non-crypto random
      // This produces a UUID that LOOKS like v4 but isn't cryptographically random.
      // The Worker will accept it as long as it matches the format.
      const r = () => Math.floor(Math.random() * 16).toString(16);
      const make = (n) => Array.from({ length: n }, r).join('');
      return `${make(8)}-${make(4)}-4${make(3)}-${['8','9','a','b'][Math.floor(Math.random()*4)]}${make(3)}-${make(12)}`;
    }

    function getOrCreateVoterId() {
      try {
        let id = localStorage.getItem(VOTER_ID_KEY);
        // Validate stored UUID — if it's malformed (legacy format from earlier versions),
        // regenerate to ensure compatibility with the strict Worker validation.
        if (!id || !UUID_V4_REGEX.test(id)) {
          id = generateUuidV4();
          localStorage.setItem(VOTER_ID_KEY, id);
        }
        return id;
      } catch (e) {
        // localStorage unavailable (private mode in some browsers, etc.)
        // Generate ephemeral UUID — vote won't persist across sessions but at least works once.
        return generateUuidV4();
      }
    }

    // Sanitize and coerce stats response — defensive against unexpected API shape.
    // Numbers are clamped to safe integer range; countries object filtered to valid codes only.
    function sanitizeStats(data) {
      const safeNum = (v) => {
        const n = Number(v);
        if (!Number.isFinite(n) || n < 0 || n > Number.MAX_SAFE_INTEGER) return 0;
        return Math.floor(n);
      };
      const countries = {};
      if (data && data.countries && typeof data.countries === 'object') {
        for (const [code, vals] of Object.entries(data.countries)) {
          // Only accept 2-letter ISO country codes
          if (!/^[A-Z]{2}$/i.test(code)) continue;
          if (!vals || typeof vals !== 'object') continue;
          countries[code.toUpperCase()] = {
            red: safeNum(vals.red),
            blue: safeNum(vals.blue),
            total: safeNum(vals.total),
          };
        }
      }
      return {
        red: safeNum(data && data.red),
        blue: safeNum(data && data.blue),
        total: safeNum(data && data.total),
        countries,
      };
    }

    async function fetchGlobalStats() {
      if (!API_BASE) { apiAvailable = false; renderLiveBanner(); return; }
      try {
        const res = await fetch(API_BASE + '/api/stats?t=' + Date.now(), {
          method: 'GET',
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Bad response');
        const data = await res.json();
        globalStats = sanitizeStats(data);
        apiAvailable = true;
      } catch (e) {
        apiAvailable = false;
      }
      renderLiveBanner();
    }

    async function recordFirstVote(choice) {
      if (!API_BASE || firstChoice) return;
      try {
        const res = await fetch(API_BASE + '/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voter_id: voterId, choice: choice })
        });
        if (!res.ok) throw new Error('Bad response: ' + res.status);
        const data = await res.json();
        // ONLY persist firstChoice after server confirms
        const confirmedChoice = (data.choice === 'red' || data.choice === 'blue') ? data.choice : choice;
        firstChoice = confirmedChoice;
        try { localStorage.setItem(FIRST_CHOICE_KEY, firstChoice); } catch(e) {}
        if (data.stats) {
          globalStats = sanitizeStats(data.stats);
        }
        apiAvailable = true;
        flashLiveStat(firstChoice);
        renderLiveBanner();
        showLiveStatus(data.already_voted ? t().liveAlreadyVoted : t().liveYourVote, 'success');
      } catch (e) {
        // POST failed — do NOT persist firstChoice locally so user can retry next time
        console.warn('Vote recording failed:', e.message);
        apiAvailable = false;
        showLiveStatus(t().liveOffline, 'warning');
      }
    }

        const over = (bluePct - 50).toFixed(1);

    function colorForBluePct(bluePct) {
      // 0% → red, 50% → neutral grey, 100% → blue
      if (bluePct < 50) {
        const t = bluePct / 50;
        const r = Math.round(200 + (119 - 200) * t);
        const g = Math.round(48 + (119 - 48) * t);
        const b = Math.round(44 + (119 - 44) * t);
        return `rgb(${r},${g},${b})`;
      } else {
        const t = (bluePct - 50) / 50;
        const r = Math.round(119 + (37 - 119) * t);
        const g = Math.round(119 + (99 - 119) * t);
        const b = Math.round(119 + (184 - 119) * t);
        return `rgb(${r},${g},${b})`;
      }
    }

          <!-- India subcontinent -->

          <path d="M 790 295 L 820 290 L 850 295 L 855 310 L 845 320 L 825 325 L 805 322 L 790 315 Z" />

    function renderMapTopLists() {
      const txt = t();
      const list = document.getElementById('map-top-list');
      const countries = globalStats.countries || {};

      const enriched = Object.entries(countries)
        .filter(([code, d]) => d.total >= 5)
        .map(([code, d]) => ({
          code,
          name: getCountryName(code),
          bluePct: (d.blue / d.total) * 100,
          total: d.total
        }));

      if (enriched.length === 0) {
        list.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-faint); font-style: italic; font-size: 13px;">${txt.mapMinVotes}</div>`;
        return;
      }

      const topBlue = [...enriched].sort((a, b) => b.bluePct - a.bluePct).slice(0, 5);
      const topRed = [...enriched].sort((a, b) => a.bluePct - b.bluePct).slice(0, 5);

      const renderRow = (item, side) => `
        <div class="map-top-row">
          <span class="map-top-country">${item.name}</span>
          <span class="map-top-pct ${side}">${Math.round(side === 'blue' ? item.bluePct : 100 - item.bluePct)}%</span>
        </div>
      `;

      list.innerHTML = `
        <div class="map-top-section">
          <h4 style="color: var(--blue);">${txt.mapTopBlue}</h4>
          ${topBlue.map(c => renderRow(c, 'blue')).join('')}
        </div>
        <div class="map-top-section">
          <h4 style="color: var(--red);">${txt.mapTopRed}</h4>
          ${topRed.map(c => renderRow(c, 'red')).join('')}
        </div>
      `;
    }

    // Escape HTML for any string we might inject into innerHTML.
    // Currently all data sources are trusted (hardcoded translations + API returning
    // only numbers and 2-letter ISO country codes), but this helper is defensive
    // for any future user-generated or third-party content.
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function onMapHover(e, code) {
      const tooltip = document.getElementById('map-tooltip');
      if (!tooltip) return;
      const txt = t();
      const data = (globalStats.countries || {})[code];
      if (!data) return;
      const bluePct = (data.blue / data.total) * 100;

      // Build tooltip with textContent (no innerHTML — eliminates any XSS surface here)
      tooltip.replaceChildren();
      const nameDiv = document.createElement('div');
      nameDiv.className = 'map-tooltip-name';
      nameDiv.textContent = getCountryName(code);
      const statsDiv = document.createElement('div');
      statsDiv.className = 'map-tooltip-stats';
      statsDiv.textContent = `${txt.mapTooltipVotes(data.total)} · ${Math.round(bluePct)}% ${txt.mapTooltipBlue}`;
      tooltip.appendChild(nameDiv);
      tooltip.appendChild(statsDiv);

      // Position fixed relative to viewport — make tooltip visible first to get its size
      tooltip.classList.add('visible');
      const tooltipRect = tooltip.getBoundingClientRect();

      // Default: tooltip above cursor with 14px gap
      let left = e.clientX - tooltipRect.width / 2;
      let top = e.clientY - tooltipRect.height - 14;

      // Keep within viewport horizontally
      const maxLeft = window.innerWidth - tooltipRect.width - 8;
      if (left < 8) left = 8;
      if (left > maxLeft) left = maxLeft;

      // If above is off-screen, put below cursor
      if (top < 8) top = e.clientY + 18;

      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    }

    function onMapLeave() {
      const tooltip = document.getElementById('map-tooltip');
      if (tooltip) tooltip.classList.remove('visible');
    }

    // ───────────────────────────────────────────────
    // PERSONALITY TYPING — moral profile after 5+ rounds

    function getArchetype() {
      const txt = t();
      const total = stats.total;
      if (total < 5) return null;
      const bluePct = (stats.blue / total) * 100;

      if (bluePct >= 90) return { key: 'martyr', ...txt.archetypes.martyr };
      if (bluePct >= 65) return { key: 'believer', ...txt.archetypes.believer };
      if (bluePct >= 45 && bluePct <= 55) return { key: 'hesitant', ...txt.archetypes.hesitant };
      if (bluePct >= 35) return { key: 'pragmatist', ...txt.archetypes.pragmatist };
      if (bluePct < 10) return { key: 'calculator', ...txt.archetypes.calculator };
      if (bluePct < 35) return { key: 'pragmatist', ...txt.archetypes.pragmatist };

      // Behavioral check: did they switch sides? If both >0, they "performed"
      if (stats.red > 0 && stats.blue > 0 && total >= 5) {
        const minorityRatio = Math.min(stats.red, stats.blue) / total;
        if (minorityRatio >= 0.2 && minorityRatio <= 0.4) {
          return { key: 'performer', ...txt.archetypes.performer };
        }
      }

      return { key: 'observer', ...txt.archetypes.observer };
    }

    function showPersonality() {
      const txt = t();

    function copyShareLink(archetypeKey) {
      const txt = t();

      if (!archetype) return;
      // Use instrumental case if available (Polish), otherwise plain name
      const nameForShare = archetype.nameInstrumental
        ? archetype.nameInstrumental
        : archetype.name.replace(/<\/?em>/g, '');
      const text = txt.personalityShareText(nameForShare) + ' https://gamestheory.org';
      try {
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('btn-copy-link');
        const orig = btn.textContent;

        setTimeout(() => { btn.textContent = orig; }, 2000);

        console.warn('Copy failed:', e);
      }
    }

    function downloadPersonalityImage(archetypeKey) {
      const archetype = getArchetype();
      if (!archetype) return;
      const txt = t();

      const canvas = document.createElement('canvas');
      const w = 1200;
      const h = 630;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      // Background
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#1a1a1c');
      grad.addColorStop(1, '#0a0a0b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Subtle radial accent
      const radial = ctx.createRadialGradient(w * 0.85, h * 0.2, 0, w * 0.85, h * 0.2, w * 0.5);
      radial.addColorStop(0, 'rgba(212, 184, 150, 0.15)');
      radial.addColorStop(1, 'rgba(212, 184, 150, 0)');
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, w, h);

      // Border
      ctx.strokeStyle = 'rgba(212, 184, 150, 0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(40, 40, w - 80, h - 80);

      // Eyebrow
      ctx.fillStyle = '#95918a';
      ctx.font = '500 18px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(txt.imageEyebrow, 80, 100);

      // Name
      const cleanName = archetype.name.replace(/<\/?em>/g, '');
      ctx.fillStyle = '#ece7dc';
      ctx.font = 'italic 84px "Instrument Serif", "Times New Roman", serif';
      ctx.fillText(cleanName, 80, 200);

      // Tagline
      ctx.fillStyle = '#d4b896';
      ctx.font = 'italic 28px "Instrument Serif", "Times New Roman", serif';
      ctx.fillText('"' + archetype.tagline + '"', 80, 250);

      // Quote (wrapped, prominent) — full archetype.quote already wrapped in quotes
      ctx.fillStyle = '#ece7dc';
      ctx.font = 'italic 24px "Instrument Serif", "Times New Roman", serif';
      const quoteText = archetype.quote;
      const maxQuoteWidth = w - 200;
      const quoteWords = quoteText.split(' ');
      const quoteLines = [];
      let currentLine = '';
      for (const word of quoteWords) {
        const testLine = currentLine ? currentLine + ' ' + word : word;
        if (ctx.measureText(testLine).width > maxQuoteWidth && currentLine) {
          quoteLines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) quoteLines.push(currentLine);
      const quoteStartY = 310;
      quoteLines.forEach((line, i) => {
        ctx.fillText(line, 80, quoteStartY + i * 32);
      });

      // Stats row (shifted down to make room for quote)
      const quoteHeight = quoteLines.length * 32;
      const statY = Math.max(420, quoteStartY + quoteHeight + 40);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(80, statY - 40, w - 160, 100);

      ctx.font = '500 16px "JetBrains Mono", monospace';
      ctx.fillStyle = '#5d5a55';
      ctx.fillText(txt.imageRoundsLabel, 120, statY - 5);
      ctx.fillText(txt.imageRedLabel, 470, statY - 5);
      ctx.fillText(txt.imageBlueLabel, 800, statY - 5);

      ctx.font = '60px "Instrument Serif", "Times New Roman", serif';
      ctx.fillStyle = '#ece7dc';
      ctx.fillText(stats.total.toString(), 120, statY + 45);
      ctx.fillStyle = '#C8302C';
      ctx.fillText(((stats.red / stats.total) * 100).toFixed(0) + '%', 470, statY + 45);
      ctx.fillStyle = '#2563b8';
      ctx.fillText(((stats.blue / stats.total) * 100).toFixed(0) + '%', 800, statY + 45);

      // Footer
      ctx.fillStyle = '#95918a';
      ctx.font = '500 18px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(txt.imageTagline, w / 2, h - 90);
      ctx.fillStyle = '#d4b896';
      ctx.font = '500 24px "JetBrains Mono", monospace';
      ctx.fillText('GAMESTHEORY.ORG', w / 2, h - 60);

      // Trigger download
      const filename = `gamestheory-${archetypeKey}.png`;
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    // State for streak detection
    let easterRedStreak = 0;
    const easterFoundKeys = {
      streak: 'gamestheory_easter_streak',
      both: 'gamestheory_easter_both',
      night: 'gamestheory_easter_night'
    };

    function hasEasterBeenFound(key) {
      try { return localStorage.getItem(easterFoundKeys[key]) === '1'; }
      catch(e) { return false; }
    }

    function markEasterFound(key) {
      try { localStorage.setItem(easterFoundKeys[key], '1'); } catch(e) {}
    }

    function showEaster(kind) {
      const txt = t();
      let title, body;
      if (kind === 'streak') {
        title = txt.easterStreakTitle;
        body = txt.easterStreakBody;
      } else if (kind === 'both') {
        title = txt.easterBothTitle;
        body = txt.easterBothBody;
      } else if (kind === 'night') {
        title = txt.easterNightTitle;
        body = txt.easterNightBody;
      } else { return; }

      document.getElementById('easter-eyebrow').textContent = txt.easterFoundLabel;
      document.getElementById('easter-title').textContent = title;
      document.getElementById('easter-body').textContent = body;
      document.getElementById('easter-close-btn').textContent = txt.easterDismiss;
      document.getElementById('easter-modal').classList.remove('hidden');
      markEasterFound(kind);
    }

    // Track 10x red streak
    function easterTrackChoice(choice) {
      if (choice === 'red') {
        easterRedStreak++;
        if (easterRedStreak >= 10 && !hasEasterBeenFound('streak')) {
          // Show after slight delay so it doesn't crowd the result reveal
          setTimeout(() => showEaster('streak'), 1200);
        }
      } else {
        easterRedStreak = 0;
      }
    }

    // Detect "both pressed" — track timing of clicks on red and blue
    let lastChoiceTime = 0;
    let lastChoiceColor = null;
    function easterTrackTiming(choice) {
      const now = performance.now();
      if (lastChoiceColor && lastChoiceColor !== choice && (now - lastChoiceTime) < 250) {
        // Two opposing clicks within 250ms — counts as "both"
        if (!hasEasterBeenFound('both')) {
          setTimeout(() => showEaster('both'), 800);
        }
      }
      lastChoiceTime = now;
      lastChoiceColor = choice;
    }

    // 3:33 AM check — runs once per page load
    function easterCheckNightTime() {
      if (hasEasterBeenFound('night')) return;
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      // Trigger between 3:33 and 3:36 to give a small window
      if (h === 3 && m >= 33 && m <= 36) {
        // Show after a few seconds of being on the page (don't spook them)
        setTimeout(() => showEaster('night'), 4000);
      }
    }

    // ───────────────────────────────────────────────

    // ───────────────────────────────────────────────
    // HISTOGRAM RAIN — animated dots representing voters
    // ───────────────────────────────────────────────

    let histogramAnimationId = null;
    let histogramDots = [];
    let histogramLastSpawn = 0;
    let histogramVisibilityState = 'visible';

    function spawnDot(canvas) {
      const total = globalStats.total || 1;
      const blueRatio = globalStats.blue / total;
      // Each dot is independently red/blue weighted by current global ratio
      const isBlue = Math.random() < blueRatio;
      const w = canvas.width;
      const h = canvas.height;

      // Spawn from random x at top; bias slightly toward correct side
      const sideBias = isBlue ? (0.5 + Math.random() * 0.5) : (Math.random() * 0.5);
      const x = sideBias * w;

      histogramDots.push({
        x: x,
        y: -4,
        vy: 0.3 + Math.random() * 0.6,
        radius: 1.2 + Math.random() * 0.8,
        color: isBlue ? 'rgba(37, 99, 184, 0.9)' : 'rgba(200, 48, 44, 0.85)',
        isBlue: isBlue,
        opacity: 0.85,
        hasLanded: false
      });

      // Cap to prevent memory bloat — drop oldest
      if (histogramDots.length > 220) {
        histogramDots.splice(0, histogramDots.length - 220);
      }
    }

    function animateHistogram() {
      const canvas = document.getElementById('histogram-rain-canvas');
      if (!canvas) {
        histogramAnimationId = requestAnimationFrame(animateHistogram);
        return;
      }

      // Pause animation when tab is hidden to save battery
      if (histogramVisibilityState === 'hidden') {
        histogramAnimationId = requestAnimationFrame(animateHistogram);
        return;
      }

      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      // Adapt canvas to its actual displayed size for crispness
      const displayWidth = canvas.offsetWidth;
      if (displayWidth && Math.abs(canvas.width - displayWidth) > 4) {
        canvas.width = displayWidth;
      }

      // Faded trail effect — clear with semi-transparent black
      ctx.fillStyle = 'rgba(13, 13, 14, 0.16)';
      ctx.fillRect(0, 0, canvas.width, h);

      // Spawn rate based on volume of activity (slower, more contemplative)
      const now = performance.now();
      const total = globalStats.total || 0;
      const baseSpawnRate = total > 1000 ? 180 : (total > 100 ? 280 : 450); // ms between spawns
      if (now - histogramLastSpawn > baseSpawnRate) {
        spawnDot(canvas);
        histogramLastSpawn = now;
      }

      // Update + draw dots
      histogramDots.forEach((dot, i) => {
        if (dot.hasLanded) {
          // Fading on the bottom
          dot.opacity *= 0.985;
          if (dot.opacity < 0.05) {
            dot.markedForRemoval = true;
            return;
          }
        } else {
          dot.y += dot.vy;
          if (dot.y > h - 4) {
            dot.y = h - 4;
            dot.hasLanded = true;
          }
        }

        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
        const baseColor = dot.color;
        ctx.fillStyle = baseColor.replace(/[\d.]+\)$/, dot.opacity + ')');
        ctx.fill();
      });

      // Cleanup dead dots
      histogramDots = histogramDots.filter(d => !d.markedForRemoval);

      histogramAnimationId = requestAnimationFrame(animateHistogram);
    }

    function startHistogramAnimation() {

    const SOUND_ENABLED_KEY = 'gamestheory_sound_enabled';
    let audioContext = null;
    let soundEnabled = false;

    function initSound() {
      try {
        const stored = localStorage.getItem(SOUND_ENABLED_KEY);
        // Default: ON (only OFF if explicitly set to '0')
        soundEnabled = stored !== '0';
      } catch(e) { soundEnabled = true; }
      updateSoundToggle();
    }

    function ensureAudioContext() {
      if (!audioContext) {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) { return null; }
      }
      // Resume if suspended (autoplay policy)
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      try { localStorage.setItem(SOUND_ENABLED_KEY, soundEnabled ? '1' : '0'); } catch(e) {}
      updateSoundToggle();
      if (soundEnabled) {
        // Confirm click
        const ctx = ensureAudioContext();
        if (ctx) playClick('blue', 0.15);
      }
    }

    function updateSoundToggle() {
      const btn = document.getElementById('sound-toggle');
      if (btn) {
        btn.textContent = '♪';
        btn.classList.toggle('muted', !soundEnabled);
        const titles = {
          en: { on: 'Sound on — click to mute', off: 'Sound off — click to enable' },
          pl: { on: 'Dźwięk włączony — kliknij aby wyłączyć', off: 'Dźwięk wyłączony — kliknij aby włączyć' },

    // Subtle click — short percussive tone
    function playClick(side, volume = 0.2) {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      // Red: lower, harder. Blue: higher, softer.
      osc.type = 'sine';
      osc.frequency.setValueAtTime(side === 'red' ? 220 : 440, now);
      osc.frequency.exponentialRampToValueAtTime(side === 'red' ? 110 : 330, now + 0.08);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(side === 'red' ? 800 : 1500, now);
      filter.Q.value = 2;

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(volume, now + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    // Death — dramatic low descending fade (when blue dies)
    function playDeath() {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      // Layered low drone with descending pitch
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(110, now);
      osc1.frequency.exponentialRampToValueAtTime(40, now + 1.4);

      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(165, now);  // perfect 5th
      osc2.frequency.exponentialRampToValueAtTime(60, now + 1.4);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(600, now);
      filter.frequency.exponentialRampToValueAtTime(150, now + 1.4);

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.6);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 1.45);
      osc2.stop(now + 1.45);
    }

    // Triumph — ascending major chord (when blue wins)
    function playTriumph() {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      // Three notes in ascending succession (major triad: C E G)
      const notes = [
        { freq: 261.63, start: 0,    dur: 1.4 },
        { freq: 329.63, start: 0.18, dur: 1.2 },
        { freq: 392.00, start: 0.36, dur: 1.0 }
      ];

      notes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = n.freq;
        gain.gain.setValueAtTime(0, now + n.start);
        gain.gain.linearRampToValueAtTime(0.12, now + n.start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + n.start);
        osc.stop(now + n.start + n.dur + 0.02);
      });
    }

    // Heavy result (red wins, blue died) — somber low tone
    function playHeavy() {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 130;  // C3
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.1, now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.95);
    }

    function simulateBluePercent() {
      const r = Math.random();
      // 7% — prawie wszyscy czerwony (uruchamia resultRedAllRed)
      if (r < 0.07) return Math.random() * 0.9;
      // 25% — niebieski wyraźnie wygrywa (resultBlueWon / resultRedBlueWon)
      if (r < 0.32) return 52 + Math.random() * 30;
      // 18% — blisko progu po stronie niebieskiej (drama 50/50)
      if (r < 0.50) return 43 + Math.random() * 12;
      // 30% — typowa kooperacja laboratoryjna (~lab baseline)
      if (r < 0.80) return 28 + Math.random() * 17;
      // 20% — niska kooperacja
      return 6 + Math.random() * 20;
    }

    function getResult(choice, bluePct) {
      const txt = t();
      const blueWon = bluePct > 50;
      const everyoneRed = bluePct < 1;
      if (choice === 'red') {
        if (blueWon) return txt.resultRedBlueWon;
        if (everyoneRed) return txt.resultRedAllRed;
        return txt.resultRedBlueDied;
      }
      return blueWon ? txt.resultBlueWon : txt.resultBlueDied;
    }

    function unlockNextQuestion(choice) {
      const txt = t();
      const arr = choice === 'blue' ? txt.questionsBlue : txt.questionsRed;
      const unlocked = choice === 'blue' ? unlockedBlue : unlockedRed;
      if (unlocked.length >= arr.length) return null;
      const idx = unlocked.length;
      unlocked.push(idx);
      return { text: arr[idx], number: idx + 1, side: choice, total: arr.length };
    }

    function getPattern(choice, bluePct, msg) {
      const txt = t();
      const p = bluePct.toFixed(1);
      return {
        title: msg.title,
        sub: typeof msg.sub === 'function' ? msg.sub(p) : msg.sub,
        detail: msg.detail(p),
        mood: msg.mood
      };
    }

    function choose(choice) {
      // Sound: click immediately for haptic feel
      playClick(choice);

      // Easter egg tracking
      easterTrackChoice(choice);
      easterTrackTiming(choice);

      // Record first-ever vote for this device (no-op if already voted or no API)
      const wasFirstVote = !firstChoice;
      if (wasFirstVote) {
        // Optimistic UI update for immediate feedback
        // We DO NOT set firstChoice here — recordFirstVote does that ONLY after server confirms
        // (this way, if POST fails, the user can retry next time)
        globalStats[choice] = (globalStats[choice] || 0) + 1;
        globalStats.total = (globalStats.total || 0) + 1;
        renderLiveBanner();
        flashLiveStat(choice);
        recordFirstVote(choice);
      }

      const bluePct = simulateBluePercent();
      const rawMsg = getResult(choice, bluePct);
      const msg = getPattern(choice, bluePct, rawMsg);
      stats.total++;
      if (choice === 'red') stats.red++; else stats.blue++;
      const newQ = unlockNextQuestion(choice);
      const txt = t();
      const blueWidth = Math.round(bluePct);
      const redWidth = 100 - blueWidth;

      const noNewQ = !newQ ? (() => {
        const sideLabel = choice === 'blue' ? { en: 'blue', pl: 'kwestionujące niebieski', fr: 'qui contestent le bleu' }[currentLang]

    async function fetchScenarioStats(scenarioId) {
      if (!API_BASE) return null;
      try {
        const res = await fetch(`${API_BASE}/api/scenario/${encodeURIComponent(scenarioId)}/stats?t=${Date.now()}`, {
          method: 'GET',
          cache: 'no-store',
        });
        if (!res.ok) throw new Error('Bad response');
        const data = await res.json();
        // Sanitize
        const safeNum = (v) => {
          const n = Number(v);
          if (!Number.isFinite(n) || n < 0) return 0;
          return Math.floor(n);
        };
        return {
          cooperate: safeNum(data.cooperate),
          defect: safeNum(data.defect),
          total: safeNum(data.total),
        };
      } catch (e) {
        return null;
      }
    }

    async function submitScenarioVote(scenarioId, choice) {
      if (!API_BASE) return null;
      // Whitelist scenarioId to known scenarios to prevent arbitrary endpoint creation
      if (!SCENARIOS.find(s => s.id === scenarioId)) return null;
      if (choice !== 'cooperate' && choice !== 'defect') return null;
      try {
        const res = await fetch(`${API_BASE}/api/scenario/${encodeURIComponent(scenarioId)}/vote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voter_id: voterId, choice }),
        });
        if (!res.ok) throw new Error('Bad response: ' + res.status);
        const data = await res.json();
        const safeNum = (v) => {
          const n = Number(v);
          if (!Number.isFinite(n) || n < 0) return 0;
          return Math.floor(n);
        };
        if (data.stats) {
          return {
            cooperate: safeNum(data.stats.cooperate),
            defect: safeNum(data.stats.defect),
            total: safeNum(data.stats.total),
          };
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    async function showScenario(scenarioId) {
      currentScenarioId = scenarioId;
      const txt = t();
      const meta = SCENARIOS.find(s => s.id === scenarioId);
      if (!meta) return;
      const sd = (txt.scenarios && txt.scenarios[scenarioId]) || null;

      const userVote = scenarioVotes[scenarioId];
      const screen = document.getElementById('screen-scenario-detail');

      // Render initial layout (without result yet, fetched async if user already voted)
      const renderShell = (resultBlock) => `
        <div class="scenario-detail">
          <div class="scenario-detail-eyebrow">${escapeHtml(sd.short)}</div>
          <h1>${escapeHtml(sd.title)}</h1>

              ${escapeHtml(sd.cooperateLabel)}
            </button>
            <button class="scenario-choice scenario-choice-defect ${userVote === 'defect' ? 'selected' : ''}"
              ${userVote ? 'disabled' : ''}

              ${escapeHtml(sd.defectLabel)}
            </button>
          </div>
          ${resultBlock}
          <div class="scenario-result-actions">
            ${userVote ? (() => {
              // Find next unanswered scenario after the current one in the list
              const currentIdx = SCENARIOS.findIndex(s => s.id === scenarioId);
              // Look forward from current+1 first, then wrap to start
              let next = SCENARIOS.slice(currentIdx + 1).find(s => !scenarioVotes[s.id])
                      || SCENARIOS.slice(0, currentIdx).find(s => !scenarioVotes[s.id]);
              if (next) {
                return `<button class="btn btn-personality-active" onclick="showScenario('${next.id}')">${txt.scenariosNext}</button>`;
              }
              // All answered — surface signature button instead
              return `<button class="btn btn-personality-active" onclick="showCooperationSignature()">${txt.scenariosViewSignature} ↗</button>`;
            })() : ''}
            <button class="btn" onclick="showScenarios()">${txt.scenariosListBack}</button>
            ${userVote && SCENARIOS.filter(s => scenarioVotes[s.id]).length > 0 && SCENARIOS.find(s => !scenarioVotes[s.id])
              ? `<button class="btn" onclick="showCooperationSignature()">${txt.scenariosViewSignature}</button>`
              : ''}
          </div>
        </div>
      `;

      hideAll();
      screen.innerHTML = renderShell('');
      screen.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // If user has already voted, show the result block (fetch fresh stats)
      if (userVote) {
        const stats = await fetchScenarioStats(scenarioId);
        renderScenarioResult(scenarioId, userVote, stats);
      }
    }

    async function handleScenarioVote(scenarioId, choice) {
      // Optimistically save locally first
      saveScenarioVote(scenarioId, choice);
      playClick(choice === 'cooperate' ? 'blue' : 'red', 0.18);

      // Submit to server (fire-and-forget — we re-render with fresh stats below)
      const stats = await submitScenarioVote(scenarioId, choice);

      // Check if this was the LAST scenario answered — if so, give the user a moment
      // to see the result, then auto-advance to the cooperation signature
      const total = SCENARIOS.length;
      const answered = SCENARIOS.filter(s => scenarioVotes[s.id]).length;
      const justCompletedAll = answered === total;

      // Re-render the scenario screen with the result
      await showScenario(scenarioId);

      // If they just completed the last one, auto-show the signature after a beat
      if (justCompletedAll) {
        // Don't blow past their last result — give them a moment to read it
        setTimeout(() => {
          // Only auto-advance if user is still on the scenario detail screen
          const detailScreen = document.getElementById('screen-scenario-detail');
          if (detailScreen && !detailScreen.classList.contains('hidden')) {
            showCooperationSignature();
          }
        }, 4000);
      }
    }

    function renderScenarioResult(scenarioId, userChoice, stats) {
      const txt = t();
      const meta = SCENARIOS.find(s => s.id === scenarioId);
      const sd = (txt.scenarios && txt.scenarios[scenarioId]) || null;
      if (!meta || !sd) return;

      // Build result block content
      let resultHtml;
      if (!stats || stats.total === 0) {
        // No data yet from server — show user's choice but defer interpretation
        const userChoiceLabel = userChoice === 'cooperate' ? txt.scenariosYouCooperated : txt.scenariosYouDefected;
        resultHtml = `
          <div class="scenario-result">
            <div class="scenario-result-header">${txt.scenariosResultHeader}</div>
            <div class="scenario-result-stats">${escapeHtml(txt.liveLoading || '...')}</div>
            <div class="scenario-result-your">${userChoiceLabel}</div>
          </div>
        `;
      } else {
        const pct = Math.round((stats.cooperate / stats.total) * 100);
        const thresholdMet = pct >= meta.threshold;
        const statsText = thresholdMet
          ? txt.scenariosResultThresholdMet(pct, meta.threshold)
          : txt.scenariosResultThresholdMissed(pct, meta.threshold);

        // Determine which interpretation to show
        let interpretText;
        if (userChoice === 'cooperate' && thresholdMet) interpretText = sd.interpretCooperateWin;
        else if (userChoice === 'cooperate' && !thresholdMet) interpretText = sd.interpretCooperateLose;
        else if (userChoice === 'defect' && thresholdMet) interpretText = sd.interpretDefectWin;
        else interpretText = sd.interpretDefectLose;

        const userChoiceLabel = userChoice === 'cooperate' ? txt.scenariosYouCooperated : txt.scenariosYouDefected;

        resultHtml = `
          <div class="scenario-result">
            <div class="scenario-result-header">${txt.scenariosResultHeader}</div>
            <div class="scenario-result-stats">${statsText}</div>
            <div class="scenario-result-your">${userChoiceLabel}</div>
            <div class="scenario-result-interpret">${escapeHtml(interpretText)}</div>
          </div>
        `;
      }

      // Inject into the existing screen — find a good slot
      const screen = document.getElementById('screen-scenario-detail');
      const detail = screen.querySelector('.scenario-detail');
      if (!detail) return;
      const choices = detail.querySelector('.scenario-choices');
      if (!choices) return;
      // Remove any existing result block
      const old = detail.querySelector('.scenario-result');
      if (old) old.remove();
      // Insert after choices
      choices.insertAdjacentHTML('afterend', resultHtml);
    }

    /**
     * Router used by CTA banners — sends user to the signature when all scenarios
     * are done, otherwise to the list. Avoids the awkward "you've answered all 10"
     * banner copy leading to a list of already-answered cards.
     */
    function goToScenarios() {
      const total = SCENARIOS.length;
      const answered = SCENARIOS.filter(s => scenarioVotes[s.id]).length;
      if (answered >= total) {
        showCooperationSignature();
      } else {
        showScenarios();
      }
    }

    /**
     * Cooperation Signature — completion screen after answering all 10 scenarios.
     * Shows: percentage of scenarios you cooperated in, comparison to global average,
     * and Top 3 rankings: where you most stood OUT for cooperation, and where for defection.
     */
    async function showCooperationSignature() {
      const txt = t();
      const total = SCENARIOS.length;
      const answered = SCENARIOS.filter(s => scenarioVotes[s.id]).length;
      const screen = document.getElementById('screen-signature');

      // Locked state ONLY if zero answered yet
      if (answered === 0) {
        const html = `
          <div class="signature-card">
            <div class="signature-eyebrow">${txt.scenariosCompletionLockedTitle}</div>
            <div class="signature-pattern">${escapeHtml(txt.scenariosCompletionLockedSub(answered, total))}</div>
            <div style="text-align: center; margin-top: 20px;">
              <button class="btn" onclick="showScenarios()">${txt.scenariosBackToList}</button>
            </div>
          </div>
        `;
        hideAll();
        screen.innerHTML = html;
        screen.classList.remove('hidden');
        return;
      }

      // Render shell with loading state, then fetch all scenarios in parallel
      hideAll();
      screen.innerHTML = `
        <div class="signature-card">
          <div class="signature-eyebrow">${txt.scenariosSignatureLabel}</div>
          <div class="signature-headline">${txt.scenariosCompletionTitle}</div>
          <div class="signature-pattern">${escapeHtml(txt.scenariosCompletionSub)}</div>
          <div style="text-align: center; color: var(--text-mute); padding: 18px;">${escapeHtml(txt.liveLoading || '...')}</div>
        </div>
      `;
      screen.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Parallel fetch all scenario stats (only for those user voted on)
      const allStats = await Promise.all(SCENARIOS.map(s => fetchScenarioStats(s.id)));

      // Compute user's cooperation score over ANSWERED scenarios only (0..1)
      const answeredScenarios = SCENARIOS.filter(s => scenarioVotes[s.id]);
      const userCooperatedCount = answeredScenarios.filter(s => scenarioVotes[s.id] === 'cooperate').length;
      const userScore = answered > 0 ? userCooperatedCount / answered : 0;

      // Compute global average cooperation score (0..1) across answered scenarios where stats exist
      let globalAvg = null;
      const validScenarios = [];
      SCENARIOS.forEach((s, i) => {
        if (!scenarioVotes[s.id]) return; // skip unanswered
        const stats = allStats[i];
        if (stats && stats.total > 0) {
          const pct = stats.cooperate / stats.total;
          validScenarios.push({ id: s.id, threshold: s.threshold, userChoice: scenarioVotes[s.id], stats, pct });
        }
      });
      if (validScenarios.length > 0) {
        globalAvg = validScenarios.reduce((sum, v) => sum + v.pct, 0) / validScenarios.length;
      }

      // Build dots row — answered = colored, unanswered = neutral outline
      const dotsHtml = SCENARIOS.map(s => {
        const c = scenarioVotes[s.id];
        if (!c) return `<div class="signature-dot pending" title="${escapeHtml((txt.scenarios[s.id] && txt.scenarios[s.id].title) || s.id)}"></div>`;
        return `<div class="signature-dot ${c === 'cooperate' ? 'cooperate' : 'defect'}" title="${escapeHtml((txt.scenarios[s.id] && txt.scenarios[s.id].title) || s.id)}"></div>`;
      }).join('');

      // Comparison text (only when meaningful — at least 3 answered)
      let comparisonHtml;
      if (answered < 3) {
        // Too few answers for meaningful comparison
        comparisonHtml = '';
      } else if (globalAvg === null) {
        comparisonHtml = `<div class="signature-comparison">${escapeHtml(txt.scenariosNoStatsYet)}</div>`;
      } else {
        const diff = userScore - globalAvg;
        let comparisonText;
        if (Math.abs(diff) < 0.05) {
          comparisonText = txt.scenariosComparisonSame;
        } else if (diff > 0) {
          const percentile = Math.min(95, Math.round(50 + (diff * 100)));
          comparisonText = txt.scenariosComparisonMore(percentile);
        } else {
          const percentile = Math.min(95, Math.round(50 + (Math.abs(diff) * 100)));
          comparisonText = txt.scenariosComparisonLess(percentile);
        }
        comparisonHtml = `<div class="signature-comparison">${escapeHtml(comparisonText)}</div>`;
      }

      // Compute top 3 standout cooperate / defect — over answered scenarios
      const cooperateStandouts = validScenarios
        .filter(v => v.userChoice === 'cooperate')
        .map(v => ({ ...v, gap: 1 - v.pct }))
        .sort((a, b) => b.gap - a.gap)
        .slice(0, 3);

      const defectStandouts = validScenarios
        .filter(v => v.userChoice === 'defect')
        .map(v => ({ ...v, gap: v.pct }))
        .sort((a, b) => b.gap - a.gap)
        .slice(0, 3);

      const renderRanking = (items, kind) => {
        if (items.length === 0) {
          return `<div class="signature-ranking-empty">${escapeHtml(txt.scenariosTopNone)}</div>`;
        }
        return items.map(item => {
          const sd = txt.scenarios[item.id];
          const cooperatePct = Math.round(item.pct * 100);
          const displayPct = kind === 'cooperate' ? (100 - cooperatePct) : cooperatePct;
          return `
            <div class="signature-ranking-item">
              <div class="signature-ranking-name">${escapeHtml(sd.title)}</div>
              <div class="signature-ranking-bar">
                <span class="signature-ranking-pct ${kind}">${displayPct}%</span>
                <span>${kind === 'cooperate' ? (txt.scenariosYouCooperated || '').replace('.','') : (txt.scenariosYouDefected || '').replace('.','')}</span>
              </div>
            </div>
          `;
        }).join('');
      };

      // "Continue" button — surfaces next unanswered scenario if any remain
      const nextUnanswered = SCENARIOS.find(s => !scenarioVotes[s.id]);
      const continueBtn = nextUnanswered
        ? `<button class="btn btn-personality-active" onclick="showScenario('${nextUnanswered.id}')">${txt.scenariosNext}</button>`
        : '';

      // Show rankings only if there are stats; hide both blocks when there's nothing to compare
      const rankingsHtml = (cooperateStandouts.length > 0 || defectStandouts.length > 0) ? `
        <div class="signature-ranking">
          <div class="signature-ranking-label">${txt.scenariosTopCooperateLabel}</div>
          <div class="signature-ranking-sub">${escapeHtml(txt.scenariosTopCooperateSub)}</div>
          <div class="signature-ranking-list">${renderRanking(cooperateStandouts, 'cooperate')}</div>
        </div>

        <div class="signature-ranking">
          <div class="signature-ranking-label">${txt.scenariosTopDefectLabel}</div>
          <div class="signature-ranking-sub">${escapeHtml(txt.scenariosTopDefectSub)}</div>
          <div class="signature-ranking-list">${renderRanking(defectStandouts, 'defect')}</div>
        </div>
      ` : '';

      const html = `
        <div class="signature-card">
          <div class="signature-eyebrow">${txt.scenariosSignatureLabel}</div>
          <div class="signature-headline">${txt.scenariosCompletionTitle}</div>
          <div class="signature-pattern">${escapeHtml(txt.scenariosSignatureCooperated(userCooperatedCount, answered, total))}</div>
          <div class="signature-dots">${dotsHtml}</div>
          ${comparisonHtml}
        </div>

        ${rankingsHtml}

        <div style="text-align: center; margin-top: 36px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
          ${continueBtn}
          <button class="btn" onclick="showScenarios()">${txt.scenariosBackToList}</button>
          <button class="btn" onclick="playAgain()">${txt.personalityBack}</button>
        </div>
      `;

      screen.innerHTML = html;
    }


    (function setupFaviconAnimation() {
      const favicon = document.getElementById('dynamic-favicon');
      if (!favicon) return;

      const makeFaviconSvg = (color) =>
        `data:image/svg+xml,${encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="${color}"/></svg>`
        )}`;

      const RED = '#C8302C';
      const BLUE = '#2563b8';
      let isRed = true;

      // Pause animation when tab not visible to save CPU
      let intervalId = null;
      const tick = () => {
        isRed = !isRed;
        favicon.href = makeFaviconSvg(isRed ? RED : BLUE);
      };

      const start = () => {
        if (intervalId) return;
        intervalId = setInterval(tick, 1000);
      };
      const stop = () => {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      };

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stop(); else start();
      });

      start();
    })();

    // Detect browser language and initialize global stats tracking
    (function() {
      // Set up voter identity (idempotent)
      voterId = getOrCreateVoterId();
      try {
        const stored = localStorage.getItem(FIRST_CHOICE_KEY);
        // Only accept exact 'red' or 'blue' — anything else is treated as no vote
        firstChoice = (stored === 'red' || stored === 'blue') ? stored : null;
      } catch(e) {
        firstChoice = null;
      }
      loadScenarioVotes();

      // Detect language from URL ?lang= parameter, then browser
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      const browserLang = (navigator.language || 'en').toLowerCase();

      let detectedLang = 'en';
      if (urlLang === 'pl' || urlLang === 'fr' || urlLang === 'en') {
        detectedLang = urlLang;
      } else if (browserLang.startsWith('pl')) {
        detectedLang = 'pl';
      } else if (browserLang.startsWith('fr')) {
        detectedLang = 'fr';
      }

      if (detectedLang !== 'en') {
        setLang(detectedLang);
      } else {
        renderIntro();
        renderLiveBanner();
      }

      // Fetch real global stats (async, non-blocking)
      fetchGlobalStats();

      // Initialize sound from saved preference
      initSound();

      // Start animated voter histogram (lazy — runs at ~60fps but yields when tab hidden)
      startHistogramAnimation();

      // Check for 3:33 night-time easter egg
      easterCheckNightTime();

      // If user already voted, show subtle indicator on intro
      if (firstChoice) {
        showLiveStatus(t().liveAlreadyVoted, 'success');
      }

      // Show privacy banner once on first visit
      if (shouldShowPrivacyBanner()) {
        // Tiny delay so the banner doesn't flash before page loads
        setTimeout(showPrivacyBanner, 600);
      }
    })();
  </script>
</body>
</html>

  <style>
    :root {
      --bg: #0d0d0e;
      --surface: #18181b;
      --surface-2: #212125;
      --text: #ece7dc;
      --text-mute: #b8b3a9;
      --text-faint: #847f78;
      --border: rgba(236, 231, 220, 0.12);
      --border-strong: rgba(236, 231, 220, 0.28);
      --red: #d83a36;
      --red-deep: #7a1815;
      --red-text: #f8d6d4;
      --blue: #3a7ad4;
      --blue-deep: #143a72;
      --blue-text: #cce0f7;
      --accent: #e0c8a4;
      --warning: #e0b070;
      --success: #8ec8aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Newsreader', Georgia, serif;
      font-size: 17px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(212, 184, 150, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(37, 99, 184, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.9 0 0 0 0 0.85 0 0 0 0 0.75 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      position: relative;
      z-index: 2;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 64px;
      padding-bottom: 16px;
      border-bottom: 0.5px solid var(--border);
    }

    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-mute);
      text-transform: uppercase;
    }

    .lang-toggle {
      display: flex;
      gap: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .lang-toggle button {
      background: transparent;
      border: 0.5px solid var(--border);
      color: var(--text-mute);
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
    }

    .lang-toggle button:first-child { border-radius: 4px 0 0 4px; }
    .lang-toggle button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
    .lang-toggle button:hover { color: var(--text); }
    .lang-toggle button.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .hero { margin-bottom: 56px; }

    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: clamp(56px, 10vw, 96px);
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-sub {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--text-mute);
      max-width: 480px;
      line-height: 1.4;
    }

    .live-banner {
      background: linear-gradient(135deg, rgba(212, 184, 150, 0.06) 0%, rgba(126, 184, 154, 0.04) 100%);
      border: 0.5px solid rgba(212, 184, 150, 0.25);
      border-radius: 8px;
      padding: 22px 24px;
      margin-bottom: 24px;
      position: relative;
    }

    .live-banner-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .live-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7eb89a;
      box-shadow: 0 0 0 0 rgba(126, 184, 154, 0.6);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(126, 184, 154, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(126, 184, 154, 0); }
      100% { box-shadow: 0 0 0 0 rgba(126, 184, 154, 0); }
    }

    .live-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 500;
    }

    .live-explain {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 16px;
      opacity: 0.92;
    }

    .live-explain em {
      font-style: italic;
      color: var(--accent);
      font-weight: 500;
    }

    .live-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .live-stat {
      background: rgba(255,255,255,0.025);
      border-radius: 6px;
      padding: 12px 10px;
      text-align: center;
      border: 0.5px solid rgba(255,255,255,0.04);
      transition: background 0.4s, border-color 0.4s;
    }

    .live-stat.flash {
      background: rgba(212, 184, 150, 0.12);
      border-color: rgba(212, 184, 150, 0.4);
    }

    .live-stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .live-stat-value {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 1;
      transition: color 0.3s;
    }

    .live-stat-value.red { color: var(--red); }
    .live-stat-value.blue { color: var(--blue); }

    .live-stat-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-mute);
      margin-top: 4px;
    }

    .live-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-mute);
      text-align: center;
      margin-top: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      text-transform: uppercase;
    }

    .live-status.visible { opacity: 0.85; }
    .live-status.success { color: var(--success); }
    .live-status.warning { color: var(--warning); }

    .cache-disclaimer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-align: center;
      margin-top: 10px;
      text-transform: uppercase;
      opacity: 0.55;
    }

    /* ─── Progress Bar (Humanity passes the test) ─── */
    .progress-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 0.5px solid rgba(255,255,255,0.06);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-label-left {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-mute);
      text-transform: uppercase;
    }

    .progress-label-right {
      font-family: 'Instrument Serif', serif;
      font-size: 18px;
      color: var(--blue);
      font-weight: 500;
    }

    .progress-track {
      position: relative;
      height: 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      overflow: hidden;
      border: 0.5px solid rgba(255,255,255,0.08);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue) 0%, #4a8fd1 100%);
      border-radius: 6px;
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(37, 99, 184, 0.4);
    }

    .progress-fill.humanity-passing {
      background: linear-gradient(90deg, var(--success) 0%, #5a9a82 100%);
      box-shadow: 0 0 16px rgba(126, 184, 154, 0.6);
      animation: gentle-glow 2.5s ease-in-out infinite;
    }

    @keyframes gentle-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(126, 184, 154, 0.4); }
      50% { box-shadow: 0 0 24px rgba(126, 184, 154, 0.7); }
    }

    .progress-threshold-marker {
      position: absolute;
      left: 50%;
      top: -4px;
      bottom: -4px;
      width: 1px;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 0 6px rgba(255,255,255,0.4);
    }

    .progress-threshold-marker::before {
      content: '';
      position: absolute;
      left: -3px;
      top: -2px;
      width: 7px;
      height: 7px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
    }

    .progress-marker-label {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .progress-status {
      margin-top: 26px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--text-mute);
      text-align: center;
      line-height: 1.5;
    }

    .progress-status.passed {
      color: var(--success);
      font-style: normal;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(126, 184, 154, 0.4);
    }

    .histogram-rain-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 0.5px solid rgba(255,255,255,0.04);
    }

    #histogram-rain-canvas {
      display: block;
      width: 100%;
      height: 36px;
      max-width: 100%;
      opacity: 0.75;
    }

    .histogram-rain-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
      text-align: center;
      margin-top: 8px;
      opacity: 0.6;
    }

    /* ─── Personality / Self-test CTA ─── */
    .self-test-cta {
      background: linear-gradient(135deg, rgba(212, 184, 150, 0.06) 0%, rgba(212, 184, 150, 0.02) 100%);
      border: 0.5px solid rgba(212, 184, 150, 0.18);
      border-radius: 8px;
      padding: 18px 22px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.25s;
    }

    .self-test-cta:hover {
      border-color: rgba(212, 184, 150, 0.4);
      transform: translateY(-1px);
    }

    .self-test-icon {
      font-family: 'Instrument Serif', serif;
      font-size: 28px;
      color: var(--accent);
      line-height: 1;
      flex-shrink: 0;
    }

    .self-test-content {
      flex: 1;
    }

    .self-test-title {
      font-family: 'Instrument Serif', serif;
      font-size: 18px;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .self-test-sub {
      font-size: 13px;
      color: var(--text-mute);
      line-height: 1.4;
    }

    .self-test-arrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--accent);
      opacity: 0.6;
    }

    /* ─── Personality Result Card ─── */
    .personality-card {
      background: linear-gradient(135deg, #1a1a1c 0%, #0f0f10 100%);
      border: 0.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 36px 32px;
      margin: 24px 0;
      position: relative;
      overflow: hidden;
    }

    .personality-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 60%;
      height: 200%;
      background: radial-gradient(circle, rgba(212, 184, 150, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .personality-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 12px;
      position: relative;
    }

    .personality-name {
      font-family: 'Instrument Serif', serif;
      font-size: 44px;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .personality-name em {
      font-style: italic;
      color: var(--accent);
    }

    .personality-tagline {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--text-mute);
      line-height: 1.4;
      margin-bottom: 24px;
      position: relative;
    }

    .personality-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
      position: relative;
    }

    .personality-stat {
      text-align: center;
      padding: 12px 8px;
      background: rgba(255,255,255,0.025);
      border-radius: 6px;
    }

    .personality-stat-value {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .personality-stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .personality-description {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      opacity: 0.88;
      margin-bottom: 24px;
      position: relative;
    }

    .personality-quote {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 26px;
      line-height: 1.35;
      color: var(--accent);
      text-align: center;
      margin: 0 0 28px;
      padding: 22px 24px;
      border-top: 0.5px solid rgba(212, 184, 150, 0.2);
      border-bottom: 0.5px solid rgba(212, 184, 150, 0.2);
      letter-spacing: -0.01em;
      position: relative;
      z-index: 1;
    }

    .personality-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
    }

    .btn-primary {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: #e5cba4;
      transform: translateY(-1px);
    }

    .personality-locked {
      text-align: center;
      padding: 30px 24px;
      background: var(--surface);
      border-radius: 8px;
      border: 0.5px dashed var(--border-strong);
    }

    .personality-locked-text {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--text-mute);
      margin-bottom: 8px;
    }

    .personality-locked-progress {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    /* ─── Geo Map ─── */
    .map-toggle {
      text-align: center;
      margin-top: 14px;
    }

    .map-container {
      margin-top: 16px;
      padding: 18px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      border: 0.5px solid var(--border);
    }

    .map-container-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-mute);
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }

    .map-svg {
      width: 100%;
      height: auto;
      max-height: 320px;
      display: block;
    }

    .map-svg .country {
      stroke: rgba(255,255,255,0.12);
      stroke-width: 0.4;
      transition: opacity 0.2s;
      cursor: pointer;
    }

    .map-svg .country:hover {
      opacity: 0.8;
      stroke: rgba(255,255,255,0.4);
      stroke-width: 0.8;
    }

    .map-legend {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-mute);
    }

    .map-legend-gradient {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .map-legend-bar {
      width: 80px;
      height: 8px;
      background: linear-gradient(90deg, var(--red) 0%, #777 50%, var(--blue) 100%);
      border-radius: 2px;

          <h3>The basic idea</h3>
          <p>You have two buttons: <strong>red</strong> and <strong>blue</strong>. Imagine every person on Earth has the same two buttons. The rules:</p>

          <p>Red is the safe choice. Blue is an act of trust in other people.</p>

          <p>Your <strong>first click</strong> on red or blue is recorded in the global counter. Every device casts at most one vote. After that, you can keep clicking — but those clicks only run a simulation. The world map and statistics show real votes from real people.</p>

          <h3>Your profile</h3>
          <p>The <em>"Test yourself"</em> banner shows your unlock progress. After 5 rounds you'll get your moral type with a quote, statistics, and a downloadable image (1200×630 PNG, perfect for social media). On the result screen, click <em>"Your profile"</em> to see it again.</p>

            title: 'Kant vs Mill',
            eyebrow: 'Philosophy · deontological vs utilitarian ethics',
            readTime: 3,
            content: `<p>Two of the greatest moral philosophers of the 19th century would have answered this dilemma in completely opposite ways. And both would be right — within their own systems.</p>

<h3>Kant: blue is the only possible answer</h3>
<p>The categorical imperative goes roughly: <em>"act only according to that maxim by which you can at the same time will that it should become a universal law."</em> When you pick red, you're saying in effect: <em>"I want everyone to save themselves at the cost of risk to others."</em> But if everyone chose that way, the risk would vanish — everyone would survive. Kant would say: <strong>the logic of your choice undoes its own justification</strong>.</p>
<p>Kant's second formulation cuts even deeper: <em>"treat humanity always as an end, never merely as a means."</em> Picking red means treating other people's lives as acceptable losses for your safety. Blue is the only choice in which no one becomes collateral to your calculation.</p>

<h3>Mill: red is rationally correct</h3>
<p>John Stuart Mill, father of utilitarianism, sees it differently. What matters is <strong>aggregate good</strong>. If the probability that more than 50% of humanity will pick blue is low — and every empirical study says it is — then the expected value of blue for you is negative. You lose your life, and your single vote saves no one, because there won't be enough blues anyway.</p>
<p>Mill says: <strong>your individual sacrifice doesn't change the math</strong>. Given that, the rational decision is red — it minimises suffering (yours) and creates no additional good (too few blues either way).</p>

<h3>Where they part</h3>
<p>Kant judges <em>intent</em>. Mill judges <em>consequences</em>. If a blue choice turns out to be a catastrophe (all blues die), Mill says: "you chose wrongly." Kant says: "you chose well, the world failed you."</p>
<p>This distinction isn't academic. Every consequential moral decision in your life — voting, whistleblowing, putting yourself at risk for a stranger — requires a choice: <strong>do I judge myself by intent, or by outcome?</strong></p>

<h3>A third way: virtue</h3>
<p>Aristotle would say both are wrong to try to compress morality into a rule or a formula. The question isn't "what's right in this situation," but "what kind of person do I want to be?" Blue or red — which choice fits the person you're trying to become?</p>
<p>That's a question no study or simulation can answer for you.</p>`,

            eyebrow: 'Game theory · why red feels "obvious"',
            readTime: 3,
            content: `<p>Thomas Schelling won the Nobel Prize in economics in 2005 for showing that people can coordinate <strong>without communication</strong>. The experiment was simple: two strangers must meet in New York on some day. They can't contact each other. Where do they go, and at what time?</p>
<p>Most answer without hesitation: <strong>Grand Central Station, at noon</strong>. Because it's "obvious." Schelling called this a <em>focal point</em> — a coordination point people converge on by themselves when no other coordination is available.</p>

<h3>Red is the focal point of two buttons</h3>
<p>In our dilemma, red is the <em>dominant strategy</em> in game-theoretic terms — it wins or ties in every possible scenario. But something more important is also true: it's <strong>obvious</strong>. Everyone sees it as safe. Everyone assumes others see it as safe. So everyone picks it — and is right, because everyone else picks it.</p>
<p>The same self-reinforcing belief that "everyone will pick red" produces the reality in which everyone picks red. <strong>Blue requires an assumption no one has grounds to make</strong>: that more than half of unknown people will trust other unknown people.</p>

<h3>Every social movement has been a fight over the focal point</h3>
<p>Think about women's suffrage in the 19th century. The first women voting in New Zealand (1893) didn't change the math — they shifted the focal point. They showed that "women don't vote" wasn't a law of nature, just a default expectation. When the expectation broke, coordination suddenly pushed in the other direction.</p>
<p>The same with LGBT rights, vaccinations, smoking in restaurants, masks in Asia. <strong>Most social change is focal point shifts</strong>, not changes in fundamental morality.</p>

<h3>Why they usually fail</h3>
<p>Schelling also showed focal points are stable. Changing one requires enormous energy and usually coordination from leaders, institutions, media. <strong>A single individual "blue vote" never shifts the focal point</strong> — it can at best be a brick in the foundation of a new one.</p>
<p>This is why heroic individual sacrifice rarely works. The world doesn't need your blue vote as a moral gesture. The world needs a million blue votes <em>simultaneously</em>, ideally with PR and institutional backing. Anything else is romance.</p>

<h3>The brutal conclusion</h3>
<p>So if you pick blue in the real world — in elections, in taxes, on climate — and lose, that <strong>doesn't mean you chose wrongly</strong>. It means the focal point isn't ready yet. Your task is double: pick blue, <em>and</em> work to shift everyone else's expectations. Either alone is insufficient.</p>`,

<p>It's not an accident. It's the cleanest demonstration that <strong>enforced blue beats voluntary red</strong>.</p>

<h3>What the Swiss did differently</h3>
<p>They have no strong leader. The Federal Council consists of seven people, each rotating into the presidential role for a year. Most Swiss can't name their presidents.</p>
<p>They have referenda for every major change. Citizens vote 4 times a year on specific bills. Canton St. Gallen can have different laws than Geneva.</p>
<p>Their army is a militia. Every man under 30 has a gun at home (seriously). But gun violence is lower than most of Europe. Because <strong>guns aren't the problem</strong> — culture is.</p>

<p>A situation where everyone <em>has to</em> pick blue — because the system, law, courts, institutions force it — is stable in a way voluntary blue never will be.</p>
<p>Pakistan is full of people who'd individually click blue. But when a general clicks red and seizes power, everyone else loses the choice. Myanmar, Egypt, Congo — these aren't countries where people are morally worse. They're countries where <strong>mechanisms forcing blue are missing</strong>.</p>
<p>Democracy, separation of powers, independent courts, free media — these are technologies that force blue coordination. Without them any single player (general, oligarch, politician) can always click red and destroy everyone else's outcome.</p>

<h3>Why it's hard to copy</h3>

            content: `<p>August 1st, 1944. Polish Home Army command issues "Operation Tempest" — uprising in Warsaw. 200,000 people facing the German army. The Soviet Red Army stands on the other side of the Vistula river. And waits.</p>
<p>63 days later, Warsaw lies in ruins. 18,000 Home Army soldiers dead, 25,000 wounded, 180,000 civilians dead. The city razed — Germans systematically blew up every building after capitulation.</p>
<p>From a pure utilitarian calculation: <strong>the uprising was a catastrophe</strong>. Mill would say: it shouldn't have started. Too many casualties, too few chances, wrong moment.</p>

<h3>But Mill is wrong here</h3>
<p>Colonel Antoni Chruściel "Monter," uprising commander, knew the statistics. Knew about the Soviets across the river. Knew the Allies wouldn't help effectively. Knew the chances of winning were slim.</p>
<p>He chose blue.</p>
<p>Because the argument for the uprising wasn't utilitarian. The argument was: <strong>"Poland must liberate itself, or it will never really be Polish."</strong> It wasn't a cost-benefit calculation. It was a decision about who we want to be as a nation.</p>

<h3>What's blue here, what's red</h3>
<p>Red in 1944: wait. Let the Soviets liberate. Thousands of Poles will survive, the city will stand. Let someone else pay the price.</p>
<p>Blue: now, despite everything. Without guarantees. Without calculations. Because some things are more important than survival.</p>

<p>80 years later, Poles still argue about it. Was the uprising heroism or madness? Did the High Command have moral right to send young people to die? Did it accelerate Warsaw's fall, or — opposite — prove Poland exists?</p>
<p>There's no clean answer. <strong>Because every answer chooses between two moral systems that are fundamentally contradictory</strong>.</p>
<p>Mill: the sacrifices made no sense. They didn't help. Suspending the uprising would have saved 200,000 lives.</p>
<p>Kant: the sacrifices were an act of dignity. They showed the world Poland decides for itself. Without them, Poland would be a country that waited to be liberated by others. Maybe safer, but a different nation.</p>

            content: `<p>Blue as a choice looks beautiful in the abstract. Collective action, solidarity, saving everyone. Most leftist political thought is built on the assumption that more coordination = more good.</p>
<p>But 20th century history shows something uncomfortable: <strong>forced blue is often worse than voluntary red</strong>. Sometimes by orders of magnitude.</p>

<h3>The Great Leap Forward, China, 1958-1962</h3>
<p>Mao Zedong proclaimed: every village becomes a commune, everyone works for the collective, private fields disappear, private stoves disappear, everyone gives their things to the common good. This was meant to be blue's triumph — coordination that would lift China out of poverty within a decade.</p>
<p>Result: <strong>15-55 million dead from starvation</strong> (estimates vary). The worst famine in human history. Not from drought — from policy. Peasants burned their tools because they were being requisitioned. Adults died in the fields because nobody had motivation to farm land they didn't own.</p>

<h3>Pol Pot and Year Zero, Cambodia, 1975-1979</h3>
<p>The Khmer Rouge proclaimed: collective agrarian society, everything from scratch. Cities were emptied in 24 hours — millions on foot to the countryside. Money was abolished. Religion abolished. Intelligentsia abolished (literally — those who wore glasses died). Family abolished.</p>
<p>Result in 4 years: <strong>1.5-2 million dead</strong>, out of a population of 8 million. One in four Cambodians. This was meant to be the triumph of equality and the collective.</p>

<h3>Soviet collectivisation, USSR, 1929-1933</h3>
<p>Stalin proclaimed: private farms vanish, everything becomes a kolkhoz. Kulaks (wealthier peasants) — class enemy. Their property confiscated, they themselves exiled or killed.</p>
<p>The Holodomor in Ukraine — <strong>3-7 million dead</strong> in 1932-33. Grain was exported to the West while Ukrainians starved. This was meant to be social progress.</p>

<h3>The pattern repeats</h3>
<p>All three cases share the same structure:</p>
<ul>
<li>Blue is officially mandatory (collective ownership, collective good)</li>
<li>Anyone choosing red (hiding grain, fleeing, keeping tools) is a "traitor of the cause"</li>
<li>The system permits no voluntary blue — only enforced blue</li>
<li>Result: <strong>mass death, far greater than any red world would produce</strong></li>
</ul>

<h3>Why this happens</h3>
<p>Voluntary blue requires trust, which is built slowly. It requires institutions that enforce rules without crushing people. It requires accepting that some won't cooperate — and that's OK.</p>
<p><strong>Forced blue is an attempt to achieve trust's outcome without building trust</strong>. Except trust can't be forced. The attempt always produces the same thing: terror, denunciations, death of those who "don't get it."</p>

<h3>Connection to two buttons</h3>
<p>Blue in the game is uncomfortable: it requires trust, you risk your life. But at least it's <strong>your choice</strong>. You can pick red and no one kills you for it.</p>

<p>Every person clicking blue in the game and thinking "if only we could <em>force</em> everyone to blue" — is at the start of the road to the Great Famine. Uncomfortable, but true.</p>

          <h3>Podstawowa idea</h3>
          <p>Masz dwa przyciski: <strong>czerwony</strong> i <strong>niebieski</strong>. Wyobraź sobie, że każda osoba na Ziemi ma te same dwa przyciski. Zasady:</p>
          <ul>
            <li>Jeśli <strong>ponad 50%</strong> ludzkości wybierze niebieski — wszyscy przeżyją.</li>
            <li>Jeśli <strong>50% lub mniej</strong> wybierze niebieski — wszyscy, którzy wybrali niebieski, giną. Czerwoni żyją.</li>
            <li>Jeśli <strong>wszyscy</strong> wybiorą czerwony — wszyscy przeżyją.</li>
          </ul>
          <p>Czerwony to bezpieczny wybór. Niebieski to akt zaufania do innych ludzi.</p>

          <h3>Twój pierwszy klik jest prawdziwy</h3>
          <p>Twój <strong>pierwszy klik</strong> w czerwony lub niebieski jest zapisywany w globalnym liczniku. Każde urządzenie oddaje maksymalnie jeden głos. Potem możesz klikać dalej — ale te kliknięcia tylko uruchamiają symulację. Mapa świata i statystyki pokazują prawdziwe głosy prawdziwych ludzi.</p>

          <h3>Co odblokowujesz grając</h3>
          <ul>
            <li><strong>16 pytań</strong> — każda gra odkrywa jedno nowe pytanie podważające twój wybór. Osiem podważa czerwony. Osiem podważa niebieski. Ukryte dopóki nie zagrasz.</li>
            <li><strong>Twój profil moralny</strong> — po 5 rundach gra generuje twój archetyp (Kalkulator, Wierzący, Niezdecydowany itd). Zawiera obrazek do udostępnienia.</li>
            <li><strong>Sześć esejów</strong> — odblokowane po odkryciu wszystkich 16 pytań i oddaniu głosu. Filozofia, teoria gier, historia. Około 3 minut każdy.</li>
          </ul>

          <h3>Mapa świata</h3>
          <p>Kliknij <em>"Pokaż mapę świata"</em> w sekcji live, żeby zobaczyć, jak głosują różne kraje. Każda kropka to kraj — kolor pokazuje % niebieskich, rozmiar pokazuje liczbę głosów. Najechanie kursorem (lub dotknięcie na mobilu) pokazuje szczegóły. Pod mapą: rankingi najbardziej kooperatywnych i najbardziej egoistycznych krajów.</p>

          <h3>Twój profil</h3>
          <p>Pasek <em>"Sprawdź siebie"</em> pokazuje postęp odblokowania. Po 5 rundach otrzymasz swój typ moralny z cytatem, statystykami i obrazkiem do pobrania (1200×630 PNG, idealny do social media). Na ekranie wyniku kliknij <em>"Twój profil"</em>, żeby zobaczyć go ponownie.</p>

          <h3>Dźwięk</h3>
          <p>Ikona <strong>♪</strong> u góry przełącza wszystkie dźwięki. Domyślnie włączone. Usłyszysz: krótkie kliknięcia przy wyborze, dramatyczny opadający ton kiedy niebieski ginie, wstępujący akord kiedy niebieski wygrywa. Bez muzyki, bez tła.</p>

          <h3>Języki</h3>

<h3>Wielki Skok Naprzód, Chiny, 1958-1962</h3>
<p>Mao Zedong ogłosił: każda wieś ma stać się komuną, każdy ma pracować dla kolektywu, prywatne pole znika, prywatny piec znika, każdy oddaje swoje rzeczy do wspólnego dobra. To miał być triumf niebieskiego — koordynacja, która wyciągnie Chiny z biedy w ciągu dekady.</p>
<p>Wynik: <strong>15-55 milionów martwych z głodu</strong> (szacunki różnią się). Najgorszy głód w historii ludzkości. Nie z powodu suszy — z powodu polityki. Wieśniacy palili swoje narzędzia, bo zostały zarekwirowane. Dorośli ludzie umierali w polach, bo nikt nie miał motywacji do uprawiania ziemi, której nie był właścicielem.</p>

<h3>Pol Pot i Rok Zero, Kambodża, 1975-1979</h3>
<p>Czerwoni Khmerzy ogłosili: kolektywne społeczeństwo agrarne, wszystko od zera. Miasta zostały opróżnione w 24 godziny — milion ludzi pieszo na wieś. Pieniądze zostały zniesione. Religia zniesiona. Inteligencja zniesiona (dosłownie — kto nosił okulary, ten zginął). Rodzina zniesiona.</p>

    const UUID_V4_REGEX = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

    function generateUuidV4() {
      // Prefer crypto.randomUUID (available in all modern browsers)
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      // Fallback: build a v4 UUID using crypto.getRandomValues
      if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 0x0f) | 0x40; // version 4
        bytes[8] = (bytes[8] & 0x3f) | 0x80; // variant 10
        const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
        return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
      }
      // Last-resort fallback (very unlikely path on modern browsers): non-crypto random
      // This produces a UUID that LOOKS like v4 but isn't cryptographically random.
      // The Worker will accept it as long as it matches the format.
      const r = () => Math.floor(Math.random() * 16).toString(16);
      const make = (n) => Array.from({ length: n }, r).join('');
      return `${make(8)}-${make(4)}-4${make(3)}-${['8','9','a','b'][Math.floor(Math.random()*4)]}${make(3)}-${make(12)}`;
    }

    function getOrCreateVoterId() {
      try {
        let id = localStorage.getItem(VOTER_ID_KEY);
        // Validate stored UUID — if it's malformed (legacy format from earlier versions),
        // regenerate to ensure compatibility with the strict Worker validation.
        if (!id || !UUID_V4_REGEX.test(id)) {
          id = generateUuidV4();
          localStorage.setItem(VOTER_ID_KEY, id);
        }
        return id;
      } catch (e) {
        // localStorage unavailable (private mode in some browsers, etc.)
        // Generate ephemeral UUID — vote won't persist across sessions but at least works once.
        return generateUuidV4();
      }
    }

    // Sanitize and coerce stats response — defensive against unexpected API shape.
    // Numbers are clamped to safe integer range; countries object filtered to valid codes only.
    function sanitizeStats(data) {
      const safeNum = (v) => {
        const n = Number(v);
        if (!Number.isFinite(n) || n < 0 || n > Number.MAX_SAFE_INTEGER) return 0;
        return Math.floor(n);
      };
      const countries = {};
      if (data && data.countries && typeof data.countries === 'object') {
        for (const [code, vals] of Object.entries(data.countries)) {
          // Only accept 2-letter ISO country codes
          if (!/^[A-Z]{2}$/i.test(code)) continue;
          if (!vals || typeof vals !== 'object') continue;
          countries[code.toUpperCase()] = {
            red: safeNum(vals.red),
            blue: safeNum(vals.blue),
            total: safeNum(vals.total),
          };
        }
      }
      return {
        red: safeNum(data && data.red),
        blue: safeNum(data && data.blue),
        total: safeNum(data && data.total),
        countries,
      };
    }

    async function fetchGlobalStats() {
      if (!API_BASE) { apiAvailable = false; renderLiveBanner(); return; }
      try {
        const res = await fetch(API_BASE + '/api/stats?t=' + Date.now(), {
          method: 'GET',
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('Bad response');
        const data = await res.json();
        globalStats = sanitizeStats(data);
        apiAvailable = true;
      } catch (e) {
        apiAvailable = false;
      }
      renderLiveBanner();
    }

    async function recordFirstVote(choice) {
      if (!API_BASE || firstChoice) return;
      try {
        const res = await fetch(API_BASE + '/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voter_id: voterId, choice: choice })
        });
        if (!res.ok) throw new Error('Bad response: ' + res.status);
        const data = await res.json();
        // ONLY persist firstChoice after server confirms
        const confirmedChoice = (data.choice === 'red' || data.choice === 'blue') ? data.choice : choice;
        firstChoice = confirmedChoice;
        try { localStorage.setItem(FIRST_CHOICE_KEY, firstChoice); } catch(e) {}
        if (data.stats) {
          globalStats = sanitizeStats(data.stats);
        }
        apiAvailable = true;
        flashLiveStat(firstChoice);
        renderLiveBanner();
        showLiveStatus(data.already_voted ? t().liveAlreadyVoted : t().liveYourVote, 'success');
      } catch (e) {
        // POST failed — do NOT persist firstChoice locally so user can retry next time
        console.warn('Vote recording failed:', e.message);
        apiAvailable = false;
        showLiveStatus(t().liveOffline, 'warning');
      }
    }

      if (!total) return '—';
      return Math.round((part / total) * 100) + '%';

    function renderProgressBar(bluePct) {
      const txt = t();
      const fill = document.getElementById('progress-fill');
      const labelRight = document.getElementById('progress-label-right');
      const status = document.getElementById('progress-status');

      const safeWidth = Math.max(0, Math.min(100, bluePct));
      fill.style.width = safeWidth + '%';
      labelRight.textContent = bluePct.toFixed(1) + '%';

      // Update color tone based on threshold
      if (bluePct > 50) {
        fill.classList.add('humanity-passing');
        labelRight.style.color = 'var(--success)';
        status.classList.add('passed');
        const over = (bluePct - 50).toFixed(1);
        status.innerHTML = `<div style="font-size: 17px; margin-bottom: 6px;">${txt.progressStatusPassed}</div><div style="font-size: 13px; opacity: 0.85; font-style: italic; font-weight: 400; letter-spacing: 0;">${txt.progressStatusPassedSub(over)}</div>`;
      } else if (bluePct >= 49 && bluePct <= 50) {
        fill.classList.remove('humanity-passing');
        labelRight.style.color = 'var(--warning)';
        status.classList.remove('passed');
        status.innerHTML = txt.progressStatusAt;
      } else {
        fill.classList.remove('humanity-passing');
        labelRight.style.color = 'var(--blue)';
        status.classList.remove('passed');
        const gap = (50 - bluePct).toFixed(1);
        status.innerHTML = txt.progressStatusBelow(gap);
      }
    }

    function colorForBluePct(bluePct) {
      // 0% → red, 50% → neutral grey, 100% → blue
      if (bluePct < 50) {
        const t = bluePct / 50;
        const r = Math.round(200 + (119 - 200) * t);
        const g = Math.round(48 + (119 - 48) * t);
        const b = Math.round(44 + (119 - 44) * t);
        return `rgb(${r},${g},${b})`;
      } else {
        const t = (bluePct - 50) / 50;
        const r = Math.round(119 + (37 - 119) * t);
        const g = Math.round(119 + (99 - 119) * t);
        const b = Math.round(119 + (184 - 119) * t);
        return `rgb(${r},${g},${b})`;
      }
    }

    // Escape HTML for any string we might inject into innerHTML.
    // Currently all data sources are trusted (hardcoded translations + API returning
    // only numbers and 2-letter ISO country codes), but this helper is defensive
    // for any future user-generated or third-party content.
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function onMapHover(e, code) {
      const tooltip = document.getElementById('map-tooltip');
      if (!tooltip) return;
      const txt = t();
      const data = (globalStats.countries || {})[code];
      if (!data) return;
      const bluePct = (data.blue / data.total) * 100;

      // Build tooltip with textContent (no innerHTML — eliminates any XSS surface here)
      tooltip.replaceChildren();
      const nameDiv = document.createElement('div');
      nameDiv.className = 'map-tooltip-name';
      nameDiv.textContent = getCountryName(code);
      const statsDiv = document.createElement('div');
      statsDiv.className = 'map-tooltip-stats';
      statsDiv.textContent = `${txt.mapTooltipVotes(data.total)} · ${Math.round(bluePct)}% ${txt.mapTooltipBlue}`;
      tooltip.appendChild(nameDiv);
      tooltip.appendChild(statsDiv);

      // Position fixed relative to viewport — make tooltip visible first to get its size
      tooltip.classList.add('visible');
      const tooltipRect = tooltip.getBoundingClientRect();

      // Default: tooltip above cursor with 14px gap
      let left = e.clientX - tooltipRect.width / 2;
      let top = e.clientY - tooltipRect.height - 14;

      // Keep within viewport horizontally
      const maxLeft = window.innerWidth - tooltipRect.width - 8;
      if (left < 8) left = 8;
      if (left > maxLeft) left = maxLeft;

      // If above is off-screen, put below cursor
      if (top < 8) top = e.clientY + 18;

      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    }

    function onMapLeave() {
      const tooltip = document.getElementById('map-tooltip');

    // ───────────────────────────────────────────────

    function getArchetype() {
      const txt = t();
      const total = stats.total;
      if (total < 5) return null;
      const bluePct = (stats.blue / total) * 100;

      if (bluePct >= 90) return { key: 'martyr', ...txt.archetypes.martyr };
      if (bluePct >= 65) return { key: 'believer', ...txt.archetypes.believer };
      if (bluePct >= 45 && bluePct <= 55) return { key: 'hesitant', ...txt.archetypes.hesitant };
      if (bluePct >= 35) return { key: 'pragmatist', ...txt.archetypes.pragmatist };
      if (bluePct < 10) return { key: 'calculator', ...txt.archetypes.calculator };
      if (bluePct < 35) return { key: 'pragmatist', ...txt.archetypes.pragmatist };

      // Behavioral check: did they switch sides? If both >0, they "performed"
      if (stats.red > 0 && stats.blue > 0 && total >= 5) {
        const minorityRatio = Math.min(stats.red, stats.blue) / total;
        if (minorityRatio >= 0.2 && minorityRatio <= 0.4) {
          return { key: 'performer', ...txt.archetypes.performer };
        }
      }

      return { key: 'observer', ...txt.archetypes.observer };
    }

    function downloadPersonalityImage(archetypeKey) {
      const archetype = getArchetype();
      if (!archetype) return;
      const txt = t();

      const canvas = document.createElement('canvas');
      const w = 1200;
      const h = 630;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      // Background
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#1a1a1c');
      grad.addColorStop(1, '#0a0a0b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Subtle radial accent
      const radial = ctx.createRadialGradient(w * 0.85, h * 0.2, 0, w * 0.85, h * 0.2, w * 0.5);
      radial.addColorStop(0, 'rgba(212, 184, 150, 0.15)');
      radial.addColorStop(1, 'rgba(212, 184, 150, 0)');
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, w, h);

      // Border
      ctx.strokeStyle = 'rgba(212, 184, 150, 0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(40, 40, w - 80, h - 80);

      // Eyebrow
      ctx.fillStyle = '#95918a';
      ctx.font = '500 18px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(txt.imageEyebrow, 80, 100);

      // Name
      const cleanName = archetype.name.replace(/<\/?em>/g, '');
      ctx.fillStyle = '#ece7dc';
      ctx.font = 'italic 84px "Instrument Serif", "Times New Roman", serif';
      ctx.fillText(cleanName, 80, 200);

      // Tagline
      ctx.fillStyle = '#d4b896';
      ctx.font = 'italic 28px "Instrument Serif", "Times New Roman", serif';
      ctx.fillText('"' + archetype.tagline + '"', 80, 250);

      // Quote (wrapped, prominent) — full archetype.quote already wrapped in quotes
      ctx.fillStyle = '#ece7dc';
      ctx.font = 'italic 24px "Instrument Serif", "Times New Roman", serif';
      const quoteText = archetype.quote;
      const maxQuoteWidth = w - 200;
      const quoteWords = quoteText.split(' ');
      const quoteLines = [];
      let currentLine = '';
      for (const word of quoteWords) {
        const testLine = currentLine ? currentLine + ' ' + word : word;
        if (ctx.measureText(testLine).width > maxQuoteWidth && currentLine) {
          quoteLines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) quoteLines.push(currentLine);
      const quoteStartY = 310;
      quoteLines.forEach((line, i) => {
        ctx.fillText(line, 80, quoteStartY + i * 32);
      });

      // Stats row (shifted down to make room for quote)
      const quoteHeight = quoteLines.length * 32;
      const statY = Math.max(420, quoteStartY + quoteHeight + 40);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(80, statY - 40, w - 160, 100);

      ctx.font = '500 16px "JetBrains Mono", monospace';
      ctx.fillStyle = '#5d5a55';
      ctx.fillText(txt.imageRoundsLabel, 120, statY - 5);
      ctx.fillText(txt.imageRedLabel, 470, statY - 5);
      ctx.fillText(txt.imageBlueLabel, 800, statY - 5);

      ctx.font = '60px "Instrument Serif", "Times New Roman", serif';
      ctx.fillStyle = '#ece7dc';
      ctx.fillText(stats.total.toString(), 120, statY + 45);
      ctx.fillStyle = '#C8302C';
      ctx.fillText(((stats.red / stats.total) * 100).toFixed(0) + '%', 470, statY + 45);
      ctx.fillStyle = '#2563b8';
      ctx.fillText(((stats.blue / stats.total) * 100).toFixed(0) + '%', 800, statY + 45);

      // Footer
      ctx.fillStyle = '#95918a';
      ctx.font = '500 18px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(txt.imageTagline, w / 2, h - 90);
      ctx.fillStyle = '#d4b896';
      ctx.font = '500 24px "JetBrains Mono", monospace';
      ctx.fillText('GAMESTHEORY.ORG', w / 2, h - 60);

      // Trigger download
      const filename = `gamestheory-${archetypeKey}.png`;
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    // HISTOGRAM RAIN — animated dots representing voters
    // ───────────────────────────────────────────────

    let histogramAnimationId = null;
    let histogramDots = [];
    let histogramLastSpawn = 0;
    let histogramVisibilityState = 'visible';

    function spawnDot(canvas) {
      const total = globalStats.total || 1;
      const blueRatio = globalStats.blue / total;
      // Each dot is independently red/blue weighted by current global ratio
      const isBlue = Math.random() < blueRatio;
      const w = canvas.width;
      const h = canvas.height;

      // Spawn from random x at top; bias slightly toward correct side
      const sideBias = isBlue ? (0.5 + Math.random() * 0.5) : (Math.random() * 0.5);
      const x = sideBias * w;

      histogramDots.push({
        x: x,
        y: -4,
        vy: 0.3 + Math.random() * 0.6,
        radius: 1.2 + Math.random() * 0.8,
        color: isBlue ? 'rgba(37, 99, 184, 0.9)' : 'rgba(200, 48, 44, 0.85)',
        isBlue: isBlue,
        opacity: 0.85,
        hasLanded: false
      });

      // Cap to prevent memory bloat — drop oldest
      if (histogramDots.length > 220) {
        histogramDots.splice(0, histogramDots.length - 220);
      }
    }

    function animateHistogram() {
      const canvas = document.getElementById('histogram-rain-canvas');
      if (!canvas) {
        histogramAnimationId = requestAnimationFrame(animateHistogram);
        return;
      }

      // Pause animation when tab is hidden to save battery
      if (histogramVisibilityState === 'hidden') {
        histogramAnimationId = requestAnimationFrame(animateHistogram);
        return;
      }

      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      // Adapt canvas to its actual displayed size for crispness
      const displayWidth = canvas.offsetWidth;
      if (displayWidth && Math.abs(canvas.width - displayWidth) > 4) {
        canvas.width = displayWidth;
      }

      // Faded trail effect — clear with semi-transparent black
      ctx.fillStyle = 'rgba(13, 13, 14, 0.16)';
      ctx.fillRect(0, 0, canvas.width, h);

      // Spawn rate based on volume of activity (slower, more contemplative)
      const now = performance.now();
      const total = globalStats.total || 0;
      const baseSpawnRate = total > 1000 ? 180 : (total > 100 ? 280 : 450); // ms between spawns
      if (now - histogramLastSpawn > baseSpawnRate) {
        spawnDot(canvas);
        histogramLastSpawn = now;
      }

      // Update + draw dots
      histogramDots.forEach((dot, i) => {
        if (dot.hasLanded) {
          // Fading on the bottom
          dot.opacity *= 0.985;
          if (dot.opacity < 0.05) {
            dot.markedForRemoval = true;
            return;
          }
        } else {
          dot.y += dot.vy;
          if (dot.y > h - 4) {
            dot.y = h - 4;
            dot.hasLanded = true;
          }
        }

        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
        const baseColor = dot.color;
        ctx.fillStyle = baseColor.replace(/[\d.]+\)$/, dot.opacity + ')');
        ctx.fill();
      });

      // Cleanup dead dots
      histogramDots = histogramDots.filter(d => !d.markedForRemoval);

      histogramAnimationId = requestAnimationFrame(animateHistogram);
    }

    function startHistogramAnimation() {
      const label = document.getElementById('histogram-rain-label');
      if (label) label.textContent = t().histogramRainLabel;
      if (!histogramAnimationId) {
        animateHistogram();
      }
    }

    const SOUND_ENABLED_KEY = 'gamestheory_sound_enabled';
    let audioContext = null;
    let soundEnabled = false;

    function initSound() {
      try {
        const stored = localStorage.getItem(SOUND_ENABLED_KEY);
        // Default: ON (only OFF if explicitly set to '0')
        soundEnabled = stored !== '0';
      } catch(e) { soundEnabled = true; }
      updateSoundToggle();
    }

    function ensureAudioContext() {
      if (!audioContext) {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) { return null; }
      }
      // Resume if suspended (autoplay policy)
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      try { localStorage.setItem(SOUND_ENABLED_KEY, soundEnabled ? '1' : '0'); } catch(e) {}
      updateSoundToggle();
      if (soundEnabled) {
        // Confirm click
        const ctx = ensureAudioContext();
        if (ctx) playClick('blue', 0.15);
      }
    }

    function updateSoundToggle() {
      const btn = document.getElementById('sound-toggle');
      if (btn) {
        btn.textContent = '♪';
        btn.classList.toggle('muted', !soundEnabled);
        btn.setAttribute('title', soundEnabled
          ? (currentLang === 'pl' ? 'Dźwięk włączony — kliknij aby wyłączyć' : 'Sound on — click to mute')
          : (currentLang === 'pl' ? 'Dźwięk wyłączony — kliknij aby włączyć' : 'Sound off — click to enable')
        );
        btn.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
      }
      // Also localize the help button tooltip
      const helpBtn = document.getElementById('help-toggle');
      if (helpBtn) {
        helpBtn.setAttribute('title', currentLang === 'pl' ? 'Pomoc — jak to działa' : 'Help — how this works');
        helpBtn.setAttribute('aria-label', currentLang === 'pl' ? 'Pomoc' : 'Help');
      }
    }

    // Subtle click — short percussive tone
    function playClick(side, volume = 0.2) {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      // Red: lower, harder. Blue: higher, softer.
      osc.type = 'sine';
      osc.frequency.setValueAtTime(side === 'red' ? 220 : 440, now);
      osc.frequency.exponentialRampToValueAtTime(side === 'red' ? 110 : 330, now + 0.08);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(side === 'red' ? 800 : 1500, now);
      filter.Q.value = 2;

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(volume, now + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    // Death — dramatic low descending fade (when blue dies)
    function playDeath() {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      // Layered low drone with descending pitch
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(110, now);
      osc1.frequency.exponentialRampToValueAtTime(40, now + 1.4);

      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(165, now);  // perfect 5th
      osc2.frequency.exponentialRampToValueAtTime(60, now + 1.4);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(600, now);
      filter.frequency.exponentialRampToValueAtTime(150, now + 1.4);

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.6);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 1.45);
      osc2.stop(now + 1.45);
    }

    // Triumph — ascending major chord (when blue wins)
    function playTriumph() {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      // Three notes in ascending succession (major triad: C E G)
      const notes = [
        { freq: 261.63, start: 0,    dur: 1.4 },
        { freq: 329.63, start: 0.18, dur: 1.2 },
        { freq: 392.00, start: 0.36, dur: 1.0 }
      ];

      notes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = n.freq;
        gain.gain.setValueAtTime(0, now + n.start);
        gain.gain.linearRampToValueAtTime(0.12, now + n.start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + n.start);
        osc.stop(now + n.start + n.dur + 0.02);
      });
    }

    // Heavy result (red wins, blue died) — somber low tone
    function playHeavy() {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 130;  // C3
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.1, now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.95);
    }

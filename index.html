  <style>
    :root {
      --bg: #0d0d0e;
      --surface: #18181b;
      --surface-2: #212125;
      --text: #ece7dc;
      --text-mute: #b8b3a9;
      --text-faint: #847f78;
      --border: rgba(236, 231, 220, 0.12);
      --border-strong: rgba(236, 231, 220, 0.28);
      --red: #d83a36;
      --red-deep: #7a1815;
      --red-text: #f8d6d4;
      --blue: #3a7ad4;
      --blue-deep: #143a72;
      --blue-text: #cce0f7;
      --accent: #e0c8a4;
      --warning: #e0b070;
      --success: #8ec8aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Newsreader', Georgia, serif;
      font-size: 17px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(212, 184, 150, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(37, 99, 184, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.9 0 0 0 0 0.85 0 0 0 0 0.75 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      position: relative;
      z-index: 2;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 64px;
      padding-bottom: 16px;
      border-bottom: 0.5px solid var(--border);
    }

    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-mute);
      text-transform: uppercase;
    }

    .lang-toggle {
      display: flex;
      gap: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .lang-toggle button {
      background: transparent;
      border: 0.5px solid var(--border);
      color: var(--text-mute);
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
    }

    .lang-toggle button:first-child { border-radius: 4px 0 0 4px; }
    .lang-toggle button:not(:first-child) { border-left: none; }
    .lang-toggle button:last-child { border-radius: 0 4px 4px 0; }
    .lang-toggle button:hover { color: var(--text); }
    .lang-toggle button.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .hero { margin-bottom: 56px; }

    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: clamp(56px, 10vw, 96px);
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-sub {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--text-mute);
      max-width: 480px;
      line-height: 1.4;
    }

    .live-banner {
      background: linear-gradient(135deg, rgba(212, 184, 150, 0.06) 0%, rgba(126, 184, 154, 0.04) 100%);
      border: 0.5px solid rgba(212, 184, 150, 0.25);
      border-radius: 8px;
      padding: 22px 24px;
      margin-bottom: 24px;
      position: relative;
    }

    .live-banner-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .live-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7eb89a;
      box-shadow: 0 0 0 0 rgba(126, 184, 154, 0.6);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(126, 184, 154, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(126, 184, 154, 0); }
      100% { box-shadow: 0 0 0 0 rgba(126, 184, 154, 0); }
    }

    .live-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 500;
    }

    .live-explain {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 16px;
      opacity: 0.92;
    }

    .live-explain em {
      font-style: italic;
      color: var(--accent);
      font-weight: 500;
    }

    .live-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .live-stat {
      background: rgba(255,255,255,0.025);
      border-radius: 6px;
      padding: 12px 10px;
      text-align: center;
      border: 0.5px solid rgba(255,255,255,0.04);
      transition: background 0.4s, border-color 0.4s;
    }

    .live-stat.flash {
      background: rgba(212, 184, 150, 0.12);
      border-color: rgba(212, 184, 150, 0.4);
    }

    .live-stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .live-stat-value {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 1;
      transition: color 0.3s;
    }

    .live-stat-value.red { color: var(--red); }
    .live-stat-value.blue { color: var(--blue); }

    .live-stat-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-mute);
      margin-top: 4px;
    }

    .live-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-mute);
      text-align: center;
      margin-top: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      text-transform: uppercase;
    }

    .live-status.visible { opacity: 0.85; }
    .live-status.success { color: var(--success); }
    .live-status.warning { color: var(--warning); }

    .cache-disclaimer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-align: center;
      margin-top: 10px;
      text-transform: uppercase;
      opacity: 0.55;
    }

    /* ─── Progress Bar (Humanity passes the test) ─── */
    .progress-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 0.5px solid rgba(255,255,255,0.06);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-label-left {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-mute);
      text-transform: uppercase;
    }

    .progress-label-right {
      font-family: 'Instrument Serif', serif;
      font-size: 18px;
      color: var(--blue);
      font-weight: 500;
    }

    .progress-track {
      position: relative;
      height: 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      overflow: hidden;
      border: 0.5px solid rgba(255,255,255,0.08);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue) 0%, #4a8fd1 100%);
      border-radius: 6px;
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(37, 99, 184, 0.4);
    }

    .progress-fill.humanity-passing {
      background: linear-gradient(90deg, var(--success) 0%, #5a9a82 100%);
      box-shadow: 0 0 16px rgba(126, 184, 154, 0.6);
      animation: gentle-glow 2.5s ease-in-out infinite;
    }

    @keyframes gentle-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(126, 184, 154, 0.4); }
      50% { box-shadow: 0 0 24px rgba(126, 184, 154, 0.7); }
    }

    .progress-threshold-marker {
      position: absolute;
      left: 50%;
      top: -4px;
      bottom: -4px;
      width: 1px;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 0 6px rgba(255,255,255,0.4);
    }

    .progress-threshold-marker::before {
      content: '';
      position: absolute;
      left: -3px;
      top: -2px;
      width: 7px;
      height: 7px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
    }

    .progress-marker-label {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .progress-status {
      margin-top: 26px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--text-mute);
      text-align: center;
      line-height: 1.5;
    }

    .progress-status.passed {
      color: var(--success);
      font-style: normal;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(126, 184, 154, 0.4);
    }

    .histogram-rain-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 0.5px solid rgba(255,255,255,0.04);
    }

    #histogram-rain-canvas {
      display: block;
      width: 100%;
      height: 36px;
      max-width: 100%;
      opacity: 0.75;
    }

    .histogram-rain-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
      text-align: center;
      margin-top: 8px;
      opacity: 0.6;
    }

    /* ─── Personality / Self-test CTA ─── */
    .self-test-cta {
      background: linear-gradient(135deg, rgba(212, 184, 150, 0.06) 0%, rgba(212, 184, 150, 0.02) 100%);
      border: 0.5px solid rgba(212, 184, 150, 0.18);
      border-radius: 8px;
      padding: 18px 22px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.25s;
    }

    .self-test-cta:hover {
      border-color: rgba(212, 184, 150, 0.4);
      transform: translateY(-1px);
    }

    .self-test-icon {
      font-family: 'Instrument Serif', serif;
      font-size: 28px;
      color: var(--accent);
      line-height: 1;
      flex-shrink: 0;
    }

    .self-test-content {
      flex: 1;
    }

    .self-test-title {
      font-family: 'Instrument Serif', serif;
      font-size: 18px;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .self-test-sub {
      font-size: 13px;
      color: var(--text-mute);
      line-height: 1.4;
    }

    .self-test-arrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--accent);
      opacity: 0.6;
    }

    /* ─── Scenarios CTA banner (intro) ─── */
    /* Distinct from self-test-cta (gold) — uses cool blue tint to grab fresh attention */
    .scenarios-cta {
      background: linear-gradient(135deg, rgba(107, 163, 255, 0.07) 0%, rgba(107, 163, 255, 0.02) 100%);
      border: 0.5px solid rgba(107, 163, 255, 0.22);
      border-radius: 8px;
      padding: 18px 22px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
    }
    .scenarios-cta:hover {
      border-color: rgba(107, 163, 255, 0.45);
      transform: translateY(-1px);
    }
    .scenarios-cta-icon {
      font-family: 'Instrument Serif', serif;
      font-size: 28px;
      color: #6ba3ff;
      line-height: 1;
      flex-shrink: 0;
    }
    .scenarios-cta-content { flex: 1; }
    .scenarios-cta-title {
      font-family: 'Instrument Serif', serif;
      font-size: 18px;
      line-height: 1.3;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .scenarios-cta-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      background: rgba(107, 163, 255, 0.18);
      color: #6ba3ff;
      font-weight: 600;
    }
    .scenarios-cta-sub {
      font-size: 13px;
      color: var(--text-mute);
      line-height: 1.4;
    }
    .scenarios-cta-arrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #6ba3ff;
      opacity: 0.7;
    }

    /* In result screen — slightly more compact variant */
    .result-scenarios-cta {
      margin-top: 20px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ─── Personality Result Card ─── */
    .personality-card {
      background: linear-gradient(135deg, #1a1a1c 0%, #0f0f10 100%);
      border: 0.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 36px 32px;
      margin: 24px 0;
      position: relative;
      overflow: hidden;
    }

    .personality-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 60%;
      height: 200%;
      background: radial-gradient(circle, rgba(212, 184, 150, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .personality-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 12px;
      position: relative;
    }

    .personality-name {
      font-family: 'Instrument Serif', serif;
      font-size: 44px;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .personality-name em {
      font-style: italic;
      color: var(--accent);
    }

    .personality-tagline {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--text-mute);
      line-height: 1.4;
      margin-bottom: 24px;
      position: relative;
    }

    .personality-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
      position: relative;
    }

    .personality-stat {
      text-align: center;
      padding: 12px 8px;
      background: rgba(255,255,255,0.025);
      border-radius: 6px;
    }

    .personality-stat-value {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .personality-stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .personality-description {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      opacity: 0.88;
      margin-bottom: 24px;
      position: relative;
    }

    .personality-quote {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 26px;
      line-height: 1.35;
      color: var(--accent);
      text-align: center;
      margin: 0 0 28px;
      padding: 22px 24px;
      border-top: 0.5px solid rgba(212, 184, 150, 0.2);
      border-bottom: 0.5px solid rgba(212, 184, 150, 0.2);
      letter-spacing: -0.01em;
      position: relative;
      z-index: 1;
    }

    .personality-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
    }

    .btn-primary {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: #e5cba4;
      transform: translateY(-1px);
    }

    .personality-locked {
      text-align: center;
      padding: 30px 24px;
      background: var(--surface);

    }

    .essays-locked-progress {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .essays-skip {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 0.5px solid var(--border);
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .essays-skip-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-mute);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .essays-skip-explain {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-mute);
      margin-bottom: 16px;
      opacity: 0.85;
    }

    .essays-skip-btn {
      background: transparent;
      border: none;
      color: var(--text-faint);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 0;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,0.15);
      text-underline-offset: 4px;
      transition: color 0.2s, text-decoration-color 0.2s;
    }
    .essays-skip-btn:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    .essays-skip-disabled .essays-skip-explain {
      opacity: 0.55;
    }

    /* ─── Scenarios ─── */
    .scenarios-intro {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 32px;
    }

    .scenarios-intro h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 36px;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .scenarios-intro p {
      font-family: 'Newsreader', serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--text-mute);
    }

    .scenarios-progress {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
      text-align: center;
      margin-bottom: 22px;
    }

    .scenarios-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 640px;
      margin: 0 auto;
    }

    .scenario-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 22px 24px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .scenario-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .scenario-card-number {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 32px;
      line-height: 1;
      color: var(--accent);
      opacity: 0.7;
      flex-shrink: 0;
      width: 40px;
    }

    .scenario-card-content {
      flex: 1;
      min-width: 0;
    }

    .scenario-card-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .scenario-card-title {
      font-family: 'Instrument Serif', serif;
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .scenario-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-mute);
    }

    .scenario-card-status-voted {
      color: var(--accent);
    }

    /* ─── Scenario detail ─── */
    .scenario-detail {
      max-width: 620px;
      margin: 0 auto;
    }

    .scenario-detail-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .scenario-detail h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 44px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .scenario-detail-threshold {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--text-mute);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .scenario-context, .scenario-stakes {
      font-family: 'Newsreader', serif;
      font-size: 17px;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 18px;
    }

    .scenario-stakes strong {
      color: var(--accent);
      font-weight: 500;
    }

    .scenario-ask {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
      line-height: 1.4;
      color: var(--text);
      margin: 32px 0 24px;
      text-align: center;
    }

    .scenario-choices {
      display: flex;
      gap: 16px;
      max-width: 520px;
      margin: 0 auto 28px;
    }

    .scenario-choice {
      flex: 1;
      padding: 18px 20px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .scenario-choice:hover {
      border-color: var(--accent);
      background: rgba(255,255,255,0.02);
    }

    .scenario-choice:disabled {
      cursor: default;
    }

    /* Selected (the one user clicked) — gold border, slight bg tint, small checkmark */
    .scenario-choice.selected {
      border-color: var(--accent);
      border-width: 1.5px;
      background: rgba(196, 167, 110, 0.08);
      box-shadow: 0 0 0 1px rgba(196, 167, 110, 0.25);
    }
    .scenario-choice.selected::before {
      content: '✓';
      position: absolute;
      top: 8px;
      right: 12px;
      color: var(--accent);
      font-size: 14px;
      font-family: 'Instrument Serif', serif;
    }

    /* Not-selected (other choice after vote) — dimmed */
    .scenario-choice:disabled:not(.selected) {
      opacity: 0.35;
    }

    .scenario-choice-cooperate { color: #6ba3ff; }
    .scenario-choice-defect { color: #c97070; }

    .scenario-result {
      margin-top: 32px;
      padding: 24px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 8px;
    }

    .scenario-result-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .scenario-result-stats {
      font-family: 'Newsreader', serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 18px;
    }

    .scenario-result-your {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--text-mute);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .scenario-result-interpret {
      font-family: 'Newsreader', serif;
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
      font-style: italic;
      padding-top: 16px;
      border-top: 0.5px solid var(--border);
    }

    .scenario-result-actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Mobile */
    @media (max-width: 640px) {
      .scenario-detail h1 { font-size: 32px; }
      .scenario-ask { font-size: 18px; }
      .scenario-choices { flex-direction: column; gap: 10px; }
      .scenario-context, .scenario-stakes { font-size: 16px; }
    }

    /* ─── Cooperation Signature (completion screen) ─── */
    .signature-card {
      background: linear-gradient(135deg, #1a1a1c 0%, #0f0f10 100%);
      border: 0.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 36px 32px;
      max-width: 640px;
      margin: 0 auto 28px;
    }

    .signature-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 12px;
    }

    .signature-headline {
      font-family: 'Instrument Serif', serif;
      font-size: 40px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 14px;
    }

    .signature-pattern {
      font-family: 'Newsreader', serif;
      font-size: 18px;
      color: var(--text-mute);
      text-align: center;
      margin-bottom: 28px;
    }

    .signature-comparison {
      font-family: 'Newsreader', serif;
      font-size: 19px;
      line-height: 1.5;
      text-align: center;
      color: var(--text);
      padding: 22px 16px;
      border-top: 0.5px solid var(--border);
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 24px;
    }

    .signature-comparison strong {
      color: var(--accent);
      font-weight: 500;
    }

    .signature-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .signature-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .signature-dot.cooperate { background: #6ba3ff; border-color: #6ba3ff; }
    .signature-dot.defect    { background: #c97070; border-color: #c97070; }
    .signature-dot.pending   { background: transparent; border-color: var(--border); border-style: dashed; }

    .signature-dots-legend {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 26px;
    }

    /* Top 3 ranking block */
    .signature-ranking {
      max-width: 640px;
      margin: 0 auto 24px;
    }

    .signature-ranking-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .signature-ranking-sub {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--text-mute);
      margin-bottom: 14px;
    }

    .signature-ranking-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .signature-ranking-item {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 6px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .signature-ranking-name {
      font-family: 'Instrument Serif', serif;
      font-size: 17px;
    }

    .signature-ranking-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-mute);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .signature-ranking-pct {
      font-weight: 600;
      color: var(--accent);
    }
    .signature-ranking-pct.defect { color: #c97070; }
    .signature-ranking-pct.cooperate { color: #6ba3ff; }

    .signature-ranking-empty {
      text-align: center;
      font-style: italic;
      color: var(--text-mute);
      padding: 14px;
      font-family: 'Newsreader', serif;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .signature-headline { font-size: 30px; }
      .signature-comparison { font-size: 17px; }
      .signature-card { padding: 28px 22px; }
    }

    /* ─── Essay Detail ─── */
    .essay-detail {
      max-width: 620px;
      margin: 0 auto;
    }

    .essay-detail-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 14px;
      text-align: center;
    }

    .essay-detail h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 44px;
      line-height: 1.05;
      letter-spacing: -0.015em;
      text-align: center;
      margin-bottom: 12px;
    }

    .essay-detail-meta {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 0.5px solid var(--border);
    }

    .essay-body {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 17px;
      line-height: 1.7;
      color: var(--text);
    }

    .essay-body h3 {
      font-family: 'Instrument Serif', serif;
      font-weight: 500;
      font-size: 24px;
      line-height: 1.2;
      margin: 36px 0 12px;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .essay-body h3:first-child { margin-top: 0; }

    .essay-body p {
      margin-bottom: 16px;
    }

    .essay-body ul {
      margin: 12px 0 16px 22px;
    }

    .essay-body li {
      margin-bottom: 6px;
    }

    .essay-body em {
      color: var(--accent);
      font-style: italic;
      opacity: 0.92;
    }

    .essay-body strong {
      color: var(--text);
      font-weight: 500;
      background: rgba(212, 184, 150, 0.08);
      padding: 0 3px;
      border-radius: 2px;
    }

    .essay-sources {
      margin-top: 48px;
      padding-top: 28px;
      border-top: 0.5px solid var(--border);
    }

    .essay-sources-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-mute);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .essay-sources ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .essay-sources li {
      padding: 6px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .essay-sources a {
      color: var(--text-mute);
      text-decoration: none;
      border-bottom: 0.5px dotted var(--text-faint);
      transition: color 0.15s, border-color 0.15s;
    }

    .essay-sources a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .essay-detail-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .essay-detail-actions .btn {
      flex: 1 1 auto;
      min-width: 140px;
    }

    @media (max-width: 600px) {
      .essay-detail h1 { font-size: 32px; }
      .essay-body { font-size: 16px; }
      .essay-body h3 { font-size: 20px; }
      .essay-card { padding: 18px 18px; gap: 12px; }
      .essay-card-number { font-size: 26px; width: 32px; }
      .essay-card-title { font-size: 18px; }
    }

    .footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 0.5px solid var(--border);
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .footer a { color: var(--text-mute); text-decoration: none; }
    .footer a:hover { color: var(--text); }

    .top-bar-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sound-toggle-top {
      background: transparent;
      border: 0.5px solid var(--border);
      color: var(--text-mute);
      cursor: pointer;
      font-size: 18px;
      width: 32px;
      height: 28px;
      border-radius: 4px;
      padding: 0;
      letter-spacing: 0;
      transition: color 0.15s, transform 0.1s, border-color 0.15s, background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      position: relative;
    }
    .sound-toggle-top:hover {
      color: var(--text);
      border-color: var(--text);
    }
    .sound-toggle-top[aria-pressed="true"] {
      color: var(--accent);
      border-color: rgba(212, 184, 150, 0.4);
      background: rgba(212, 184, 150, 0.06);
    }
    .sound-toggle-top.muted::after {
      content: '';
      position: absolute;
      left: 4px;
      right: 4px;
      top: 50%;
      height: 1.5px;
      background: currentColor;
      transform: rotate(-22deg);
      transform-origin: center;
    }

    /* ─── Cookie / Privacy Banner ─── */
    .cookie-banner {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 560px;
      margin: 0 auto;
      background: rgba(13, 13, 14, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 0.5px solid var(--border-strong);
      border-radius: 10px;
      padding: 18px 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      z-index: 200;
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .cookie-banner-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cookie-banner-text {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text);
      margin: 0;
    }

    .cookie-banner-text a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 0.5px dotted var(--accent);
    }

    .cookie-banner-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cookie-banner-actions .btn,
    .cookie-banner-actions .btn-primary {
      flex: 1 1 auto;
      font-size: 11px;
      padding: 9px 14px;
    }

    /* ─── Privacy Modal ─── */
    .privacy-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 300;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }

    .privacy-modal-content {
      max-width: 600px;
      width: 100%;
      background: var(--bg);
      border: 0.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 36px 32px;
      position: relative;
    }

    .privacy-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: transparent;
      border: none;
      color: var(--text-mute);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      padding: 8px;
      transition: color 0.2s;
    }
    .privacy-close:hover { color: var(--text); }

    .privacy-modal h2 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 32px;
      line-height: 1.1;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .privacy-updated {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .privacy-modal h3 {
      font-family: 'Instrument Serif', serif;
      font-weight: 500;
      font-size: 18px;
      margin: 24px 0 8px;
      color: var(--accent);
    }

    .privacy-modal p {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 12px;
      opacity: 0.9;
    }

    .privacy-modal ul {
      margin: 8px 0 12px 20px;
    }

    .privacy-modal li {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 6px;
      opacity: 0.9;
    }

    .privacy-modal strong {
      color: var(--text);
      font-weight: 500;
    }

    .easter-modal-content {
      background: linear-gradient(135deg, #1a1612 0%, #0a0808 100%);
      border-color: rgba(212, 184, 150, 0.25);
      max-width: 540px;
    }

    .easter-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 14px;
      opacity: 0.85;
    }

    .easter-modal-content h2 {
      font-style: italic;
      color: var(--text);
      margin-bottom: 18px;
    }

    .easter-body {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px !important;
      line-height: 1.55 !important;
      color: var(--text) !important;
      opacity: 0.95 !important;
      padding-left: 16px;
      border-left: 2px solid rgba(212, 184, 150, 0.4);
      margin-left: 4px;
    }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .page { padding: 24px 18px 60px; }

<h3>Kant: blue is the only possible answer</h3>
<p>The categorical imperative goes roughly: <em>"act only according to that maxim by which you can at the same time will that it should become a universal law."</em> When you pick red, you're saying in effect: <em>"I want everyone to save themselves at the cost of risk to others."</em> But if everyone chose that way, the risk would vanish — everyone would survive. Kant would say: <strong>the logic of your choice undoes its own justification</strong>.</p>
<p>Kant's second formulation cuts even deeper: <em>"treat humanity always as an end, never merely as a means."</em> Picking red means treating other people's lives as acceptable losses for your safety. Blue is the only choice in which no one becomes collateral to your calculation.</p>

<h3>Mill: red is rationally correct</h3>
<p>John Stuart Mill, father of utilitarianism, sees it differently. What matters is <strong>aggregate good</strong>. If the probability that more than 50% of humanity will pick blue is low — and every empirical study says it is — then the expected value of blue for you is negative. You lose your life, and your single vote saves no one, because there won't be enough blues anyway.</p>
<p>Mill says: <strong>your individual sacrifice doesn't change the math</strong>. Given that, the rational decision is red — it minimises suffering (yours) and creates no additional good (too few blues either way).</p>

<h3>Where they part</h3>
<p>Kant judges <em>intent</em>. Mill judges <em>consequences</em>. If a blue choice turns out to be a catastrophe (all blues die), Mill says: "you chose wrongly." Kant says: "you chose well, the world failed you."</p>
<p>This distinction isn't academic. Every consequential moral decision in your life — voting, whistleblowing, putting yourself at risk for a stranger — requires a choice: <strong>do I judge myself by intent, or by outcome?</strong></p>

<h3>A third way: virtue</h3>
<p>Aristotle would say both are wrong to try to compress morality into a rule or a formula. The question isn't "what's right in this situation," but "what kind of person do I want to be?" Blue or red — which choice fits the person you're trying to become?</p>

            readTime: 3,
            content: `<p>Thomas Schelling won the Nobel Prize in economics in 2005 for showing that people can coordinate <strong>without communication</strong>. The experiment was simple: two strangers must meet in New York on some day. They can't contact each other. Where do they go, and at what time?</p>
<p>Most answer without hesitation: <strong>Grand Central Station, at noon</strong>. Because it's "obvious." Schelling called this a <em>focal point</em> — a coordination point people converge on by themselves when no other coordination is available.</p>

<h3>Red is the focal point of two buttons</h3>
<p>In our dilemma, red is the <em>dominant strategy</em> in game-theoretic terms — it wins or ties in every possible scenario. But something more important is also true: it's <strong>obvious</strong>. Everyone sees it as safe. Everyone assumes others see it as safe. So everyone picks it — and is right, because everyone else picks it.</p>
<p>The same self-reinforcing belief that "everyone will pick red" produces the reality in which everyone picks red. <strong>Blue requires an assumption no one has grounds to make</strong>: that more than half of unknown people will trust other unknown people.</p>

<h3>Every social movement has been a fight over the focal point</h3>
<p>Think about women's suffrage in the 19th century. The first women voting in New Zealand (1893) didn't change the math — they shifted the focal point. They showed that "women don't vote" wasn't a law of nature, just a default expectation. When the expectation broke, coordination suddenly pushed in the other direction.</p>
<p>The same with LGBT rights, vaccinations, smoking in restaurants, masks in Asia. <strong>Most social change is focal point shifts</strong>, not changes in fundamental morality.</p>

<h3>Why they usually fail</h3>
<p>Schelling also showed focal points are stable. Changing one requires enormous energy and usually coordination from leaders, institutions, media. <strong>A single individual "blue vote" never shifts the focal point</strong> — it can at best be a brick in the foundation of a new one.</p>
<p>This is why heroic individual sacrifice rarely works. The world doesn't need your blue vote as a moral gesture. The world needs a million blue votes <em>simultaneously</em>, ideally with PR and institutional backing. Anything else is romance.</p>

<h3>The brutal conclusion</h3>
<p>So if you pick blue in the real world — in elections, in taxes, on climate — and lose, that <strong>doesn't mean you chose wrongly</strong>. It means the focal point isn't ready yet. Your task is double: pick blue, <em>and</em> work to shift everyone else's expectations. Either alone is insufficient.</p>`,

            readTime: 3,
            content: `<p>The two-button dilemma isn't abstract. It's the structure of every global coordination problem — and you're choosing within it daily, without knowing.</p>

<h3>Climate — country as player</h3>
<p>Germany cuts emissions? Other countries should too. If everyone cuts — everyone wins (climate target met, planet stays habitable). If only Germany cuts — they lose economically, climate changes anyway (because China, US, India picked red).</p>
<p>Each country individually has <strong>incentive to pick red</strong> — protect their economy, wait for others to do the work. Together — everyone loses. That's why the Paris Agreement has such pathetic implementation statistics. Everyone signed, but everyone says "my sacrifices must be proportional to others'," and no one jumps first.</p>

<h3>Vaccines — free riders</h3>
<p>Herd immunity requires roughly 70-95% vaccinated (depending on disease). Once that threshold's hit, <strong>even unvaccinated are protected</strong>, because the virus can't spread. That's blue winning.</p>
<p>But for an individual the logic is different. If 70% of others are vaccinated, I can skip the vaccine and piggyback on their immunity. Less risk (vaccine side effects), same protection. That's red.</p>
<p>When too many people think this way, herd immunity collapses. <strong>Measles returns, having been eradicated by 2000</strong>. Individual red collectively kills its own children.</p>

<h3>Taxes — culture of blue</h3>
<p>Everyone pays taxes honestly? Working state, infrastructure, healthcare, education. Blue victory.</p>
<p>Every individual has incentive to game it — under-report income, hide transactions, route through foreign accounts. Calculation simple: 0% chance of detection × 0% penalty = 0% cost. Pure savings.</p>
<p>Scandinavia works not because Scandinavians are morally superior. It works because <strong>they built a culture of blue</strong> — control systems, social norms, transparency (in Norway anyone can look up your salary and what you paid). Blue there isn't an act of heroism, just the default focal point.</p>

<h3>What this game won't teach you</h3>
<p>Here a single decision is isolated — you click, the result tallies. In real life, <strong>none of these choices are isolated</strong>. Each is built on culture, norms, institutions, trust which either exist or don't.</p>
<p>That's why people who click blue in the abstract still optimise their taxes, still fly, still externalise social costs in real life. Not from hypocrisy — from calculation in an environment where the focal point is red.</p>
<p>Want to change your choice? Change the environment in which you choose first.</p>`,

            title: 'Why Switzerland works',
            eyebrow: 'Institutions · why "strong leader" always loses to procedures',
            readTime: 3,
            content: `<p>Switzerland hasn't had a coup in 175 years. No civil war since 1847. Functions in the middle of Europe, surrounded by four imperial neighbours (historically), with four official languages and six major religions — and nobody finds this remarkable.</p>
<p>It's not an accident. It's the cleanest demonstration that <strong>enforced blue beats voluntary red</strong>.</p>

<h3>What the Swiss did differently</h3>
<p>They have no strong leader. The Federal Council consists of seven people, each rotating into the presidential role for a year. Most Swiss can't name their presidents.</p>
<p>They have referenda for every major change. Citizens vote 4 times a year on specific bills. Canton St. Gallen can have different laws than Geneva.</p>
<p>Their army is a militia. Every man under 30 has a gun at home (seriously). But gun violence is lower than most of Europe. Because <strong>guns aren't the problem</strong> — culture is.</p>

<h3>What this has to do with two buttons</h3>
<p>A situation where everyone <em>has to</em> pick blue — because the system, law, courts, institutions force it — is stable in a way voluntary blue never will be.</p>
<p>Pakistan is full of people who'd individually click blue. But when a general clicks red and seizes power, everyone else loses the choice. Myanmar, Egypt, Congo — these aren't countries where people are morally worse. They're countries where <strong>mechanisms forcing blue are missing</strong>.</p>
<p>Democracy, separation of powers, independent courts, free media — these are technologies that force blue coordination. Without them any single player (general, oligarch, politician) can always click red and destroy everyone else's outcome.</p>

<h3>The "if only we had a good leader" trap</h3>
<p>You still hear the argument: "Poland / USA / Germany / whatever — we need a <em>strong leader</em>, someone who'll really sort things out."</p>
<p>Every such argument is a request for a single player who could click red and force their choice against the system. Sounds attractive when <em>your</em> beliefs are the strong leader — but is catastrophic when the next strong leader is on the opposite side.</p>
<p>Switzerland doesn't need a strong leader. Because the system already forces each person individually toward blue. <strong>It's the only durable cooperation technology humanity has invented</strong>.</p>

<h3>Why it's hard to copy</h3>
<p>Unfortunately. Swiss federalism is the result of 700 years of history, religious war trauma, mountainous geography that made centralisation hard, plus neutrality that spared them both world wars. You can't just import it.</p>
<p>But one thing is learnable: <strong>don't trust anyone who promises a single person will solve your problems</strong>. If the solution requires one strong player, that means the system is weak — and sooner or later that player will be someone you didn't want.</p>`,

            id: 'warsaw-uprising',

            title: 'The Warsaw Uprising and calculation',
            eyebrow: 'History · when blue is the only choice, despite everything',
            readTime: 3,
            content: `<p>August 1st, 1944. Polish Home Army command issues "Operation Tempest" — uprising in Warsaw. 200,000 people facing the German army. The Soviet Red Army stands on the other side of the Vistula river. And waits.</p>
<p>63 days later, Warsaw lies in ruins. 18,000 Home Army soldiers dead, 25,000 wounded, 180,000 civilians dead. The city razed — Germans systematically blew up every building after capitulation.</p>
<p>From a pure utilitarian calculation: <strong>the uprising was a catastrophe</strong>. Mill would say: it shouldn't have started. Too many casualties, too few chances, wrong moment.</p>

<h3>But Mill is wrong here</h3>
<p>Colonel Antoni Chruściel "Monter," uprising commander, knew the statistics. Knew about the Soviets across the river. Knew the Allies wouldn't help effectively. Knew the chances of winning were slim.</p>
<p>He chose blue.</p>
<p>Because the argument for the uprising wasn't utilitarian. The argument was: <strong>"Poland must liberate itself, or it will never really be Polish."</strong> It wasn't a cost-benefit calculation. It was a decision about who we want to be as a nation.</p>

<h3>What's blue here, what's red</h3>
<p>Red in 1944: wait. Let the Soviets liberate. Thousands of Poles will survive, the city will stand. Let someone else pay the price.</p>
<p>Blue: now, despite everything. Without guarantees. Without calculations. Because some things are more important than survival.</p>
<p>The two-button game was inverted here: <strong>the insurgents knew blue would lose</strong>. They picked it anyway. This wasn't a game where "someone has to trust." This was a decision that some values exist for which probability calculations don't matter.</p>

<h3>Why it still hurts</h3>
<p>80 years later, Poles still argue about it. Was the uprising heroism or madness? Did the High Command have moral right to send young people to die? Did it accelerate Warsaw's fall, or — opposite — prove Poland exists?</p>
<p>There's no clean answer. <strong>Because every answer chooses between two moral systems that are fundamentally contradictory</strong>.</p>
<p>Mill: the sacrifices made no sense. They didn't help. Suspending the uprising would have saved 200,000 lives.</p>
<p>Kant: the sacrifices were an act of dignity. They showed the world Poland decides for itself. Without them, Poland would be a country that waited to be liberated by others. Maybe safer, but a different nation.</p>

<h3>Connection to two buttons</h3>
<p>Every person clicking blue in the game who got defeated — stands in the same line as the Warsaw insurgents. The statistics say it was pointless. Mill says it was pointless. But if history is so, then no liberation movement in history was right in its first generation.</p>
<p><strong>Blue in the face of certain defeat isn't a calculation error</strong>. It's a declaration that some values exceed survival. You can call it madness. You can call it sanctity. Hard to hold both at once.</p>
<p>But one thing is sure: a country that never has such people stops existing too — just slower and more quietly.</p>`,

            readTime: 3,
            content: `<p>Blue as a choice looks beautiful in the abstract. Collective action, solidarity, saving everyone. Most leftist political thought is built on the assumption that more coordination = more good.</p>
<p>But 20th century history shows something uncomfortable: <strong>forced blue is often worse than voluntary red</strong>. Sometimes by orders of magnitude.</p>

<h3>The Great Leap Forward, China, 1958-1962</h3>
<p>Mao Zedong proclaimed: every village becomes a commune, everyone works for the collective, private fields disappear, private stoves disappear, everyone gives their things to the common good. This was meant to be blue's triumph — coordination that would lift China out of poverty within a decade.</p>
<p>Result: <strong>15-55 million dead from starvation</strong> (estimates vary). The worst famine in human history. Not from drought — from policy. Peasants burned their tools because they were being requisitioned. Adults died in the fields because nobody had motivation to farm land they didn't own.</p>

<h3>Pol Pot and Year Zero, Cambodia, 1975-1979</h3>
<p>The Khmer Rouge proclaimed: collective agrarian society, everything from scratch. Cities were emptied in 24 hours — millions on foot to the countryside. Money was abolished. Religion abolished. Intelligentsia abolished (literally — those who wore glasses died). Family abolished.</p>
<p>Result in 4 years: <strong>1.5-2 million dead</strong>, out of a population of 8 million. One in four Cambodians. This was meant to be the triumph of equality and the collective.</p>

<h3>Soviet collectivisation, USSR, 1929-1933</h3>
<p>Stalin proclaimed: private farms vanish, everything becomes a kolkhoz. Kulaks (wealthier peasants) — class enemy. Their property confiscated, they themselves exiled or killed.</p>
<p>The Holodomor in Ukraine — <strong>3-7 million dead</strong> in 1932-33. Grain was exported to the West while Ukrainians starved. This was meant to be social progress.</p>

<h3>The pattern repeats</h3>
<p>All three cases share the same structure:</p>
<ul>
<li>Blue is officially mandatory (collective ownership, collective good)</li>
<li>Anyone choosing red (hiding grain, fleeing, keeping tools) is a "traitor of the cause"</li>
<li>The system permits no voluntary blue — only enforced blue</li>
<li>Result: <strong>mass death, far greater than any red world would produce</strong></li>
</ul>

<h3>Why this happens</h3>
<p>Voluntary blue requires trust, which is built slowly. It requires institutions that enforce rules without crushing people. It requires accepting that some won't cooperate — and that's OK.</p>
<p><strong>Forced blue is an attempt to achieve trust's outcome without building trust</strong>. Except trust can't be forced. The attempt always produces the same thing: terror, denunciations, death of those who "don't get it."</p>

<h3>Connection to two buttons</h3>
<p>Blue in the game is uncomfortable: it requires trust, you risk your life. But at least it's <strong>your choice</strong>. You can pick red and no one kills you for it.</p>
<p>Forced blue removes the choice. It sounds like solving the coordination problem ("everyone just <em>has to</em> pick blue!"), but is worse than the problem. It trades statistical risk of death for certain death for those the system deems "insufficiently blue."</p>
<p>Every person clicking blue in the game and thinking "if only we could <em>force</em> everyone to blue" — is at the start of the road to the Great Famine. Uncomfortable, but true.</p>
<p><strong>Trust that can't be voluntarily chosen isn't trust.</strong></p>`,

<h3>Kant: niebieski jest jedyną możliwą odpowiedzią</h3>

<p>John Stuart Mill, ojciec utylitaryzmu, patrzy inaczej. Liczy się <strong>sumaryczne dobro</strong>. Jeśli prawdopodobieństwo, że ponad 50% ludzkości wybierze niebieski jest niskie — a wszystkie badania empiryczne mówią, że jest niskie — to oczekiwana wartość niebieskiego dla ciebie jest ujemna. Tracisz życie, a swoim głosem nikogo nie ratujesz, bo i tak nie wystarczy.</p>

<h3>Co to ma wspólnego z dwoma przyciskami</h3>

<p>Pakistan jest pełen ludzi gotowych klikać niebieski osobiście. Ale kiedy generał klika czerwony i bierze władzę, wszyscy inni tracą wybór. Myanmar, Egipt, Kongo — to nie są kraje gdzie ludzie są moralnie gorsi. To kraje gdzie <strong>brakuje mechanizmów wymuszających niebieski</strong>.</p>
<p>Demokracja, podział władzy, niezależne sądownictwo, wolne media — to wszystko są technologie zmuszające do koordynacji niebieskiego. Bez nich pojedynczy gracz (generał, oligarcha, polityk) zawsze może kliknąć czerwony i zniszczyć wynik wszystkich pozostałych.</p>

<h3>Pułapka "gdyby tylko mieli dobrego przywódcę"</h3>
<p>Wciąż słychać argument: "Polska / USA / Niemcy / cokolwiek — potrzebujemy <em>silnego przywódcy</em>, kogoś kto naprawdę zrobi porządek."</p>
<p>Każdy taki argument jest prośbą o pojedynczego gracza, który mógłby kliknąć czerwony i przeforsować swój wybór wbrew systemu. Brzmi atrakcyjnie, kiedy <em>twoje</em> przekonania są silnym przywódcą — ale jest katastrofą, kiedy następny silny przywódca jest po przeciwnej stronie.</p>
<p>Szwajcaria nie potrzebuje silnego przywódcy. Bo system już zmusza każdego z osobna do niebieskiego. <strong>To jest jedyna trwała technologia kooperacji jaką ludzkość wynalazła</strong>.</p>

<h3>Dlaczego trudno tego skopiować</h3>
<p>Niestety. Federalizm szwajcarski to wynik 700 lat historii, traumy religijnych wojen, geografii górskiej która utrudnia centralizację, oraz neutralności która oszczędziła im obu wojen światowych. Nie da się tego po prostu zaimportować.</p>
<p>Ale można uczyć się jednej rzeczy: <strong>nie ufaj nikomu, kto obiecuje że pojedynczy człowiek rozwiąże twoje problemy</strong>. Jeśli rozwiązanie wymaga jednego silnego gracza, to znaczy że system jest słaby — i prędzej czy później ten gracz okaże się tym, kogo nie chciałeś.</p>`,

<h3>Ale Mill nie ma tu racji</h3>
<p>Pułkownik Antoni Chruściel "Monter", dowódca powstania, znał statystyki. Wiedział o Sowietach po drugiej stronie. Wiedział, że alianci nie pomogą skutecznie. Wiedział, że szans na zwycięstwo jest niewiele.</p>

<h3>Co tu jest niebieskim, co czerwonym</h3>
<p>Czerwony w 1944: poczekać. Niech Sowieci wyzwalają. Tysiące Polaków przeżyje, miasto zostanie. Niech ktoś inny zapłaci cenę.</p>

<h3>Dlaczego to wciąż boli</h3>
<p>80 lat później Polacy nadal się o to kłócą. Czy powstanie było bohaterstwem czy szaleństwem? Czy Komenda Główna miała moralne prawo posłać młodych ludzi na śmierć? Czy przyspieszyło to upadek Warszawy, czy odwrotnie — udowodniło że Polska istnieje?</p>
<p>Nie ma czystej odpowiedzi. <strong>Bo każda odpowiedź wybiera między dwoma systemami moralnymi, które są fundamentalnie sprzeczne</strong>.</p>
<p>Mill: ofiary nie miały sensu. Nie pomogły. Wstrzymanie powstania uratowałoby 200 tysięcy ludzi.</p>
<p>Kant: ofiary były aktem godności. Pokazały światu że Polska sama o sobie decyduje. Bez nich Polska byłaby krajem, który czekał na cudze wyzwolenie. Może bezpieczniejszym, ale innym narodem.</p>

<h3>Wielki Skok Naprzód, Chiny, 1958-1962</h3>
<p>Mao Zedong ogłosił: każda wieś ma stać się komuną, każdy ma pracować dla kolektywu, prywatne pole znika, prywatny piec znika, każdy oddaje swoje rzeczy do wspólnego dobra. To miał być triumf niebieskiego — koordynacja, która wyciągnie Chiny z biedy w ciągu dekady.</p>
<p>Wynik: <strong>15-55 milionów martwych z głodu</strong> (szacunki różnią się). Najgorszy głód w historii ludzkości. Nie z powodu suszy — z powodu polityki. Wieśniacy palili swoje narzędzia, bo zostały zarekwirowane. Dorośli ludzie umierali w polach, bo nikt nie miał motywacji do uprawiania ziemi, której nie był właścicielem.</p>

<h3>Pol Pot i Rok Zero, Kambodża, 1975-1979</h3>
<p>Czerwoni Khmerzy ogłosili: kolektywne społeczeństwo agrarne, wszystko od zera. Miasta zostały opróżnione w 24 godziny — milion ludzi pieszo na wieś. Pieniądze zostały zniesione. Religia zniesiona. Inteligencja zniesiona (dosłownie — kto nosił okulary, ten zginął). Rodzina zniesiona.</p>
<p>Wynik w 4 lata: <strong>1.5-2 miliony martwych</strong>, na populacji 8 milionów. Co czwarty Kambodżanin. To miał być triumf równości i kolektywu.</p>

<h3>Kolektywizacja sowiecka, ZSRR, 1929-1933</h3>
<p>Stalin ogłosił: prywatne gospodarstwa znikają, wszystko staje się kołchozem. Kułacy (zamożniejsi chłopi) — wróg klasowy. Ich majątek skonfiskowany, oni sami zesłani lub zabici.</p>
<p>Wielki Głód na Ukrainie (Hołodomor) — <strong>3-7 milionów martwych</strong> w 1932-33. Zboże eksportowano na Zachód, podczas gdy Ukraińcy umierali. To miał być postęp społeczny.</p>

<h3>Wzór się powtarza</h3>

<li>Każdy kto wybiera czerwony (chowa zboże, ucieka, zatrzymuje narzędzia) jest "zdrajcą sprawy"</li>
<li>System nie pozwala na dobrowolny niebieski — tylko na wymuszony</li>

<h3>Dlaczego to się dzieje</h3>
<p>Dobrowolny niebieski wymaga zaufania, które buduje się powoli. Wymaga instytucji które egzekwują reguły bez tłumienia ludzi. Wymaga zgody na to, że niektórzy nie będą współpracować — i to OK.</p>
<p><strong>Wymuszony niebieski to próba osiągnięcia rezultatu zaufania bez budowania zaufania</strong>. Tylko że zaufanie nie da się wymusić siłą. Próba zawsze produkuje to samo: terror, denuncjacje, śmierć tych którzy "nie rozumieją sprawy".</p>

<h3>Co to ma do dwóch przycisków</h3>
<p>Niebieski w grze jest niewygodny: wymaga zaufania, ryzykujesz życiem. Ale co najmniej jest <strong>twoim wyborem</strong>. Możesz wybrać czerwony i nikt cię nie zabije.</p>
<p>Wymuszony niebieski usuwa wybór. To brzmi jak rozwiązanie problemu koordynacji ("po prostu wszyscy muszą wybrać niebieski!"), ale jest gorsze niż problem. Zamienia statystyczne ryzyko śmierci na pewną śmierć dla tych, których system uzna za "niewystarczająco niebieskich".</p>

          {
            id: 'kant-mill',
            number: 1,
            title: 'Kant contre Mill',
            eyebrow: 'Philosophie · éthique déontologique vs utilitariste',
            readTime: 3,
            content: `<p>Deux des plus grands philosophes moraux du XIXe siècle auraient répondu à ce dilemme de manière complètement opposée. Et tous les deux auraient raison — au sein de leur propre système.</p><h3>Kant : le bleu est la seule réponse possible</h3><p>L'impératif catégorique se résume à peu près ainsi : <em>"agis seulement selon la maxime que tu pourrais en même temps vouloir voir devenir une loi universelle."</em> Quand tu choisis rouge, tu dis en effet : <em>"je veux que tout le monde se sauve au prix du risque pour les autres."</em> Mais si tout le monde choisissait ainsi, le risque disparaîtrait — tout le monde survivrait. Kant dirait : <strong>la logique de ton choix défait sa propre justification</strong>.</p><p>La seconde formulation de Kant est encore plus tranchante : <em>"traite l'humanité toujours comme une fin, jamais simplement comme un moyen."</em> Choisir rouge signifie traiter la vie d'autrui comme une perte acceptable pour ta sécurité. Le bleu est le seul choix dans lequel personne ne devient un dommage collatéral de ton calcul.</p><h3>Mill : le rouge est rationnellement correct</h3><p>John Stuart Mill, père de l'utilitarisme, voit les choses différemment. Ce qui compte est le <strong>bien agrégé</strong>. Si la probabilité que plus de 50% de l'humanité choisisse bleu est faible — et chaque étude empirique le confirme — alors la valeur attendue du bleu pour toi est négative. Tu perds ta vie, et ton vote individuel ne sauve personne, parce qu'il n'y aura pas assez de bleus de toute façon.</p><p>Mill dit : <strong>ton sacrifice individuel ne change pas les maths</strong>. Étant donné cela, la décision rationnelle est rouge — elle minimise la souffrance (la tienne) et ne crée aucun bien supplémentaire (trop peu de bleus dans tous les cas).</p><h3>Où ils divergent</h3><p>Kant juge l'<em>intention</em>. Mill juge les <em>conséquences</em>. Si un choix bleu se révèle catastrophique (tous les bleus meurent), Mill dit : "tu as mal choisi". Kant dit : "tu as bien choisi, le monde t'a manqué."</p><p>Cette distinction n'est pas académique. Chaque décision morale conséquente dans ta vie — voter, dénoncer, te mettre en danger pour un inconnu — exige un choix : <strong>je me juge selon l'intention, ou selon le résultat ?</strong></p><h3>Une troisième voie : la vertu</h3><p>Aristote dirait que les deux ont tort d'essayer de comprimer la moralité en une règle ou une formule. La question n'est pas "qu'est-ce qui est juste dans cette situation," mais "quel genre de personne est-ce que je veux être ?" Bleu ou rouge — quel choix correspond à la personne que tu essaies de devenir ?</p><p>C'est une question à laquelle aucune étude ni simulation ne peut répondre à ta place.</p>`,
            sources: [

              { name: 'Mill — L\'Utilitarisme (1863)', url: 'https://fr.wikipedia.org/wiki/Utilitarisme' },
              { name: 'Stanford Encyclopedia — Deontological Ethics', url: 'https://plato.stanford.edu/entries/ethics-deontological/' }
            ]
          },
          {
            id: 'schelling',
            number: 2,
            title: 'Schelling et le point focal',
            eyebrow: 'Théorie des jeux · pourquoi le rouge est "évident"',
            readTime: 3,
            content: `<p>Thomas Schelling a reçu le Nobel d'économie en 2005 pour avoir montré que les gens peuvent se coordonner <strong>sans communication</strong>. L'expérience était simple : deux inconnus doivent se rencontrer à New York un certain jour. Ils ne peuvent pas se contacter. Où vont-ils, et à quelle heure ?</p><p>La plupart répondent sans hésiter : <strong>Grand Central Station, à midi</strong>. Parce que c'est "évident". Schelling a appelé ça un <em>point focal</em> — un point de coordination vers lequel les gens convergent d'eux-mêmes quand aucune autre coordination n'est disponible.</p><h3>Le rouge est le point focal de deux boutons</h3><p>Dans notre dilemme, le rouge est la <em>stratégie dominante</em> en termes de théorie des jeux — il gagne ou fait match nul dans tous les scénarios possibles. Mais quelque chose de plus important est aussi vrai : il est <strong>évident</strong>. Tout le monde le voit comme sûr. Tout le monde suppose que les autres le voient comme sûr. Donc tout le monde le choisit — et a raison, parce que tous les autres le choisissent.</p><p>La même croyance auto-renforçante que "tout le monde choisira rouge" produit la réalité dans laquelle tout le monde choisit rouge. <strong>Le bleu exige une supposition que personne n'a de raison de faire</strong> : que plus de la moitié des inconnus feront confiance à d'autres inconnus.</p><h3>Chaque mouvement social a été un combat sur le point focal</h3><p>Pense au suffrage des femmes au XIXe siècle. Les premières femmes votant en Nouvelle-Zélande (1893) n'ont pas changé les maths — elles ont déplacé le point focal. Elles ont montré que "les femmes ne votent pas" n'était pas une loi de la nature, juste une attente par défaut. Quand l'attente s'est brisée, la coordination s'est soudain mise à pousser dans l'autre sens.</p><p>Idem pour les droits LGBT, la vaccination, fumer dans les restaurants, les masques en Asie. <strong>La plupart des changements sociaux sont des déplacements de points focaux</strong>, pas des changements de morale fondamentale.</p><h3>Pourquoi ils échouent généralement</h3><p>Schelling a aussi montré que les points focaux sont stables. Les changer exige une énergie énorme et généralement de la coordination de la part des leaders, des institutions, des médias. <strong>Un seul "vote bleu" individuel ne déplace jamais le point focal</strong> — ce peut être au mieux une brique dans la fondation d'un nouveau.</p><p>C'est pourquoi le sacrifice individuel héroïque fonctionne rarement. Le monde n'a pas besoin de ton vote bleu comme geste moral. Le monde a besoin d'un million de votes bleus <em>simultanément</em>, idéalement avec des relations publiques et un soutien institutionnel. Tout le reste est romance.</p><h3>La conclusion brutale</h3><p>Donc si tu choisis bleu dans le monde réel — dans les élections, dans les impôts, sur le climat — et que tu perds, ça <strong>ne signifie pas que tu as mal choisi</strong>. Ça signifie que le point focal n'est pas encore prêt. Ta tâche est double : choisir bleu, <em>et</em> travailler à déplacer les attentes des autres. L'un seul ne suffit pas.</p>`,
            sources: [
              { name: 'Schelling — La stratégie du conflit (1960)', url: 'https://fr.wikipedia.org/wiki/Thomas_Schelling' },
              { name: 'Point focal (Schelling) — Wikipedia', url: 'https://en.wikipedia.org/wiki/Focal_point_(game_theory)' },
              { name: 'Prix Nobel 2005', url: 'https://www.nobelprize.org/prizes/economic-sciences/2005/summary/' }
            ]

          {
            id: 'climate-vaccines-taxes',
            number: 3,
            title: 'Climat, vaccins, impôts',
            eyebrow: 'Politique · ton choix revient, chaque jour',
            readTime: 3,
            content: `<p>Le dilemme des deux boutons n'est pas abstrait. C'est la structure exacte de chaque problème de coordination globale — et tu y choisis quotidiennement, sans le savoir.</p><h3>Climat — pays comme joueur</h3><p>La France réduit ses émissions ? Les autres pays devraient aussi. Si tout le monde réduit — tout le monde gagne (objectif climatique atteint, planète habitable). Si seule la France réduit — elle perd économiquement, le climat change quand même (parce que la Chine, les USA, l'Inde ont choisi rouge).</p><p>Chaque pays individuellement a <strong>un intérêt à choisir rouge</strong> — protéger son économie, attendre que les autres fassent le travail. Ensemble — tout le monde perd. C'est pourquoi l'Accord de Paris a des statistiques de mise en œuvre aussi pathétiques. Tout le monde a signé, mais tout le monde dit "mes sacrifices doivent être proportionnels à ceux des autres," et personne ne saute le premier.</p><h3>Vaccins — passagers clandestins</h3><p>L'immunité collective exige environ 70-95% de vaccinés (selon la maladie). Une fois ce seuil atteint, <strong>même les non-vaccinés sont protégés</strong>, parce que le virus ne peut pas se propager. C'est le bleu qui gagne.</p><p>Mais pour un individu, la logique est différente. Si 70% des autres sont vaccinés, je peux sauter le vaccin et profiter de leur immunité. Moins de risque (effets secondaires du vaccin), même protection. C'est le rouge.</p><p>Quand trop de gens pensent ainsi, l'immunité collective s'effondre. <strong>La rougeole revient, ayant été éradiquée en 2000</strong>. Le rouge individuel tue collectivement ses propres enfants.</p><h3>Impôts — culture du bleu</h3><p>Tout le monde paie ses impôts honnêtement ? On a un État qui fonctionne, des infrastructures, la santé, l'éducation. Victoire bleue.</p><p>Chaque individu a intérêt à truander — sous-déclarer ses revenus, cacher des transactions, faire passer par des comptes étrangers. Calcul simple : 0% de chance de détection × 0% de pénalité = 0% de coût. Pure économie.</p><p>La Scandinavie fonctionne non pas parce que les Scandinaves sont moralement supérieurs. Elle fonctionne parce qu'<strong>ils ont construit une culture du bleu</strong> — systèmes de contrôle, normes sociales, transparence. Le bleu là-bas n'est pas un acte d'héroïsme, juste le point focal par défaut.</p><h3>Ce que ce jeu ne t'apprendra pas</h3><p>Ici une seule décision est isolée. Dans la vraie vie, <strong>aucun de ces choix n'est isolé</strong>. Chacun est construit sur la culture, les normes, les institutions, la confiance qui existent ou non.</p><p>Tu veux changer ton choix ? Change d'abord l'environnement dans lequel tu choisis.</p>`,

              { name: 'Fehr & Gächter (2000)', url: 'https://www.nature.com/articles/415137a' }
            ]

          {

            title: 'Pourquoi la Suisse fonctionne',
            eyebrow: 'Institutions · pourquoi le "leader fort" perd toujours contre les procédures',
            readTime: 3,
            content: `<p>La Suisse n'a pas eu de coup d'État depuis 175 ans. Pas de guerre civile depuis 1847. Elle fonctionne au milieu de l'Europe, entourée de quatre voisins impériaux (historiquement), avec quatre langues officielles et six religions principales — et personne ne trouve ça remarquable.</p><p>Ce n'est pas un accident. C'est la démonstration la plus pure que <strong>le bleu imposé bat le rouge volontaire</strong>.</p><h3>Ce que les Suisses ont fait différemment</h3><p>Ils n'ont pas de leader fort. Le Conseil fédéral est composé de sept personnes, chacune assumant le rôle présidentiel à tour de rôle pour un an. La plupart des Suisses ne peuvent pas nommer leurs présidents.</p><p>Ils ont des référendums pour chaque changement majeur. Les citoyens votent 4 fois par an sur des projets de loi spécifiques. Le canton de Saint-Gall peut avoir des lois différentes de Genève.</p><p>Leur armée est une milice. Chaque homme de moins de 30 ans a une arme à la maison (sérieusement). Mais la violence par armes à feu est plus faible qu'en grande partie de l'Europe. Parce que <strong>les armes ne sont pas le problème</strong> — la culture l'est.</p><h3>Ce que ça a à voir avec deux boutons</h3><p>Une situation où chacun <em>doit</em> choisir bleu — parce que le système, la loi, les tribunaux, les institutions le forcent — est stable d'une manière dont le bleu volontaire ne le sera jamais.</p><p>Démocratie, séparation des pouvoirs, justice indépendante, médias libres — ce sont toutes des technologies qui forcent la coordination bleue. Sans elles, n'importe quel joueur unique (général, oligarque, politicien) peut toujours cliquer rouge et détruire le résultat de tout le monde.</p><h3>Le piège du "si seulement on avait un bon leader"</h3><p>On entend encore l'argument : "On a besoin d'un <em>leader fort</em>, quelqu'un qui mettra vraiment de l'ordre."</p><p>Chaque tel argument est une demande pour un seul joueur qui pourrait cliquer rouge et imposer son choix contre le système. Ça paraît attractif quand <em>tes</em> convictions sont le leader fort — mais c'est catastrophique quand le prochain leader fort est de l'autre côté.</p><p>La Suisse n'a pas besoin d'un leader fort. Parce que le système force déjà chaque personne individuellement vers le bleu. <strong>C'est la seule technologie de coopération durable que l'humanité ait inventée</strong>.</p>`,

            readTime: 3,
            content: `<p>1er août 1944. Le commandement de l'Armée de l'Intérieur polonaise lance "Opération Tempête" — insurrection à Varsovie. 200 000 personnes face à l'armée allemande. L'Armée rouge soviétique est de l'autre côté de la Vistule. Et attend.</p><p>63 jours plus tard, Varsovie gît en ruines. 18 000 soldats de l'Armée de l'Intérieur morts, 25 000 blessés, 180 000 civils morts. La ville rasée — les Allemands ont systématiquement fait sauter chaque bâtiment après la capitulation.</p><p>D'un point de vue purement utilitariste : <strong>l'insurrection a été une catastrophe</strong>. Mill dirait : ça n'aurait pas dû commencer.</p><h3>Mais Mill a tort ici</h3><p>Le commandant de l'insurrection connaissait les statistiques. Il savait que les chances de victoire étaient minces. Il a choisi bleu.</p><p>Parce que l'argument pour l'insurrection n'était pas utilitariste. L'argument était : <strong>"La Pologne doit se libérer elle-même, ou elle ne sera jamais vraiment polonaise."</strong> Ce n'était pas un calcul coût-bénéfice. C'était une décision sur qui nous voulons être en tant que nation.</p><h3>Lien avec deux boutons</h3><p>Chaque personne cliquant bleu dans le jeu et qui a perdu — se tient dans la même file que les insurgés de Varsovie. Les statistiques disent que c'était inutile. Mais si l'histoire est ainsi, alors aucun mouvement de libération n'avait raison dans sa première génération.</p><p><strong>Le bleu face à la défaite certaine n'est pas une erreur de calcul</strong>. C'est une déclaration que certaines valeurs dépassent la survie. Tu peux appeler ça de la folie. Tu peux appeler ça de la sainteté. Difficile de tenir les deux à la fois.</p><p>Mais une chose est sûre : un pays qui n'a jamais de telles personnes cesse aussi d'exister — juste plus lentement et plus silencieusement.</p>`,

            content: `<p>Le bleu comme choix paraît beau dans l'abstrait. Action collective, solidarité, sauver tout le monde. La majeure partie de la pensée politique de gauche est construite sur l'hypothèse que plus de coordination = plus de bien.</p><p>Mais l'histoire du XXe siècle montre quelque chose d'inconfortable : <strong>le bleu imposé est souvent pire que le rouge volontaire</strong>. Parfois de plusieurs ordres de grandeur.</p><h3>Le Grand Bond en avant, Chine, 1958-1962</h3><p>Mao Zedong proclamait : chaque village devient une commune, tout le monde travaille pour le collectif, les champs privés disparaissent. Cela devait être le triomphe du bleu — coordination qui sortirait la Chine de la pauvreté en une décennie.</p><p>Résultat : <strong>15-55 millions de morts par famine</strong>. La pire famine de l'histoire humaine. Pas à cause de la sécheresse — à cause de la politique.</p><h3>Pol Pot et l'Année zéro, Cambodge, 1975-1979</h3><p>Les Khmers rouges proclamaient : société agraire collective, tout depuis zéro. Résultat en 4 ans : <strong>1,5-2 millions de morts</strong>, sur une population de 8 millions.</p><h3>Collectivisation soviétique, URSS, 1929-1933</h3><p>Staline proclamait : les fermes privées disparaissent. L'Holodomor en Ukraine — <strong>3-7 millions de morts</strong> en 1932-33.</p><h3>Le schéma se répète</h3><p>Les trois cas partagent la même structure : le bleu est officiellement obligatoire, quiconque choisit rouge est un "traître," le système n'autorise aucun bleu volontaire — seulement le bleu imposé. Résultat : <strong>mort de masse, bien plus grande que tout monde rouge ne produirait</strong>.</p><h3>Pourquoi ça arrive</h3><p>Le bleu volontaire exige de la confiance, qui se construit lentement. <strong>Le bleu imposé est une tentative d'atteindre le résultat de la confiance sans construire la confiance</strong>. Sauf que la confiance ne peut pas être imposée.</p><h3>Lien avec deux boutons</h3><p>Le bleu dans le jeu est inconfortable : il exige de la confiance, tu risques ta vie. Mais au moins c'est <strong>ton choix</strong>. Tu peux choisir rouge et personne ne te tue pour ça.</p><p>Chaque personne cliquant bleu dans le jeu et pensant "si seulement on pouvait <em>forcer</em> tout le monde au bleu" — est au début du chemin vers la Grande Famine. Inconfortable, mais vrai.</p><p><strong>La confiance qu'on ne peut pas choisir volontairement n'est pas de la confiance.</strong></p>`,

            ]
          }

        // Defensive: keep only valid string values
        const clean = {};
        for (const [k, v] of Object.entries(parsed || {})) {
          if (typeof v === 'string' && (v === 'cooperate' || v === 'defect')) {
            clean[k] = v;
          }
        }
        scenarioVotes = clean;
      } catch (e) {
        scenarioVotes = {};
      }
    }

    function saveScenarioVote(scenarioId, choice) {
      scenarioVotes[scenarioId] = choice;
      try {

  <style>
    :root {
      --bg: #0d0d0e;
      --surface: #18181b;
      --surface-2: #212125;
      --text: #ece7dc;
      --text-mute: #b8b3a9;
      --text-faint: #847f78;
      --border: rgba(236, 231, 220, 0.12);
      --border-strong: rgba(236, 231, 220, 0.28);
      --red: #d83a36;
      --red-deep: #7a1815;
      --red-text: #f8d6d4;
      --blue: #3a7ad4;
      --blue-deep: #143a72;
      --blue-text: #cce0f7;
      --accent: #e0c8a4;
      --warning: #e0b070;
      --success: #8ec8aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Newsreader', Georgia, serif;
      font-size: 17px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:

        radial-gradient(circle at 80% 70%, rgba(37, 99, 184, 0.03) 0%, transparent 50%);

      z-index: 0;

    body::after {

      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 1;
      opacity: 0.6;

      margin: 0 auto;
      padding: 40px 24px 80px;
      position: relative;
      z-index: 2;
    }

    .top-bar {

      justify-content: space-between;
      align-items: center;
      margin-bottom: 64px;
      padding-bottom: 16px;
      border-bottom: 0.5px solid var(--border);

    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-mute);
      text-transform: uppercase;
    }

    .lang-toggle {
      display: flex;
      gap: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .lang-toggle button {
      background: transparent;
      border: 0.5px solid var(--border);
      color: var(--text-mute);
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
    }

    .lang-toggle button:first-child { border-radius: 4px 0 0 4px; }
    .lang-toggle button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
    .lang-toggle button:hover { color: var(--text); }
    .lang-toggle button.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .hero { margin-bottom: 56px; }

    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-faint);
      text-transform: uppercase;

    .live-explain em {
      font-style: italic;
      color: var(--accent);
      font-weight: 500;
    }

    .live-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .live-stat {
      background: rgba(255,255,255,0.025);
      border-radius: 6px;
      padding: 12px 10px;
      text-align: center;
      border: 0.5px solid rgba(255,255,255,0.04);

    }

    .rules {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 24px 28px;
      margin-bottom: 40px;
    }

    .rules-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;

      line-height: 1.65;
      color: var(--text);
      margin-bottom: 6px;
    }

    .rules p:last-child { margin-bottom: 0; }

    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .choice-btn {
      height: 180px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 32px;
      letter-spacing: -0.01em;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .choice-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%);
      pointer-events: none;
    }

    .choice-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }

    .choice-btn:active { transform: translateY(0); }

    .choice-red {
      background: var(--red);
      color: var(--red-text);
      border: 0.5px solid var(--red-deep);
    }

    .choice-blue {
      background: var(--blue);
      color: var(--blue-text);
      border: 0.5px solid var(--blue-deep);
    }

      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;

      text-transform: uppercase;
      margin-top: 12px;
      margin-bottom: 8px;
    }

      text-align: center;
      font-style: italic;
      font-size: 14px;
      color: var(--text-mute);
      margin-bottom: 24px;
    }

    .secondary-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background: transparent;
      border: 0.5px solid var(--border-strong);
      color: var(--text-mute);
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      border-color: var(--text);

    .screen { animation: fadeIn 0.6s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }

      border-radius: 12px;

      animation: fadeIn 0.8s ease;
    }

      font-weight: 400;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 12px;

    .result-sub {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 32px;
      opacity: 0.92;
    }

    .histogram {
      margin: 32px 0;
      position: relative;
    }

      display: flex;
      height: 28px;
      border-radius: 4px;
      overflow: hidden;
      border: 0.5px solid rgba(255,255,255,0.12);

    .histogram-red { background: var(--red); height: 100%; transition: width 1.2s ease-out; }

    .histogram-threshold {
      position: absolute;
      left: 50%;
      top: -6px;
      bottom: -6px;
      width: 1px;
      border-left: 1px dashed rgba(255,255,255,0.45);
    }

    .histogram-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
      margin-top: 10px;

    .questions-section { margin-bottom: 32px; }

    .questions-section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-mute);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .question-card {
      background: var(--surface);
      border-radius: 6px;
      padding: 16px 18px;
      margin-bottom: 8px;
      border-left: 2px solid;
    }

    .question-card.unlocked-blue { border-left-color: var(--blue); }
    .question-card.unlocked-red { border-left-color: var(--red); }
    .question-card.locked { border-left-color: var(--border-strong); opacity: 0.4; }

    .question-card-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .question-card.unlocked-blue .question-card-label { color: var(--blue-text); }
    .question-card.unlocked-red .question-card-label { color: var(--red-text); }
    .question-card.locked .question-card-label { color: var(--text-faint); }

    .question-card-text {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      line-height: 1.4;
    }

    .question-card.locked .question-card-text {
      color: var(--text-faint);
      font-style: italic;
      font-size: 13px;
      font-family: 'Newsreader', serif;
    }

    .footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 0.5px solid var(--border);
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .footer a { color: var(--text-mute); text-decoration: none; }
    .footer a:hover { color: var(--text); }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .page { padding: 24px 18px 60px; }
      .top-bar { margin-bottom: 40px; }
      h1 { font-size: 56px; }
      .hero-sub { font-size: 18px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }

      .result-title { font-size: 40px; }
      .new-question-text { font-size: 18px; }
      .panel-title { font-size: 32px; }
    }
  </style>
</head>

          { label: 'W historii (Holokaust, okupowana Europa)', headline: 'Znacznie poniżej 1% populacji aktywnie ratowało Żydów', detail: 'Oliner & Oliner (1988). Kiedy stawka to realne ryzyko śmierci, procent ludzi gotowych do poświęcenia jest mikroskopijny.' },
          { label: 'W rzeczywistości (compliance z maskami COVID)', headline: 'Japonia ~85% / Niemcy ~65% / USA ~50%', detail: 'Ten sam dylemat, ten sam wirus, różne wyniki (deklaracje samodzielne, zmieniały się w czasie). Kooperacja zależy od kultury i zaufania do instytucji.' },
          { label: 'W ekonomii (gra dóbr publicznych)', headline: 'Kooperacja: ~50% → ~10% po 10 rundach', detail: 'Fehr & Gächter (2000). Bez karania pasażerów na gapę kooperacja zanika z frustracji, nie z chciwości.' }
        ],
        mainPatternHeadline: 'Im bardziej realne ryzyko — tym mniej kooperacji.',
        mainPatternDetail: '70% w ankiecie. ~47% w laboratorium. Znacznie poniżej 1% w okupowanej Europie. Hipotetyczna moralność i realne wybory to dwa różne systemy. Kiedy wybierasz niebieski w grze, jesteś w pierwszym. Kiedy stawka byłaby prawdziwa, większość ludzi przeskakuje do drugiego.',

        questionsBlue: [
          'Gdybyś naprawdę ufał ludzkości, ryzyko byłoby zerowe. Twoje ręce się trzęsły, kiedy klikałeś?',
          'Powstańcy Warszawscy też "wybierali niebieski". Tylko że oni wiedzieli, kogo ratują. Ty wybierasz dla anonimowych miliardów. To samo, czy zupełnie co innego?',
          'Niebieski to wybór solidarności — czy performans moralny przed samym sobą? Nikt się nie dowie, jak wybrałeś. Więc dla kogo wybierasz?',

          'Gdyby 99% ludzkości wybrało czerwony, twoja śmierć w niebieskim nikogo by nie uratowała. Wybrałbyś tak samo, wiedząc to z góry?',
          'Rzeczywista historia: znacznie poniżej 1% ludzi w okupowanej Europie aktywnie ukrywało Żydów, ryzykując życie. Ty właśnie kliknąłeś niebieski. Jesteś w tym ułamku, czy klikasz inaczej, kiedy nie ma kosztu?',
          'Wybierasz niebieski wbrew własnym podejrzeniom o naturę ludzką. Bo gdybyś naprawdę wierzył w kolektyw, nie potrzebowałbyś go ciągle naprawiać.'
        ],
        questionsRed: [
          'Logika idealna. Ale wyobraź sobie scenariusz, w którym milion niebieskich właśnie zginęło, a ty żyjesz dzięki swojemu egoizmowi. Co wtedy czujesz?',
          'Czerwony to wybór racjonalnego egoizmu. Czy jesteś gotów tak nazywać siebie, patrząc w lustro?',
          'Jeśli każdy wybierze czerwony, wszyscy żyją. Ale ktoś musi pierwszy zaufać. Czy jesteś tym kimś, czy tym, kto czeka aż ktoś inny zaryzykuje?',
          'Powstańcy Warszawscy wybrali niebieski. Sprawiedliwi wśród Narodów Świata wybrali niebieski. Czy jesteś dumny, że wybrałeś inaczej niż oni?',
          'Czerwony to gwarancja przeżycia. Niebieski to akt wiary. Czy w twoim życiu są w ogóle momenty, w których wybrałeś wiarę nad gwarancję?',
          'Mówisz że "naród to wspólnota losu". Ale czerwony oddziela twój los od losu innych. Czy nadal czujesz się częścią wspólnoty?',
          'Możliwa konsekwencja czerwonego: żyjesz wiedząc, że ludzkość zawiodła test. Jeśli to się wydarza — to zwycięstwo, czy potwierdzenie najgorszych podejrzeń o sobie i innych?',
          'Gdybyś wiedział, że twoje dziecko wybrało niebieski — a ty czerwony — co byś czuł?'
        ]
      }
    };

    let currentLang = 'en';
    const stats = { total: 0, red: 0, blue: 0 };
    const unlockedBlue = [];
    const unlockedRed = [];

    // ───────────────────────────────────────────────
    // GLOBAL VOTE TRACKING (real worldwide stats)
    // ───────────────────────────────────────────────
    // Replace API_BASE with your deployed Cloudflare Worker URL.
    // Leave empty string '' to disable global stats (game still works).
    const API_BASE = 'https://two-buttons-stats.hkacper111.workers.dev';

    const VOTER_ID_KEY = 'gamestheory_voter_id';
    const FIRST_CHOICE_KEY = 'gamestheory_first_choice';

    let voterId = null;
    let firstChoice = null;
    let globalStats = { red: 0, blue: 0, total: 0 };
    let apiAvailable = true;

    function getOrCreateVoterId() {
      try {
        let id = localStorage.getItem(VOTER_ID_KEY);
        if (!id) {
          id = (crypto.randomUUID && crypto.randomUUID()) ||
            ('v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 12));
          localStorage.setItem(VOTER_ID_KEY, id);
        }
        return id;
      } catch (e) {
        return 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 12);
      }
    }

    async function fetchGlobalStats() {
      if (!API_BASE) { apiAvailable = false; renderLiveBanner(); return; }
      try {
        const res = await fetch(API_BASE + '/api/stats', { method: 'GET' });
        if (!res.ok) throw new Error('Bad response');
        globalStats = await res.json();
        apiAvailable = true;
      } catch (e) {
        apiAvailable = false;
      }
      renderLiveBanner();
    }

    async function recordFirstVote(choice) {
      if (!API_BASE || firstChoice) return;
      try {
        const res = await fetch(API_BASE + '/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voter_id: voterId, choice: choice })
        });
        if (!res.ok) throw new Error('Bad response');
        const data = await res.json();
        firstChoice = data.choice || choice;
        try { localStorage.setItem(FIRST_CHOICE_KEY, firstChoice); } catch(e) {}
        if (data.stats) globalStats = data.stats;
        apiAvailable = true;
        flashLiveStat(firstChoice);
        showLiveStatus(data.already_voted ? t().liveAlreadyVoted : t().liveYourVote, 'success');
      } catch (e) {
        apiAvailable = false;
        renderLiveBanner();
      }
    }

    function flashLiveStat(choice) {
      const el = document.getElementById('live-stat-' + choice);
      if (!el) return;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1500);
    }

    function showLiveStatus(text, kind) {
      const el = document.getElementById('live-status');
      if (!el) return;
      el.textContent = text;
      el.className = 'live-status visible' + (kind ? ' ' + kind : '');
      setTimeout(() => { el.classList.remove('visible'); }, 4000);
    }

    function fmtNum(n) {
      return (n || 0).toLocaleString(currentLang === 'pl' ? 'pl-PL' : 'en-US');
    }

    function pct(part, total) {
      if (!total) return '—';
      return Math.round((part / total) * 100) + '%';
    }

    function renderLiveBanner() {
      const txt = t();
      document.getElementById('live-label').textContent = txt.liveLabel;
      document.getElementById('live-explain').innerHTML = txt.liveExplain;
      document.getElementById('live-total-label').textContent = txt.liveTotalLabel;
      document.getElementById('live-red-label').textContent = txt.liveRedLabel;
      document.getElementById('live-blue-label').textContent = txt.liveBlueLabel;

      if (!apiAvailable && globalStats.total === 0) {
        document.getElementById('live-total-value').textContent = '—';
        document.getElementById('live-red-value').textContent = '—';
        document.getElementById('live-blue-value').textContent = '—';
        document.getElementById('live-red-pct').textContent = '';
        document.getElementById('live-blue-pct').textContent = '';
        showLiveStatus(txt.liveOffline, 'warning');
        return;
      }

      document.getElementById('live-total-value').textContent = fmtNum(globalStats.total);
      document.getElementById('live-red-value').textContent = fmtNum(globalStats.red);
      document.getElementById('live-blue-value').textContent = fmtNum(globalStats.blue);
      document.getElementById('live-red-pct').textContent = pct(globalStats.red, globalStats.total);
      document.getElementById('live-blue-pct').textContent = pct(globalStats.blue, globalStats.total);
    }

    // ───────────────────────────────────────────────

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      document.getElementById('lang-pl').classList.toggle('active', lang === 'pl');
      renderIntro();
      renderLiveBanner();
      updateStats();
    }

    function t() { return T[currentLang]; }

    function renderIntro() {
      const txt = t();
      document.getElementById('brand').textContent = txt.brand;
      document.getElementById('hero-eyebrow').textContent = txt.eyebrow;
      document.getElementById('hero-title').innerHTML = txt.title;
      document.getElementById('hero-sub').textContent = txt.sub;
      document.getElementById('rules-label').textContent = txt.rulesLabel;
      document.getElementById('rule-1').textContent = txt.rule1;
      document.getElementById('rule-2').textContent = txt.rule2;
      document.getElementById('rule-3').textContent = txt.rule3;
      document.getElementById('btn-red').textContent = txt.red;
      document.getElementById('btn-blue').textContent = txt.blue;
      document.getElementById('privacy-note').textContent = txt.privacyNote;
      document.getElementById('hint').textContent = txt.hint;
      document.getElementById('btn-research').textContent = txt.btnResearch;
      document.getElementById('btn-questions').textContent = txt.btnQuestions;
      document.getElementById('footer-text').textContent = txt.footerText;

      // SEO: update document title + meta tags per language
      const pageTitle = currentLang === 'en'
        ? 'Two Buttons — A test of who you become when no one is watching'
        : 'Dwa przyciski — test tego, kim się stajesz, kiedy nikt nie patrzy';
      const pageDesc = currentLang === 'en'
        ? 'An interactive moral dilemma game based on game theory and behavioral research. Choose red or blue. 16 questions that challenge whoever you think you are.'
        : 'Interaktywna gra dylematu moralnego oparta na teorii gier i badaniach behawioralnych. Wybierz czerwony albo niebieski. 16 pytań, które kwestionują to, kim myślisz że jesteś.';
      document.title = pageTitle;
      const setMeta = (sel, content) => {
        const el = document.querySelector(sel);
        if (el) el.setAttribute('content', content);
      };
      setMeta('meta[name="description"]', pageDesc);
      setMeta('meta[property="og:title"]', pageTitle);
      setMeta('meta[property="og:description"]', pageDesc);
      setMeta('meta[property="og:locale"]', currentLang === 'en' ? 'en_US' : 'pl_PL');
      setMeta('meta[name="twitter:title"]', pageTitle);
      setMeta('meta[name="twitter:description"]', pageDesc);
    }

    function updateStats() {
      const txt = t();
      document.getElementById('stats-label').textContent = txt.statsLabel;
      document.getElementById('stat-label-total').textContent = txt.statTotal;
      document.getElementById('stat-label-red').textContent = txt.statRed;
      document.getElementById('stat-label-blue').textContent = txt.statBlue;
      document.getElementById('stat-label-questions').textContent = txt.statQuestions;
      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-red').textContent = stats.red;
      document.getElementById('stat-blue').textContent = stats.blue;
      const totalUnlocked = unlockedBlue.length + unlockedRed.length;
      document.getElementById('stat-questions').textContent = totalUnlocked + '/16';

      const btnQ = document.getElementById('btn-questions');
      btnQ.classList.toggle('hidden', totalUnlocked === 0);

      const pattern = document.getElementById('pattern');
      if (stats.total < 3) {
        pattern.classList.add('hidden');
      } else {
        const bluePct = Math.round(stats.blue / stats.total * 100);
        let text;
        if (bluePct >= 70) text = txt.patternHigh(bluePct);
        else if (bluePct >= 40) text = txt.patternMid(bluePct);
        else if (bluePct >= 15) text = txt.patternLow(bluePct);
        else text = txt.patternVeryLow(bluePct);
        pattern.textContent = text;
        pattern.classList.remove('hidden');
      }
    }

    function simulateBluePercent() {
      const r = Math.random();
      // 7% — prawie wszyscy czerwony (uruchamia resultRedAllRed)
      if (r < 0.07) return Math.random() * 0.9;
      // 25% — niebieski wyraźnie wygrywa (resultBlueWon / resultRedBlueWon)
      if (r < 0.32) return 52 + Math.random() * 30;
      // 18% — blisko progu po stronie niebieskiej (drama 50/50)
      if (r < 0.50) return 43 + Math.random() * 12;
      // 30% — typowa kooperacja laboratoryjna (~lab baseline)
      if (r < 0.80) return 28 + Math.random() * 17;
      // 20% — niska kooperacja
      return 6 + Math.random() * 20;
    }

    function getResult(choice, bluePct) {
      const txt = t();
      const blueWon = bluePct > 50;
      const everyoneRed = bluePct < 1;
      if (choice === 'red') {
        if (blueWon) return txt.resultRedBlueWon;
        if (everyoneRed) return txt.resultRedAllRed;
        return txt.resultRedBlueDied;
      }
      return blueWon ? txt.resultBlueWon : txt.resultBlueDied;
    }

    function unlockNextQuestion(choice) {
      const txt = t();
      const arr = choice === 'blue' ? txt.questionsBlue : txt.questionsRed;
      const unlocked = choice === 'blue' ? unlockedBlue : unlockedRed;
      if (unlocked.length >= arr.length) return null;
      const idx = unlocked.length;
      unlocked.push(idx);
      return { text: arr[idx], number: idx + 1, side: choice, total: arr.length };
    }

    function getPattern(choice, bluePct, msg) {
      const txt = t();
      const p = bluePct.toFixed(1);
      return {
        title: msg.title,
        sub: typeof msg.sub === 'function' ? msg.sub(p) : msg.sub,
        detail: msg.detail(p),
        mood: msg.mood
      };
    }

    function hideAll() {
      ['screen-intro', 'screen-result', 'screen-reality', 'screen-questions'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }

    function choose(choice) {
      // Record first-ever vote for this device (no-op if already voted or no API)
      const wasFirstVote = !firstChoice;
      if (wasFirstVote) {
        // Optimistic UI update so the user sees their vote land
        firstChoice = choice;
        try { localStorage.setItem(FIRST_CHOICE_KEY, choice); } catch(e) {}
        globalStats[choice] = (globalStats[choice] || 0) + 1;
        globalStats.total = (globalStats.total || 0) + 1;
        renderLiveBanner();
        flashLiveStat(choice);
        recordFirstVote(choice); // Fire and forget; will reconcile counts from server
      }

      const bluePct = simulateBluePercent();
      const rawMsg = getResult(choice, bluePct);
      const msg = getPattern(choice, bluePct, rawMsg);
      stats.total++;
      if (choice === 'red') stats.red++; else stats.blue++;
      const newQ = unlockNextQuestion(choice);
      const txt = t();
      const blueWidth = Math.round(bluePct);
      const redWidth = 100 - blueWidth;

      const noNewQ = !newQ ? `<p style="font-size: 13px; opacity: 0.6; font-style: italic; margin-top: 16px;">${currentLang === 'en' ? 'All ' + (choice === 'blue' ? 'blue' : 'red') + '-questioning unlocked. Try the other side.' : 'Wszystkie pytania ' + (choice === 'blue' ? 'kwestionujące niebieski' : 'kwestionujące czerwony') + ' odkryte. Spróbuj drugiego przycisku.'}</p>` : '';

      const newQHtml = newQ ? `
        <div class="new-question ${choice}">
          <div class="new-question-label">${txt.newQuestion} · ${choice === 'blue' ? txt.blue : txt.red} #${newQ.number}/${newQ.total}</div>
          <div class="new-question-text">${newQ.text}</div>
        </div>
      ` : '';

      // Real-world live results section (only if we have any data)
      const liveResultsHtml = (apiAvailable && globalStats.total > 0) ? `
        <div class="result-live-section">
          <div class="result-section-label">
            ${wasFirstVote ? '<span class="first-vote-badge">' + txt.firstVoteBadge + '</span>' : ''}
            ${txt.liveResultsHeader}
          </div>
          ${wasFirstVote ? `<p style="font-size: 13px; line-height: 1.55; margin-top: 8px; opacity: 0.85;">${txt.firstVoteCounted(choice === 'red' ? txt.red.toLowerCase() : txt.blue.toLowerCase())}</p>` : ''}
          <div class="live-stats-grid">
            <div class="live-stat">
              <div class="live-stat-label">${txt.liveTotalLabel}</div>
              <div class="live-stat-value">${fmtNum(globalStats.total)}</div>
            </div>
            <div class="live-stat">
              <div class="live-stat-label">${txt.liveRedLabel}</div>
              <div class="live-stat-value red">${fmtNum(globalStats.red)}</div>
              <div class="live-stat-pct">${pct(globalStats.red, globalStats.total)}</div>
            </div>
            <div class="live-stat">
              <div class="live-stat-label">${txt.liveBlueLabel}</div>
              <div class="live-stat-value blue">${fmtNum(globalStats.blue)}</div>
              <div class="live-stat-pct">${pct(globalStats.blue, globalStats.total)}</div>
            </div>
          </div>
        </div>
      ` : '';

      const html = `
        <div class="result ${msg.mood}">
          <div class="result-title">${msg.title}</div>
          <div class="result-sub">${msg.sub}</div>
          <div class="histogram">
            <div class="histogram-bar">
              <div class="histogram-blue" style="width: ${blueWidth}%"></div>
              <div class="histogram-red" style="width: ${redWidth}%"></div>
            </div>
            <div class="histogram-threshold"></div>
            <div class="histogram-label">${currentLang === 'en' ? 'threshold 50% · blue: ' : 'próg 50% · niebieski: '}${bluePct.toFixed(1)}%</div>
          </div>
          <div class="result-detail">${msg.detail}</div>
          <div class="result-section">
            <div class="result-section-label">${txt.comparison}</div>
            <div class="result-section-text">${choice === 'blue' ? txt.comparisonBlue : txt.comparisonRed}</div>
          </div>
          ${liveResultsHtml}
          ${newQHtml}
          ${noNewQ}
          <div class="result-actions">
            <button class="btn" onclick="playAgain()">${txt.playAgain}</button>
            <button class="btn" onclick="showQuestions()">${txt.seeQuestions} (${unlockedBlue.length + unlockedRed.length}/16) ↗</button>
            <button class="btn" onclick="showReality()">${txt.seeReality}</button>
          </div>
        </div>
      `;

      hideAll();
      const r = document.getElementById('screen-result');
      r.innerHTML = html;
      r.classList.remove('hidden');
      document.getElementById('stats').classList.remove('hidden');
      updateStats();
    }

    function playAgain() {
      hideAll();
      document.getElementById('screen-intro').classList.remove('hidden');
    }

    function showReality() {
      const txt = t();
      let verdictHtml = '';
      if (stats.total >= 3) {
        const bluePct = Math.round(stats.blue / stats.total * 100);
        let verdict;
        if (bluePct >= 70) verdict = txt.verdictHigh(bluePct);
        else if (bluePct >= 40) verdict = txt.verdictMid(bluePct);
        else if (bluePct >= 15) verdict = txt.verdictLow(bluePct);
        else verdict = txt.verdictVeryLow(bluePct);
        verdictHtml = `<div class="verdict"><div class="verdict-label">${txt.yourPattern}</div><div class="verdict-text">${verdict}</div></div>`;
      }

      const cardsHtml = txt.researchData.map(d => `
        <div class="data-card">
          <div class="data-card-label">${d.label}</div>
          <div class="data-card-headline">${d.headline}</div>
          <div class="data-card-detail">${d.detail}</div>
        </div>
      `).join('');

      const html = `
        <h2 class="panel-title">${txt.researchTitle}</h2>
        <p class="panel-sub">${txt.researchSub}</p>
        ${verdictHtml}
        ${cardsHtml}
        <div class="summary">
          <div class="summary-label">${txt.mainPattern}</div>
          <div class="summary-headline">${txt.mainPatternHeadline}</div>
          <div class="summary-detail">${txt.mainPatternDetail}</div>
        </div>
        <div class="closing-quote">${txt.closingQuote}</div>
        <div style="text-align: center;">
          <button class="btn" onclick="playAgain()">${txt.backToGame}</button>
        </div>
      `;
      hideAll();
      const r = document.getElementById('screen-reality');
      r.innerHTML = html;
      r.classList.remove('hidden');
    }

    function showQuestions() {
      const txt = t();
      const totalUnlocked = unlockedBlue.length + unlockedRed.length;

      let metaInsight = '';
      if (totalUnlocked === 16) {
        metaInsight = `
          <div class="summary">
            <div class="summary-label">${txt.allUnlocked}</div>
            <div class="summary-headline">${txt.allUnlockedHeadline}</div>
            <div class="summary-detail">${txt.allUnlockedDetail}</div>
          </div>
        `;
      } else if (totalUnlocked >= 8) {
        metaInsight = `<div class="verdict"><div class="verdict-text">${txt.halfwayInsight(totalUnlocked)}</div></div>`;
      }

      let blueCards = '';
      for (let i = 0; i < txt.questionsBlue.length; i++) {
        const isUnlocked = unlockedBlue.includes(i);
        if (isUnlocked) {
          blueCards += `
            <div class="question-card unlocked-blue">
              <div class="question-card-label">${txt.blue} #${i + 1}</div>
              <div class="question-card-text">${txt.questionsBlue[i]}</div>
            </div>
          `;
        } else {
          blueCards += `
            <div class="question-card locked">
              <div class="question-card-label">${txt.blue} #${i + 1}</div>
              <div class="question-card-text">${txt.playLockedBlue}</div>
            </div>
          `;
        }
      }

      let redCards = '';
      for (let i = 0; i < txt.questionsRed.length; i++) {
        const isUnlocked = unlockedRed.includes(i);
        if (isUnlocked) {
          redCards += `
            <div class="question-card unlocked-red">
              <div class="question-card-label">${txt.red} #${i + 1}</div>
              <div class="question-card-text">${txt.questionsRed[i]}</div>
            </div>
          `;
        } else {
          redCards += `
            <div class="question-card locked">
              <div class="question-card-label">${txt.red} #${i + 1}</div>
              <div class="question-card-text">${txt.playLockedRed}</div>
            </div>
          `;
        }
      }

      const html = `
        <h2 class="panel-title">${txt.questionsTitle}</h2>
        <p class="panel-sub">${txt.questionsSub}</p>
        <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 24px;">${txt.questionsCount}: <span style="color: var(--accent);">${totalUnlocked}/16</span></p>
        ${metaInsight}
        <div class="questions-section">
          <div class="questions-section-title">${txt.bluePlays} (${unlockedBlue.length}/8)</div>
          ${blueCards}
        </div>
        <div class="questions-section">
          <div class="questions-section-title">${txt.redPlays} (${unlockedRed.length}/8)</div>
          ${redCards}
        </div>
        <div style="text-align: center; margin-top: 32px;">
          <button class="btn" onclick="playAgain()">${txt.backToGame}</button>
        </div>
      `;
      hideAll();
      const r = document.getElementById('screen-questions');
      r.innerHTML = html;
      r.classList.remove('hidden');
    }

    // Detect browser language and initialize global stats tracking
    (function() {
      // Set up voter identity (idempotent)
      voterId = getOrCreateVoterId();
      try { firstChoice = localStorage.getItem(FIRST_CHOICE_KEY); } catch(e) { firstChoice = null; }

      // Detect language from URL ?lang= parameter, then browser
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      const browserLang = (navigator.language || 'en').toLowerCase();

      if (urlLang === 'pl' || (!urlLang && browserLang.startsWith('pl'))) {
        setLang('pl');
      } else {
        renderIntro();
        renderLiveBanner();
      }

      // Fetch real global stats (async, non-blocking)
      fetchGlobalStats();

      // If user already voted, show subtle indicator on intro
      if (firstChoice) {
        showLiveStatus(t().liveAlreadyVoted, 'success');
      }
    })();
  </script>
</body>
</html>
